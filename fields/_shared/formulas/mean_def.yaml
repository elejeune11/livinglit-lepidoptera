# Written by code from changes.yaml (version 1); never edited.
formula: mean_def
kind: definition
statement: The mean is the sum of the values divided by n.
equations:
- m = S/n
variables:
  m: D
  S: D
  n: count
does_not_apply: medians or trimmed means
tests:
- given:
    S: 10.0
    n: 4.0
  expect:
    m: 2.5
cites:
  text: NIST/SEMATECH e-Handbook of Statistical Methods, 1.3.5.1 Measures of location
  url: https://www.itl.nist.gov/div898/handbook/

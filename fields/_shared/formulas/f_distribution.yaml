# Written by code from changes.yaml (version 1); never edited.
formula: f_distribution
kind: model
statement: Upper-tail P of an F statistic with df1 and df2 degrees of freedom.
equations:
- p = fdist_p(F, df1, df2)
variables:
  p: dimensionless
  F: dimensionless
  df1: count
  df2: count
assumes:
- normality
- independence
- equal variances
does_not_apply: non-parametric tests
tests:
- given:
    F: 4.0
    df1: 2.0
    df2: 6.0
  expect:
    p: 0.07871720116618075
cites:
  text: NIST/SEMATECH e-Handbook of Statistical Methods, 1.3.6.6.5 F distribution
  url: https://www.itl.nist.gov/div898/handbook/

# Written by code from changes.yaml (version 1); never edited.
formula: bonferroni_adjust
kind: definition
statement: The Bonferroni-adjusted P of one of m comparisons.
equations:
- pb = Min(1, m*p)
variables:
  pb: dimensionless
  p: dimensionless
  m: count
does_not_apply: step-down procedures
tests:
- given:
    p: 0.01
    m: 3.0
  expect:
    pb: 0.03
cites:
  text: NIST/SEMATECH e-Handbook of Statistical Methods, 7.4.7.3 Bonferroni's method
  url: https://www.itl.nist.gov/div898/handbook/

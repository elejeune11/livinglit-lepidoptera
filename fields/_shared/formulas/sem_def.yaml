# Written by code from changes.yaml (version 1); never edited.
formula: sem_def
kind: definition
statement: The standard error of the mean is SD divided by the square root of n.
equations:
- sem = sd/sqrt(n)
variables:
  sem: D
  sd: D
  n: count
does_not_apply: a spread that is an SD or a CI
tests:
- given:
    sd: 2.0
    n: 4.0
  expect:
    sem: 1.0
cites:
  text: NIST/SEMATECH e-Handbook of Statistical Methods, 7.2.2 Confidence limits for the mean
  url: https://www.itl.nist.gov/div898/handbook/

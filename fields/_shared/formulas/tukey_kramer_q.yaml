# Written by code from changes.yaml (version 1); never edited.
formula: tukey_kramer_q
kind: definition
statement: The Tukey–Kramer q for two of k group means, from the pooled within-group mean square MSW with N − k degrees of
  freedom.
equations:
- q = Abs(m1 - m2)/sqrt(MSW/2*(1/n1 + 1/n2))
- df = N - k
variables:
  q: dimensionless
  m1: D
  m2: D
  MSW: D**2
  n1: count
  n2: count
  df: count
  N: count
  k: count
does_not_apply: unequal variances (Games–Howell)
tests:
- given:
    m1: 3.0
    m2: 1.0
    MSW: 2.0
    n1: 2.0
    n2: 2.0
    N: 6.0
    k: 3.0
  expect:
    q: 2.0
    df: 3.0
cites:
  text: NIST/SEMATECH e-Handbook of Statistical Methods, 7.4.7.1 Tukey's method
  url: https://www.itl.nist.gov/div898/handbook/

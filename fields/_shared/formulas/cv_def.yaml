# Written by code from changes.yaml (version 1); never edited.
formula: cv_def
kind: definition
statement: The coefficient of variation is SD divided by the mean.
equations:
- cv = sd/m
variables:
  cv: dimensionless
  sd: D
  m: D
does_not_apply: a mean of zero
tests:
- given:
    sd: 1.0
    m: 4.0
  expect:
    cv: 0.25
cites:
  text: NIST/SEMATECH e-Handbook of Statistical Methods, 1.3.5.6 Measures of scale
  url: https://www.itl.nist.gov/div898/handbook/

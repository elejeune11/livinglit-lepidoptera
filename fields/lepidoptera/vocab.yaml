# Rebuilt by code from field.yaml and changes.yaml; never edited (03-vocabulary).
name: lepidoptera
version: 2
fields:
  taxon:
    kind: terms
    set: true
    scope: Lepidoptera phylogenetic tree spanning butterflies (Papilionoidea) and moths (Bombycoidea, Noctuoidea, Geometroidea,
      Pyraloidea, Saturniidae, Sphingidae, Uraniidae…) with pinned NCBITaxon xrefs.
    states: []
  sex:
    kind: terms
    set: true
    scope: specimen biological sex (male, female, male and female).
    states: []
  anatomical_region:
    kind: terms
    set: true
    scope: Anatomical body or wing region sampled (wing -> forewing/hindwing -> dorsal/ventral, margin/discal; plus thorax,
      abdomen, antenna, leg for moth acoustic/thermal scales).
    states: []
  pattern_element:
    kind: terms
    set: true
    scope: Homologous Nymphalid Groundplan (NGP) symmetry element, eyespot, band, wing compartment, or moth camouflage/acoustic
      zone.
    states:
    - not applicable
  scale_type:
    kind: terms
    set: true
    scope: Homologous scale layer and specialization tree (cover, ground, UVI, spatulate, androconia, transparent/glass, piliform
      hair-like, thoracic acoustic scale).
    states: []
  functional_architecture:
    kind: terms
    set: true
    scope: 'Extensible physical/chemical mechanism hierarchy: optical structural (ridge multilayer, lower-lamina thin film,
      inter-ridge honeycomb, 3D gyroid, cross-rib diffuser), pigmentary (melanin, pterin, ommochrome, papiliochrome, bile),
      acoustic (ultrasonic broadband absorber, resonant lamina), thermal and wetting (radiative cooler, superhydrophobic microtexture).'
    states: []
  life_stage:
    kind: terms
    set: true
    scope: organismal developmental stage at sampling (egg, larva, pupa, adult).
    states: []
  pupal_stage_pct:
    kind: quantity
    set: true
    scope: normalized percentage of total pupal development (% APF) at sampling or live imaging.
    states:
    - not applicable
  target_gene:
    kind: terms
    set: true
    scope: Homologous developmental gene, transcription factor, signaling pathway, or cytoskeletal complex targeted or profiled
      (with pinned FlyBase FBgn ortholog xrefs).
    states:
    - none
  perturbation_modality:
    kind: terms
    set: true
    scope: Experimental or evolutionary perturbation design (wild type, G0 CRISPR mosaic, knockout, RNAi, artificial selection,
      small-molecule inhibitor, FIB milling, mechanical ablation, thermal/humidity shift, vehicle control).
    states:
    - wild type
  chemical_agent:
    kind: terms
    set: true
    scope: pharmacological inhibitor, pigment precursor, or vehicle solvent (with pinned ChEBI xrefs).
    states:
    - none
  imaging_modality:
    kind: terms
    set: true
    scope: Hierarchical microscopy (SEM, FIB-SEM, TEM, confocal, SIM, AFM, optical), scattering (SAXS, USAXS), spectroscopy
      (microspectrophotometry, goniometry, Raman, FTIR), acoustic (ultrasound vibrometry, anechoic reflectivity), or genomics
      (snRNA-seq, ChIP-seq, ATAC-seq).
    states: []
  view_orientation:
    kind: terms
    set: true
    scope: Viewing geometry relative to scale plane (planar apical top-down, tilted oblique, cross-section, 3D volumetric).
    states:
    - not applicable
  hydration_and_prep:
    kind: terms
    set: true
    scope: Cuticle hydration state and specimen preparation (live in vivo, fixed hydrated, dry native, vacuum sputter-coated,
      FIB-milled, critical-point dried).
    states: []
  measure:
    kind: measure
    set: true
    scope: quantitative morphological, developmental, biomechanical, optical, acoustic, thermal, or genomic trait.
    states: []

- id: functional_architecture:optical_mechanism
  fields:
  - functional_architecture
  label: scale coloration mechanism
  definition: Physical photonic nanostructure or chemical pigment class generating scale appearance.
  scope: Root optical/coloration mechanism.
  source: LivingLit
  added: *id001
- id: functional_architecture:structural_reflector
  fields:
  - functional_architecture
  label: structural reflector
  parent: functional_architecture:optical_mechanism
  definition: Sub-wavelength chitin-air photonic nanostructure producing constructive interference.
  scope: Parent for 1D/2D/3D photonic scale architectures, distinct from pigmentary absorber.
  source: LivingLit
  added: *id001
- id: functional_architecture:pigmentary_absorber
  fields:
  - functional_architecture
  label: non-iridescent pigmentary
  parent: functional_architecture:optical_mechanism
  definition: Broadband or selective light absorption by embedded chemical pigments without coherent iridescence.
  scope: Parent for melanin and pterin pigmentary scales, distinct from structural reflector.
  source: LivingLit
  added: *id001
- id: functional_architecture:ridge_lamellar_multilayer
  fields:
  - functional_architecture
  label: ridge-lamellar reflector
  parent: functional_architecture:structural_reflector
  definition: Dense longitudinal ridges and overlapping ridge-lamellae acting as multilayer / Bragg interference reflectors.

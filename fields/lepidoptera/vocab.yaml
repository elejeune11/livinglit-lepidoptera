    honeycombs.
  xref:
  - CHEBI:17029
  source: LivingLit
  added: *id001
- id: functional_architecture:lower_lamina_thin_film
  fields:
  - functional_architecture
  label: lower-lamina thin film
  parent: functional_architecture:structural_reflector
  definition: Thin-film interference from the basal chitinous lower lamina modulated by ridge/crossrib windows.
  scope: Used for Bicyclus ground scales, distinct from ridge-lamellar reflectors and 3D honeycombs.
  xref:
  - CHEBI:17029
  source: LivingLit
  added: *id001
- id: functional_architecture:interridge_honeycomb_lattice
  fields:
  - functional_architecture
  label: inter-ridge honeycomb lattice

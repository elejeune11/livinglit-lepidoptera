    parent: null
    definition: Stage-timed microinjection of a small-molecule cytoskeletal inhibitor into developing pupae.
    scope: Distinct from solvent vehicle control and genetic knockouts.
  - event: add_term
    id: perturbation_modality:vehicle_control
    field: perturbation_modality
    label: solvent vehicle control
    parent: null
    definition: Stage-matched sham/solvent (DMSO or ethanol) pupal injection control.
    scope: ' Matched reference group for small-molecule inhibitor injections.'
  - event: add_term
    id: chemical_agent:cytochalasin_d
    field: chemical_agent
    label: cytochalasin D
    parent: null
    definition: Fungal toxin capping barbed F-actin ends and disrupting linear actin polymerization.
    scope: Inhibits linear F-actin, distinct from Arp2/3-specific CK-666 and vehicle solvents.
    xref:
    - CHEBI:53002
  - event: add_term
    id: chemical_agent:ck_666
    field: chemical_agent
    label: CK-666
    parent: null
    definition: Small-molecule allosteric inhibitor stabilizing the inactive conformation of the Arp2/3 complex.
    scope: Inhibits branched Arp2/3 actin, distinct from Cytochalasin D and vehicle solvents.
    xref:
    - CHEBI:139282
  - event: add_term
    id: chemical_agent:vehicle_solvent
    field: chemical_agent
    label: DMSO / ethanol vehicle
    parent: null
    definition: Carrier solvent (DMSO or ethanol in Grace's/PBS buffer) injected into control pupae.
    scope: Control solvent, distinct from active inhibitors CK-666 and Cytochalasin D.
    xref:
    - CHEBI:28262
    - CHEBI:16236
  - event: add_term
    id: imaging_modality:electron_microscopy
    field: imaging_modality
    label: electron microscopy
    parent: null
    definition: High-resolution electron-beam ultrastructural imaging.
    scope: Parent for planar SEM and FIB-SEM, distinct from X-ray, probe, optical, and spectroscopic methods.
  - event: add_term
    id: imaging_modality:sem
    field: imaging_modality
    label: SEM
    parent: imaging_modality:electron_microscopy
    definition: Scanning electron microscopy of scale surfaces or freeze/razor-fractured cross-sections.
    scope: Distinct from focused-ion-beam milled FIB-SEM.
  - event: add_term
    id: imaging_modality:fib_sem
    field: imaging_modality
    label: FIB-SEM
    parent: imaging_modality:electron_microscopy
    definition: Focused ion beam milling coupled with scanning electron microscopy for precision cross-sections.
    scope: Distinct from standard planar/fracture SEM.
  - event: add_term
    id: imaging_modality:x_ray_methods
    field: imaging_modality
    label: X-ray scattering & tomography
    parent: null
    definition: Synchrotron X-ray reciprocal-space scattering or real-space nanotomography.
    scope: Parent for SAXS and X-ray nano-tomography, distinct from electron and optical microscopy.
  - event: add_term
    id: imaging_modality:saxs
    field: imaging_modality
    label: SAXS
    parent: imaging_modality:x_ray_methods
    definition: Transmission small-angle X-ray scattering measuring ensemble-averaged Bragg ridge pitch.
    scope: Reciprocal-space diffraction, distinct from real-space X-ray nano-tomography.
  - event: add_term
    id: imaging_modality:x_ray_nano_tomography
    field: imaging_modality
    label: X-ray nano-tomography
    parent: imaging_modality:x_ray_methods
    definition: 3D synchrotron phase-contrast X-ray nanotomography.
    scope: Real-space 3D X-ray imaging, distinct from SAXS.
  - event: add_term
    id: imaging_modality:afm_spm
    field: imaging_modality
    label: AFM/SPM
    parent: null
    definition: Atomic force / scanning probe surfaceprofilometry.
    scope: Contact/tapping probe topography, distinct from electron, X-ray, and optical modalities.
  - event: add_term
    id: imaging_modality:optical_microscopy
    field: imaging_modality
    label: optical microscopy
    parent: null
    definition: Visible/laser light, fluorescence, super-resolution, or quantitative phase microscopy.
    scope: Parent for brightfield, confocal, 3D-SIM, reflection phase, and HCR imaging.
  - event: add_term
    id: imaging_modality:light_microscopy
    field: imaging_modality
    label: light microscopy
    parent: imaging_modality:optical_microscopy
    definition: Reflected/transmitted brightfield or epi-illumination wing photography.
    scope: Distinct from fluorescence confocal, 3D-SIM, reflection phase, and HCR.
  - event: add_term
    id: imaging_modality:confocal
    field: imaging_modality
    label: confocal
    parent: imaging_modality:optical_microscopy
    definition: Laser-scanning confocal fluorescence microscopy.
    scope: Diffraction-limited optical sectioning, distinct from 3D-SIM, phase microscopy, and brightfield.
  - event: add_term
    id: imaging_modality:sim_3d
    field: imaging_modality
    label: 3D-SIM
    parent: imaging_modality:optical_microscopy
    definition: 3D structured illumination super-resolution fluorescence microscopy.
    scope: Super-resolution fluorescence, distinct from standard confocal and reflection phase microscopy.
  - event: add_term
    id: imaging_modality:reflection_phase_microscopy
    field: imaging_modality
    label: reflection phase microscopy
    parent: imaging_modality:optical_microscopy
    definition: Label-free interferometric / speckle-correlation quantitative phase height imaging of live pupal scales.
    scope: Label-free nanometric height profilometry, distinct from fluorescence confocal and 3D-SIM.
  - event: add_term
    id: imaging_modality:hcr_in_situ
    field: imaging_modality
    label: HCR/in situ
    parent: imaging_modality:optical_microscopy
    definition: Hybridization chain reaction (HCR3.0) mRNA in situ and immunohistochemistry imaging.
    scope: Spatial transcript/protein mapping, distinct from structural phase and brightfield microscopy.
  - event: add_term
    id: imaging_modality:microspectrophotometry
    field: imaging_modality
    label: microspectrophotometry
    parent: null
    definition: UV-vis reflectance spectroscopy (integrating sphere, bifurcated probe, or microspectrophotometer).
    scope: Spectral reflectance measurement, distinct from spatial imaging modalities.
  - event: add_term
    id: view_orientation:planar_apical
    field: view_orientation
    label: planar normal view
    parent: null
    definition: Orthographic or normal-incidence measurement perpendicular to the scale lamina.
    scope: Unforeshortened lateral pitch geometry; parent for top-down apical and whole-mount, distinct from tilted oblique
      and vertical/3D.
  - event: add_term
    id: view_orientation:top_down_apical
    field: view_orientation
    label: top-down apical
    parent: view_orientation:planar_apical
    definition: Normal-incidence apical surface view of individual scales.
    scope: Distinct from whole-mount wing transmission/epi view.
  - event: add_term
    id: view_orientation:whole_mount
    field: view_orientation
    label: whole-mount
    parent: view_orientation:planar_apical
    definition: Intact wing or whole-scale normal-incidence geometry (e.g. transmission SAXS or whole-wing imaging).
    scope: Distinct from isolated single-scale top-down apical micrographs.
  - event: add_term
    id: view_orientation:tilted_oblique
    field: view_orientation
    label: tilted oblique
    parent: null
    definition: Oblique stage-tilted viewing geometry introducing cos(theta) lateral pitch foreshortening.
    scope: Must never be pooled directly with planar_apical lateral pitch without cos(theta) correction.
  - event: add_term
    id: view_orientation:vertical_or_3d
    field: view_orientation
    label: vertical cross-section or 3D
    parent: null
    definition: Geometry resolving vertical z-height (ridge height, honeycomb height, lamina thickness).
    scope: Parent for 2D physical cross-sections and 3D volumetric reconstructions, distinct from planar_apical and tilted_oblique.
  - event: add_term
    id: view_orientation:cross_section
    field: view_orientation
    label: cross-section
    parent: view_orientation:vertical_or_3d
    definition: Transverse physical section perpendicular to longitudinal ridges (FIB-SEM or fracture SEM).
    scope: 2D transverse slice, distinct from non-destructive 3D volumetric stacks.
  - event: add_term
    id: view_orientation:volumetric_3d
    field: view_orientation
    label: 3D volumetric
    parent: view_orientation:vertical_or_3d
    definition: 3D optical/X-ray/phase reconstruction resolving z-height across an area.
    scope: Non-destructive 3D stack, distinct from milled 2D cross-section.
  - event: add_term
    id: hydration_and_prep:hydrated_state
    field: hydration_and_prep
    label: hydrated pupal/fixed state
    parent: null
    definition: Aqueous physiological or fixed hydrated state prior to adult desiccation shrinkage.
    scope: Parent for live in vivo and fixed hydrated tissues, distinct from dehydrated adult cuticle.
  - event: add_term
    id: hydration_and_prep:live_in_vivo
    field: hydration_and_prep
    label: live in vivo
    parent: hydration_and_prep:hydrated_state
    definition: Intact living pupa imaged through a surgical cuticle/coverslip window.
    scope: Unfixed living state, distinct from fixed and stained hydrated tissue.
  - event: add_term
    id: hydration_and_prep:fixed_hydrated
    field: hydration_and_prep
    label: fixed and stained
    parent: hydration_and_prep:hydrated_state
    definition: Aldehyde-fixed, buffer-mounted fluorescently stained developing wing tissue.
    scope: Fixed aqueous state, distinct from live in vivo.
  - event: add_term
    id: hydration_and_prep:dehydrated_state
    field: hydration_and_prep
    label: dry sclerotized state
    parent: null
    definition: Dehydrated adult chitinous cuticle (after ~20-25% post-eclosion drying contraction).
    scope: Parent for dry native, vacuum sputter coated, and FIB milled adult scales, distinct from hydrated state.
  - event: add_term
    id: hydration_and_prep:dry_native
    field: hydration_and_prep
    label: dry mounted
    parent: hydration_and_prep:dehydrated_state
    definition: Uncoated dry adult wing or isolated scale in air (SAXS, AFM, spectroscopy).
    scope: Uncoated dry cuticle, distinct from metal sputter-coated or FIB-milled samples.
  - event: add_term
    id: hydration_and_prep:vacuum_sputter_coated
    field: hydration_and_prep
    label: sputter coated
    parent: hydration_and_prep:dehydrated_state
    definition: Au/Pd or Pt conductive sputter-coated scale under high-vacuum SEM.
    scope: Conductive metal-coated dry sample, distinct from uncoated dry native and FIB milled.
  - event: add_term
    id: hydration_and_prep:fib_milled
    field: hydration_and_prep
    label: FIB milled
    parent: hydration_and_prep:dehydrated_state
    definition: Gallium/plasma focused-ion-beam trenched cross-section in vacuum.
    scope: Ion-milled cross-section, distinct from intact sputter-coated surface SEM and dry native.
  - event: add_term
    id: measure:ridge_spacing
    field: measure
    label: ridge spacing
    parent: null
    definition: Center-to-center lateral period (pitch d) between adjacent longitudinal scale ridges.
    scope: Distinct from crossrib spacing, actin bundle spacing, and ridge width.
    dimension: length
  - event: add_term
    id: measure:ridge_density
    field: measure
    label: ridge density
    parent: null
    definition: Spatial frequency of longitudinal ridges per unit width (rho = 1/d).
    scope: Reciprocal of ridge spacing, distinct from ridge number per scale.
    dimension: 1/length
  - event: add_term
    id: measure:ridge_height
    field: measure
    label: ridge height
    parent: null
    definition: Vertical elevation of longitudinal ridges from base/lower lamina to ridge crest.
    scope: Distinct from honeycomb lattice height and lower lamina thickness.
    dimension: length
  - event: add_term
    id: measure:ridge_width
    field: measure
    label: ridge width
    parent: null
    definition: Lateral full width of an individual longitudinal ridge.
    scope: Distinct from center-to-center ridge spacing.
    dimension: length
  - event: add_term
    id: measure:ridge_curvature
    field: measure
    label: ridge curvature
    parent: null
    definition: Local in-plane bending curvature kappa (um^-1) of longitudinal ridges.
    scope: Quantifies Euler buckling waviness after actin disruption, distinct from ridge density.
    dimension: 1/length
  - event: add_term
    id: measure:ridge_number
    field: measure
    label: ridge number
    parent: null
    definition: Total count of parallel longitudinal ridges spanning a scale's width.
    scope: Whole-scale count, distinct from ridge density.
    dimension: count
  - event: add_term
    id: measure:crossrib_spacing
    field: measure
    label: crossrib spacing
    parent: null
    definition: Longitudinal center-to-center distance between adjacent transverse crossribs.
    scope: Orthogonal to ridge spacing.
    dimension: length
  - event: add_term
    id: measure:honeycomb_lattice_height
    field: measure
    label: honeycomb lattice height
    parent: null
    definition: Vertical thickness of the crossrib alveolar/honeycomb wall lattice between ridges.
    scope: Distinct from total ridge height and lower lamina thickness.
    dimension: length
  - event: add_term
    id: measure:lower_lamina_thickness
    field: measure
    label: lower lamina thickness
    parent: null
    definition: Vertical thickness of the basal chitinous lower lamina.
    scope: Distinct from ridge height and honeycomb lattice height.
    dimension: length
  - event: add_term
    id: measure:scale_width
    field: measure
    label: scale width
    parent: null
    definition: Maximum transverse width of a single wing scale blade.
    scope: Distinct from scale area and ridge spacing.
    dimension: length
  - event: add_term
    id: measure:scale_area
    field: measure
    label: scale area
    parent: null
    definition: Total planar projected surface area of a single wing scale.
    scope: 2D area, distinct from linear scale width.
    dimension: area
  - event: add_term
    id: measure:actin_bundle_spacing
    field: measure
    label: actin bundle spacing
    parent: null
    definition: Center-to-center spacing L between adjacent longitudinal F-actin bundles in pupal scales.
    scope: Intracellular cytoskeletal pre-pattern pitch, distinct from cuticular ridge spacing.
    dimension: length
  - event: add_term
    id: measure:actin_bundle_width
    field: measure
    label: actin bundle width
    parent: null
    definition: Transverse diameter of individual pupal F-actin bundles.
    scope: Distinct from actin bundle spacing.
    dimension: length
  - event: add_term
    id: measure:critical_buckling_strain
    field: measure
    label: critical buckling strain
    parent: null
    definition: Dimensionless threshold compressive growth strain g_c initiating plasma membrane buckling.
    scope: Dimensionless mechanical threshold.
    dimension: dimensionless
  - event: add_term
    id: measure:maximum_reflectance
    field: measure
    label: maximum reflectance
    parent: null
    definition: Peak percentage or amplitude of reflected light across the UV-vis spectrum.
    scope: Spectral intensity %, distinct from peak reflectance wavelength.
    dimension: fraction_percent
  - event: add_term
    id: measure:peak_reflectance_wavelength
    field: measure
    label: peak reflectance wavelength
    parent: null
    definition: Spectral wavelength lambda_max (nm) of maximum constructive interference reflectance.
    scope: Spectral hue position, distinct from maximum reflectance amplitude.
    dimension: length
  - event: add_term
    id: measure:developmental_milestone_timing
    field: measure
    label: developmental milestone timing
    parent: null
    definition: Post-pupation time (h/d APF or % pupal development) at which a morphogenetic transition occurs.
    scope: Temporal developmental landmark.
    dimension: time
  - event: add_term
    id: measure:relative_pupal_development
    field: measure
    label: relative pupal development
    parent: null
    definition: Normalized percentage of total pupal development (% APF) elapsed at sampling.
    scope: Temperature-normalized % pupal timeline, distinct from raw hours APF.
    dimension: fraction_percent
  - event: add_term
    id: measure:eyespot_duplication_count
    field: measure
    label: eyespot duplication count
    parent: null
    definition: Number of mosaic crispant individuals differentiating supernumerary eyespot foci.
    scope: Phenotypic penetrance count, distinct from scale orientation defect count.
    dimension: count
  - event: add_term
    id: measure:scale_orientation_defect_count
    field: measure
    label: scale orientation defect count
    parent: null
    definition: Number of crispant individuals showing planar cell polarity scale rotation defects.
    scope: PCP penetrance count, distinct from eyespot duplication count.
    dimension: count
  - event: add_term
    id: measure:crispant_wing_phenotype_count
    field: measure
    label: crispant wing phenotype count
    parent: null
    definition: Number of G0 CRISPR mosaic individuals exhibiting variegated wing pattern transformation.
    scope: Mosaic penetrance count.
    dimension: count
  - event: standing_key
    measure: measure:ridge_spacing
    value:
      must_match:
      - scale_type@2
      - photonic_architecture@3
      - life_stage
      - view_orientation@1
      - hydration_and_prep@1
      - perturbation_modality
      may_vary:
      - taxon
      - sex
      - wing_surface
      - pattern_element
      - imaging_modality
    direction:
      must_match:
      - contrast
  - event: standing_key
    measure: measure:ridge_height
    value:
      must_match:
      - scale_type@2
      - life_stage
      - pupal_stage_pct
      - view_orientation@1
      - perturbation_modality
      may_vary:
      - taxon
      - wing_surface
      - imaging_modality
    direction:
      must_match:
      - contrast
  - event: standing_key
    measure: measure:crossrib_spacing
    value:
      must_match:
      - scale_type@2
      - photonic_architecture@2
      - life_stage
      - view_orientation@1
      - perturbation_modality
      may_vary:
      - taxon
      - imaging_modality
    direction:
      must_match:
      - contrast
  - event: standing_key
    measure: measure:scale_width
    value:
      must_match:
      - scale_type@2
      - life_stage
      - hydration_and_prep@1
      - perturbation_modality
      may_vary:
      - taxon
      - wing_surface
      - pattern_element
    direction:
      must_match:
      - contrast
  - event: standing_key
    measure: measure:honeycomb_lattice_height
    value:
      must_match:
      - life_stage
      - view_orientation@1
      - perturbation_modality
      may_vary:
      - taxon
    direction:
      must_match:
      - contrast

<meta charset="utf-8">
<title>LivingLit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a question index on the left (a strip of tabs on phones); each question opens a working view of the release. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ed; --ink:#121b26; --muted:#56636f; --line:#cfd7df;
  --accent:#2f47b8; --accent-ink:#ffffff; --accent-soft:#dfe4fa;
  --good:#23824f; --good-soft:#cfe9da; --warn:#b06d07; --warn-soft:#f6e3c3; --bad:#c0312d; --bad-soft:#f6d3d1;
  --none:#9aa5b0; --none-soft:#e1e6eb;
  --o-stated:#56636f; --o-data:#23824f; --o-read:#2f47b8; --o-derived:#b06d07;
  --g-paper:#121b26; --g1:#2f47b8; --g2:#11817f; --g3:#b06d07; --g4:#23824f; --g5:#a03a8c; --g6:#c0312d; --g-link:#9aa9b8;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#16202a; --sunk:#1d2935; --ink:#e4eaf0; --muted:#97a5b2; --line:#2c3b49;
  --accent:#8fa2ff; --accent-ink:#0f151c; --accent-soft:#25305e;
  --good:#5cc78d; --good-soft:#1c3b2b; --warn:#e7a948; --warn-soft:#3f3017; --bad:#f07a74; --bad-soft:#47201f;
  --none:#6d7b88; --none-soft:#26323e;
  --o-stated:#a6b3bf; --o-data:#5cc78d; --o-read:#8fa2ff; --o-derived:#e7a948;
  --g-paper:#e4eaf0; --g1:#8fa2ff; --g2:#4fc7c3; --g3:#e7a948; --g4:#5cc78d; --g5:#de86cc; --g6:#f07a74; --g-link:#4a5c6e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#16202a; --sunk:#1d2935; --ink:#e4eaf0; --muted:#97a5b2; --line:#2c3b49;
  --accent:#8fa2ff; --accent-ink:#0f151c; --accent-soft:#25305e;
  --good:#5cc78d; --good-soft:#1c3b2b; --warn:#e7a948; --warn-soft:#3f3017; --bad:#f07a74; --bad-soft:#47201f;
  --none:#6d7b88; --none-soft:#26323e;
  --o-stated:#a6b3bf; --o-data:#5cc78d; --o-read:#8fa2ff; --o-derived:#e7a948;
  --g-paper:#e4eaf0; --g1:#8fa2ff; --g2:#4fc7c3; --g3:#e7a948; --g4:#5cc78d; --g5:#de86cc; --g6:#f07a74; --g-link:#4a5c6e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
.mono,code{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
nav.index{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);
  padding-block:var(--s5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
nav.index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.index a{display:block;padding:7px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.3}
nav.index a:hover{background:var(--sunk)}
nav.index a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.index .grp{margin-top:var(--s3)}
main{min-width:0;padding-block:var(--s6);padding-left:var(--s6);padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:1120px;display:flex;flex-direction:column;gap:var(--s5)}
.lede{max-width:68ch;color:var(--muted);font-size:1.05rem;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5);min-width:0}
.panel>h3{margin-bottom:var(--s3)}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s4)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}
.stat{padding:var(--s3) var(--s4);border-left:3px solid var(--accent);background:var(--surface)}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.88rem;color:var(--muted)}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s3)}
.q{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.q:hover{border-color:var(--accent)}
.q h3{font-size:1.1rem}
.q p{margin:0;font-size:.95rem;color:var(--muted)}
.q .ans{font-size:.95rem;color:var(--ink)}
.q .go{margin-top:auto;font-family:var(--f-display);font-size:.85rem;color:var(--accent);font-weight:600}
.limits{border:1px dashed var(--line);border-radius:var(--r);padding:var(--s4) var(--s5);background:transparent}
.limits ul{margin:var(--s2) 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:80ch}

.controls{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:end}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);min-width:0}
select,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;max-width:100%;min-width:0}
input[type=search]{min-width:240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap;font-family:var(--f-body)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.none{background:var(--none-soft);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* stacked bars */
.sbars{display:flex;flex-direction:column;gap:5px}
.sbar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.5em;gap:var(--s3);align-items:center;font-size:.86rem;cursor:pointer;border-radius:4px;padding:1px 2px}
.sbar:hover{background:var(--sunk)}
.sbar.sel{background:var(--accent-soft)}
.sbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.track i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* bar lists */
.blist{display:flex;flex-direction:column;gap:6px}
.bl{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr) 4em;gap:var(--s3);align-items:center;font-size:.88rem}
.bl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .b{height:12px;background:var(--accent);border-radius:2px;min-width:2px}

/* heat matrix */
.scroller{overflow-x:auto;max-width:100%}
table.mx{border-collapse:separate;border-spacing:2px;font-size:.78rem}
table.mx th{font-weight:500;color:var(--muted)}
table.mx th.col{height:120px;vertical-align:bottom;padding:0}
table.mx th.col div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-family:var(--f-mono);font-size:.72rem;padding:2px 0;max-height:118px;overflow:hidden}
table.mx th.rowh{text-align:left;white-space:nowrap;padding-right:var(--s2);cursor:pointer;color:var(--ink);font-weight:500;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.mx th.rowh:hover{color:var(--accent)}
table.mx td{width:20px;height:20px;border-radius:3px;padding:0;text-align:center;cursor:pointer;font-variant-numeric:tabular-nums;font-size:.66rem}
table.mx td.z{background:var(--sunk);cursor:default}
table.mx td.np{color:var(--muted);text-align:right;padding-left:var(--s2);cursor:default;font-size:.78rem;width:auto}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-weight:600;font-family:var(--f-display);font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
table.t tr.sel td{background:var(--accent-soft)}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}

.cards{display:flex;flex-direction:column;gap:var(--s2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:6px;min-width:0}
.card .head{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;font-size:.85rem;color:var(--muted)}
.card q{font-style:italic;quotes:"\201C" "\201D"}
.card .eq{font-family:var(--f-mono);font-size:.86rem;background:var(--sunk);padding:4px 8px;border-radius:4px;overflow-x:auto;white-space:pre}
.more{align-self:start}
.empty{color:var(--muted);font-style:italic;padding:var(--s3) 0}
.note{font-size:.88rem;color:var(--muted);max-width:80ch;margin:0}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--s5);align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5)}
.cover-fig{margin:0;display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.cover-fig img{display:block;width:100%;height:auto;border-radius:4px;background:#fff}
.cover-fig figcaption{font-size:.85rem;color:var(--muted)}
.cover-cite{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.cover-cite h2{font-size:1.3rem}
.cover-ref{margin:0;font-size:.92rem;overflow-wrap:anywhere}
.cover-sum{margin:0;max-width:62ch}
@media (max-width:1000px){.cover{grid-template-columns:minmax(0,1fr)}}

/* knowledge graph */
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4);align-items:start}
.gbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.gbox svg{display:block;width:100%;cursor:grab;touch-action:none}
.gbox svg:active{cursor:grabbing}
.gbox line{stroke:var(--g-link);stroke-opacity:.55}
.gbox line.hot{stroke:var(--ink);stroke-opacity:.8}
.gbox g.n circle{stroke:var(--surface);stroke-width:1.2;cursor:pointer}
.gbox g.n.paper circle{fill:var(--g-paper)}
.gbox g.n.sel circle{stroke:var(--accent);stroke-width:3}
.gbox text{font-family:var(--f-body);font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.gbox g.n.paper text{font-weight:600;font-size:11px}
.gbox g.n text.tl{display:none}
.gbox g.n.show text.tl{display:block}
.gbox .dim{opacity:.1}
.gbox .zoomhint{position:absolute;right:10px;bottom:8px;font-size:.75rem;color:var(--muted);background:var(--surface);padding:2px 6px;border-radius:4px}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layers button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.84rem;cursor:pointer}
.layers button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk);font-weight:600}
.gpanel{display:flex;flex-direction:column;gap:var(--s3);max-height:760px;overflow:auto}
.gpanel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.gpanel li{display:flex;gap:var(--s2);justify-content:space-between}
.gpanel li button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-size:inherit}
@media (max-width:1100px){.gwrap{grid-template-columns:minmax(0,1fr)}.gpanel{max-height:none}}

/* dot plot */
.plot svg{display:block;width:100%;height:auto}
.plot text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.plot .ptitle{fill:var(--ink);font-size:12px}
.plot line.grid{stroke:var(--line)}
.plot circle{stroke:var(--surface);stroke-width:.8}
.plot circle.dim{opacity:.15}
.tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:5px;font-size:.8rem;max-width:320px;line-height:1.35}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.index{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);
    padding-block:var(--s2);padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  nav.index ol{flex-direction:row}
  nav.index a{white-space:nowrap;font-size:.88rem}
  nav.index .grp,.brand span,.navfoot{display:none}
  .brand b{white-space:nowrap;font-size:1.05rem}
  main{padding-block:var(--s5);padding-left:max(16px,env(safe-area-inset-left,0px))}
  input[type=search]{min-width:0;width:100%}
}
@media (prefers-reduced-motion:no-preference){.q,.btn{transition:border-color .12s}}
/* one result */
a.card{text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--accent)}
a.rl{font-family:var(--f-mono);font-size:.86em}
.crumbs{font-size:.9rem;color:var(--muted)}
blockquote{margin:0;padding:var(--s2) var(--s4);border-left:3px solid var(--line);font-style:italic}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px var(--s4);margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.flag{background:var(--warn-soft);border-radius:4px;padding:4px 8px;font-size:.86rem;margin-top:4px}
.o-data{color:var(--o-data)} .o-read{color:var(--o-read)} .o-stated{color:var(--o-stated)} .o-derived{color:var(--o-derived)}
.notice{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.86rem;text-align:center}
</style>

<div class="notice" role="note"><b>Work in progress:</b> results are produced by LLM agent jobs and checked by code, but not yet reviewed by people; <a href="https://github.com/elejeune11/LivingLit-public">check a record before citing it</a>.</div>
<div class="shell">
  <nav class="index" aria-label="Questions">
    <div class="brand"><b>LivingLit</b><span id="tagline"></span></div>
    <ol id="nav"></ol>
    <p class="note navfoot" id="navfoot"></p>
  </nav>
  <main id="main"></main>
</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const D = /*DATA*/null;

// ---------- helpers
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US");
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
const lab = id => D.label[id] || String(id || "").replace(/^[a-z_]+:/, "").replace(/_/g, " ");
const short = p => { const [y, ...r] = p.split("_"); return r.join(" ") + " " + y.slice(2); };
const paperById = Object.fromEntries(D.P.map(p => [p.id, p]));
const PIDS = D.P.map(p => p.id);
const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
const tip = $("#tip");
function showTip(e, html){ tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e){ const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip(){ tip.hidden = true; }
const opt = (v, t, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(t)}</option>`;
const paperSelect = (id, cur, extra="All papers") => `<select id="${id}">${opt("", extra, !cur)}${PIDS.map(p => opt(p, short(p), p === cur)).join("")}</select>`;

const ITEM_STATUS = [["consistent","good","Consistent"],["consistent within reading","good2","Consistent within reading"],["close","warn","Close"],["inconsistent","bad","Inconsistent"],["cannot check","none","Cannot check"]];
const CLAIM_V = [["follows","good","Follows"],["overstated","warn","Overstated"],["does not follow","bad","Does not follow"],["cannot judge","none","Cannot judge"],["no verdict","none2","No verdict"]];
const col = k => ({good:"var(--good)",good2:"color-mix(in srgb,var(--good) 55%,var(--surface))",warn:"var(--warn)",bad:"var(--bad)",none:"var(--none)",none2:"var(--none-soft)",acc:"var(--accent)"}[k]);
const chipCls = v => ({consistent:"good","consistent within reading":"good",close:"warn",inconsistent:"bad","cannot check":"none",follows:"good",overstated:"warn","does not follow":"bad","cannot judge":"none","no verdict":"none",agree:"good",differ:"warn"}[v] || (String(v).startsWith("same") ? "good" : String(v).startsWith("differ") ? "warn" : "none"));
const chip = v => `<span class="chip ${chipCls(v)}">${esc(v)}</span>`;

function stackBar(parts, total){
  return `<div class="track">${parts.filter(p => p.n).map(p => `<i style="width:${100*p.n/total}%;background:${col(p.k)}" title="${esc(p.t)}: ${fmt(p.n)}"></i>`).join("")}</div>`;
}
function legend(defs){ return `<div class="legend">${defs.map(([, k, t]) => `<span><i class="dot" style="background:${col(k)}"></i>${esc(t)}</span>`).join("")}</div>`; }
function barList(rows, {fmtv = fmt, max} = {}){
  const m = max ?? Math.max(1, ...rows.map(r => r[1]));
  return `<div class="blist">${rows.map(([n, v, t]) => `<div class="bl"><span class="nm" title="${esc(n)}">${esc(n)}</span><span><span class="b" style="display:block;width:${100*v/m}%"></span></span><span class="num muted" style="text-align:right">${t ?? fmtv(v)}</span></div>`).join("")}</div>`;
}
function pager(list, render, step = 60){
  let shown = step;
  const id = "pg" + Math.random().toString(36).slice(2, 8);
  const draw = () => {
    const box = document.getElementById(id); if (!box) return;
    box.innerHTML = (list.length ? list.slice(0, shown).map(render).join("") : `<p class="empty">Nothing matches these filters.</p>`) +
      (list.length > shown ? `<button class="btn more" type="button">Show ${Math.min(step, list.length - shown)} more of ${fmt(list.length - shown)}</button>` : "");
    const b = box.querySelector(".more"); if (b) b.onclick = () => { shown += step; draw(); };
  };
  setTimeout(draw);
  return `<div class="cards" id="${id}"></div>`;
}

// ---------- derived numbers

function buildMeetSections(){
  const minP = MS_STATE.single ? 1 : 2;
  const mMap = {};
  D.I.forEach(i => i[3].forEach(m => { ((mMap[m] ||= {})[i[0]] = (mMap[m][i[0]] || 0) + 1); }));

  function rowsForField(fld){
    const src = fld === "measure" ? mMap : ((D.CTXP || {})[fld] || {});
    const entries = Object.entries(src).map(([t, pmap]) => ({
      fld, term: t, pmap, nPapers: Object.keys(pmap).length,
      depth: (D.DEPTH && D.DEPTH[t]) || 0,
      tot: Object.values(pmap).reduce((a, b) => a + b, 0)
    })).filter(r => r.nPapers >= minP && !r.term.startsWith("state:not"));
    if (fld === "taxon") {
      // Preserve phylogenetic tree order using term order in D.T
      const orderIdx = new Map(D.T.map((t, idx) => [t[0], idx]));
      entries.sort((a, b) => (orderIdx.get(a.term) ?? 999) - (orderIdx.get(b.term) ?? 999));
    } else {
      entries.sort((a, b) => b.nPapers - a.nPapers || a.depth - b.depth || lab(a.term).localeCompare(lab(b.term)));
    }
    return entries;
  }

  if (MS_STATE.tab === "all") {
    return [
      ["Measures", rowsForField("measure")],
      ["Taxa & clades (phylogenetic roll-up)", rowsForField("taxon")],
      ["Perturbations, genes & chemical agents", [
        ...rowsForField("perturbation_modality"), ...rowsForField("target_gene"), ...rowsForField("chemical_agent")
      ]],
      ["Scale homology, wing pattern & photonic architecture", [
        ...rowsForField("photonic_architecture"), ...rowsForField("scale_type"), ...rowsForField("pattern_element"), ...rowsForField("wing_surface"), ...rowsForField("life_stage")
      ]],
      ["Imaging modality, viewing geometry & hydration", [
        ...rowsForField("imaging_modality"), ...rowsForField("view_orientation"), ...rowsForField("hydration_and_prep")
      ]],
    ].filter(([, rs]) => rs.length > 0);
  }
  const grp = MS_GROUPS.find(g => g[0] === MS_STATE.tab) || MS_GROUPS[0];
  return grp[2].map(f => [fieldName(f), rowsForField(f)]).filter(([, rs]) => rs.length > 0);
}

function drawMeetMatrix(){
  const box = $("#mx"); if (!box) return;
  const sections = buildMeetSections();
  const allCounts = sections.flatMap(([, rs]) => rs.flatMap(r => Object.values(r.pmap)));

  const cell = (r, p) => {
    const c = r.pmap[p];

    return `<td data-t="${esc(r.term)}" data-f="${esc(r.fld)}" data-p="${p}" style="background:color-mix(in srgb,var(--accent) ${a}%,var(--surface));color:${a > 55 ? "var(--accent-ink)" : "var(--ink)"}" title="${esc(lab(r.term))} · ${esc(short(p))}: ${c} results">${c > 99 ? "" : c}</td>`;

    tbody += `<tr><td colspan="${PIDS.length + 2}" style="text-align:left;padding:10px 8px 4px;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--sunk)">${esc(secTitle)} (${rs.length})</td></tr>`;

    });
  });
  box.innerHTML = `<table class="mx">
    <thead><tr><th>Term / clade / perturbation / measure</th>${PIDS.map(p => `<th class="col"><div title="${esc(paperById[p].title)}">${esc(short(p))}</div></th>`).join("")}<th class="col"><div>papers</div></th></tr></thead>

    else if (th) meetDetail(th.dataset.t, "", th.dataset.f);
  };
}

// knowledge graph
const fieldName = k => { const s = String(k).replace(/_/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); };
// context fields that link at least two papers through a shared term, most linking first (chosen from the release)
const LAYERS = [["measure", "Measures", "g1"], ["stratum", "Measure × contrast", "g2"]].concat(
  Object.entries(D.CTXP || {})
    .map(([k, ts]) => [k, Object.values(ts).filter(ps => Object.keys(ps).length >= 2).length])
    .filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 16)
    .map(([k], i) => [k, fieldName(k), ["g3", "g4", "g5", "g6"][i % 4]]));
const LAYER = Object.fromEntries(LAYERS.map(l => [l[0], l]));
const GS = { layers: new Set(["measure"]), mode: "bi", single: false, minShared: 10, sel: null };
let gSim = null;
function termsFor(L){
  const m = new Map();
  const add = (t, p, c = 1) => { if (!m.has(t)) m.set(t, new Map()); const x = m.get(t); x.set(p, (x.get(p) || 0) + c); };
  if (L === "measure") D.I.forEach(i => i[3].forEach(t => add(t, i[0])));
  else if (L === "stratum") D.ST.forEach(s => s.items.forEach(it => add(s.id, it.split("/")[0])));
  else Object.entries(D.CTXP[L] || {}).forEach(([t, ps]) => Object.entries(ps).forEach(([p, c]) => add(t, p, c)));
  return m;
}
function termLabel(L, t){
  if (L === "stratum"){ const s = D.ST.find(x => x.id === t); return s ? `${lab(s.measure)} × ${s.key.replace("contrast=", "").replace(/_/g, " ")}` : t; }
  return lab(t);
}
function buildGraph(){
  const nodes = [], links = [], adj = new Map(), terms = [];
  const link = (a, b, o) => { links.push({source: a, target: b, ...o}); (adj.get(a) || adj.set(a, new Set()).get(a)).add(b); (adj.get(b) || adj.set(b, new Set()).get(b)).add(a); };
  PIDS.forEach(p => nodes.push({id: "P|" + p, type: "paper", p, r: 4 + Math.sqrt(paperById[p].items || 1) / 1.7}));
  GS.layers.forEach(L => termsFor(L).forEach((ps, t) => { if (GS.single || ps.size >= 2) terms.push({L, t, ps}); }));
  if (GS.mode === "bi"){
    terms.forEach(x => { const id = x.L + "|" + x.t;
      nodes.push({id, type: "term", L: x.L, t: x.t, ps: x.ps, r: 2.5 + Math.sqrt(x.ps.size) * 1.5});
      x.ps.forEach((c, p) => link("P|" + p, id, {w: c})); });
  } else {
    const pair = new Map();
    terms.forEach(x => { const ps = [...x.ps.keys()].sort();
      for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++){ const k = ps[i] + "||" + ps[j];
        if (!pair.has(k)) pair.set(k, []); pair.get(k).push(x); } });
    pair.forEach((ts, k) => { if (ts.length >= GS.minShared){ const [a, b] = k.split("||"); link("P|" + a, "P|" + b, {w: ts.length, terms: ts}); } });
  }
  return {nodes, links, adj, terms};
}

function drawPlot(){
  const s = D.VM[VS.set]; if (!s) return;
  const ci = D.CTX.indexOf(VS.ctx);
  const rows = D.V.filter(v => v[0] === s.measure && v[1] === s.unit);
  const papers = [...new Set(rows.map(r => r[2]))].sort();
  const W = 900, rowH = 26, top = 30, left = 150, right = 20, H = top + papers.length * rowH + 30;
  const xs = rows.map(r => r[5]).filter(x => VS.scale === "lin" || x > 0);
  let lo = Math.min(...xs), hi = Math.max(...xs);
  const log = VS.scale === "log" && lo > 0;
  if (log){ lo = Math.log10(lo); hi = Math.log10(hi); }
  if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * .04; lo -= pad; hi += pad;
  const X = x => left + (W - left - right) * (((log ? Math.log10(x) : x) - lo) / (hi - lo));
  const ticks = []; const nt = 6;
  if (log){ for (let e = Math.ceil(lo); e <= Math.floor(hi); e++) ticks.push(10 ** e); }
  else { const step = niceStep((hi - lo) / nt); for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) ticks.push(+t.toPrecision(10)); }

  const origCol = o => o === "from data" ? "var(--o-data)" : o === "read" ? "var(--o-read)" : o.startsWith("derived") ? "var(--o-derived)" : "var(--o-stated)";

  svg += `<text class="ptitle" x="${left}" y="16">${esc(lab(s.measure))} (${esc(s.unit)})${log ? ", log scale" : ""}</text>`;
  ticks.forEach(t => { const x = X(t); svg += `<line class="grid" x1="${x}" x2="${x}" y1="${top - 6}" y2="${H - 24}"/><text x="${x}" y="${H - 8}" text-anchor="middle">${fmtTick(t)}</text>`; });
  papers.forEach((p, k) => { const y = top + k * rowH + rowH / 2;
    svg += `<text x="${left - 10}" y="${y + 4}" text-anchor="end" style="fill:var(--ink)">${esc(short(p))}</text>`;
    if (k % 2 === 0) svg += `<rect x="${left}" y="${y - rowH / 2}" width="${W - left - right}" height="${rowH}" fill="var(--sunk)" opacity=".45"/>`; });
  rows.forEach((r, k) => { if (log && r[5] <= 0) return;
    const pi = papers.indexOf(r[2]); const jitter = ((k * 7919) % 13 - 6) * 1.2;

    <div class="legend"><span><i class="dot" style="background:var(--o-stated)"></i>printed</span><span><i class="dot" style="background:var(--o-data)"></i>from released data</span><span><i class="dot" style="background:var(--o-read)"></i>read from a figure</span><span><i class="dot" style="background:var(--o-derived)"></i>derived by LivingLit</span></div></div>
    <div class="scroller"><div style="min-width:560px">${svg}</div></div>`;
  box.querySelectorAll("circle").forEach(c => {
    const r = rows[+c.dataset.k];
    c.onmouseenter = e => showTip(e, `<b>${esc(short(r[2]))}</b> · ${esc(r[4])}<br>${esc(r[6])} ${esc(r[7])} <span style="opacity:.7">(${esc(r[8])})</span><br><span style="opacity:.8">${esc(r[3])}</span><br>${D.CTX.map((k, i) => r[9][i] && r[9][i] !== "not stated" ? `${k.replace(/_/g, " ")}: ${esc(lab(r[9][i].split("|")[0]))}` : "").filter(Boolean).slice(0, 4).join("<br>")}`);

    <div class="row" style="margin-top:var(--s2)">${cl.map(([c, n]) => `<button type="button" class="btn" data-c="${esc(c)}" aria-pressed="${VS.hi === c}" style="${VS.hi === c ? "background:var(--accent);color:var(--accent-ink);border-color:var(--accent)" : ""}">${esc(c === "–" ? "no value" : c.split("|").map(lab).join(" + "))} <span class="muted num">${n}</span></button>`).join("")}</div>`;

// ---------- one result: loaded from its paper's file when opened
const rlink = (p, i) => `<a class="rl" href="#result/${esc(p)}/${esc(i)}">${esc(i)}</a>`;
const LOADING = {};
function loadPaper(p){
  return LOADING[p] ||= new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "explorer_data/items_" + encodeURIComponent(p) + ".js";
    s.onload = ok; s.onerror = () => { delete LOADING[p]; fail(); };
    document.head.appendChild(s);
  });
}
const ORIGIN_CLS = {matched: "good", assigned: "acc", adopted: "good", flagged: "warn", unmapped: "bad", "not stated": "none", "not applicable": "none", "by reference": "acc"};
const ochip = o => `<span class="chip ${ORIGIN_CLS[o] || "none"}">${esc(o)}</span>`;
const termTxt = t => `${esc(lab(t))} <span class="mono muted">${esc(t)}</span>`;
const flags = L => (L || []).map(f => `<div class="flag">${esc(f)}</div>`).join("");
function resultView(key){
  const it = (window.LL_ITEMS || {})[key];
  const p = key.split("/")[0];
  if (!it){
    if (!paperById[p]) return `<p class="empty">No result ${esc(key)} in this release.</p>`;
    loadPaper(p).then(() => { if (decodeURIComponent(location.hash.slice(1)) === "result/" + key) route(); },
      () => { const m = $("#rload"); if (m) m.textContent = "This paper's results could not be loaded: its file explorer_data/items_" + p + ".js is not beside the page."; });
    return `<p class="empty" id="rload">Loading ${esc(short(p))}…</p>`;
  }
  const m = it.map || {context: {}, measure: ["", []]};
  const c = it.contrast, pts = it.points || {};
  const printed = it.values.filter(v => v[1] === "mean" && v[5] === "stated").map(v => v[3]);
  const sec = (t, body, note = "") => `<section class="panel"><h3>${t}</h3>${note ? `<p class="note">${note}</p>` : ""}<div style="margin-top:var(--s3)">${body}</div></section>`;
  let h = `<p class="crumbs"><a href="#papers">Papers</a> › ${esc(short(p))} · ${esc(it.unit_where || it.unit)}${it.unit_title ? " — " + esc(it.unit_title) : ""} · <span class="mono">${esc(it.item)}</span></p>
  <header><span class="eyebrow">One result</span><h1>${esc(it.measure)}</h1></header>
  <p class="lede" style="color:var(--ink)">${esc(it.finding)}</p>
  <div class="row">${chip(it.status)}<span class="chip none">depth: ${esc(it.depth)}</span>${it.suspected_error ? `<span class="chip warn">suspected error: ${esc(it.suspected_error)}</span>` : ""}</div>`;
  h += `<section class="panel">${it.anchor ? `<blockquote>“${esc(it.anchor)}”</blockquote><p class="note" style="margin-top:6px">${esc(it.where)} · ${it.anchor_kind === "unit" ? "anchored to its unit (inside an image)" : it.anchor_kind === "dataset cell" ? "a released-data cell, checked by code" : "found in the paper's text by code"}</p>` : ""}
    <dl class="kv" style="margin-top:var(--s3)"><dt>Measure</dt><dd>${ochip(m.measure[0])} ${(m.measure[1] || []).map(termTxt).join(", ")}</dd>
    ${it.method ? `<dt>Method</dt><dd>${esc(it.method)}</dd>` : ""}${it.software ? `<dt>Software</dt><dd>${esc(it.software)}</dd>` : ""}
    <dt>n</dt><dd>${esc(it.n)}</dd><dt>Test</dt><dd>${esc(it.test || "—")} · ${esc(it.p || "—")}</dd><dt>Kind</dt><dd>${esc(it.test_of)}</dd></dl></section>`;
  if (c || (it.groups || []).length){
    let b = "";
    if (c){
      b += `<div class="row">${c.benchmark ? `<span class="chip acc">against a benchmark</span>` : c.aliased ? `<span class="chip warn">aliased confound</span>` : c.confound ? `<span class="chip bad">confound</span>` : (c.fields || []).length ? `<span class="chip good">contrast on ${esc(c.fields.join(", "))}</span>` : `<span class="chip none">no single contrast</span>`}
        ${it.direction ? `<span class="chip ${it.direction.origin === "stated" ? "warn" : "good"}">direction ${esc(it.direction.direction)}${it.direction.origin === "stated" ? " (stated, not computed)" : ""}</span>` : `<span class="chip none">direction not available</span>`}</div>`;
      if ((c.condition || []).length) b += `<p class="note" style="margin-top:6px">condition ${esc(c.condition.join(", "))} against reference ${esc((c.reference || []).join(", "))}</p>`;
      b += flags(c.problems);
    }
    const gs = it.groups || [], fs = [...new Set(gs.flatMap(g => Object.keys(g.context)))];
    if (gs.length) b += `<div class="scroller" style="margin-top:var(--s3)"><table class="t"><thead><tr><th>Group</th><th>Kind</th>${fs.map(f => `<th>${esc(f.replace(/_/g, " "))}</th>`).join("")}</tr></thead><tbody>${gs.map(g => `<tr><td><b>${esc(g.label)}</b> <span class="mono muted">${esc(g.id)}</span></td><td>${esc(g.kind)}</td>${fs.map(f => `<td>${esc(g.context[f] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    h += sec("Groups and contrast", b, "Each group states only what sets it apart; code finds the contrast between them.");
  }
  if ((it.upstream || []).length) h += sec("Upstream flags", flags(it.upstream));
  if (Object.keys(pts).length) h += sec("Points", strip(pts, printed), "Each dot is one value from released data (green) or read from the figure by the reader's code (blue); the bar is their mean.");
  h += sec("Values", `<div class="scroller"><table class="t"><thead><tr><th>Group</th><th>Kind</th><th>Printed</th><th class="r">Value</th><th>Unit</th><th>Origin</th><th>Interval</th></tr></thead><tbody>${it.values.map(v => `<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td><td class="r">${v[3] == null ? "" : (+v[3]).toLocaleString("en-US", {maximumSignificantDigits: 6})}</td><td>${esc(v[4])}</td><td class="o-${v[5] === "from data" ? "data" : v[5] === "read" ? "read" : v[5] === "stated" ? "stated" : "derived"}">${esc(v[5])}</td><td>${v[6] != null ? `[${v[6]}, ${v[7]}]` : ""}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No values.</td></tr>`}</tbody></table></div>`, "Printed strings as stated; the value column is the number code parsed from them.");
  h += sec("Checks run by code", it.checks.length ? `<table class="t"><tbody>${it.checks.map(k => `<tr><td style="width:32%">${esc(k[0])}</td><td>${chip(k[1])}</td><td>${esc(k[2])}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No check could run: ${it.depth === "none" ? "no values, statistic or points" : "printed values alone allow none here"}.</p>`);
  if (it.chains.length) h += sec("Derivations", `<table class="t"><tbody>${it.chains.map(k => `<tr><td class="mono">${esc(k[0])}</td><td>${k[1] ? `<span class="mono">${esc(k[1])}</span>` : `<span class="muted">no library formula</span>`}</td><td>${chip(k[2])}</td><td>${esc(k[3])}${flags(k[4])}</td></tr>`).join("")}</tbody></table>`, "Each derived quantity rebuilt along the formula library; a rebuilt value is derived by LivingLit.");
  h += sec("Context, resolved by code", `<div class="scroller"><table class="t"><thead><tr><th>Field</th><th>Stated at</th><th>Stated</th><th>Origin</th><th>Terms</th></tr></thead><tbody>${Object.entries(m.context).map(([f, x]) => `<tr${x[0] === "not stated" ? ' class="muted"' : ""}><td class="mono">${esc(f)}</td><td>${esc(x[4] || "")}</td><td style="max-width:300px">${esc(x[2] || "")}</td><td>${ochip(x[0])}</td><td>${(x[1] || []).map(termTxt).join("<br>")}${x[3] ? flags([x[3]]) : ""}</td></tr>`).join("")}</tbody></table></div>`, "Each field resolved from paper to unit to group to result; papers meet only where these terms match.");
  return h;
}
function strip(points, printed){
  const arms = Object.entries(points); if (!arms.length) return "";
  const all = arms.flatMap(([, v]) => v).filter(x => x != null), pm = printed.filter(x => x != null);
  let lo = Math.min(...all, ...pm), hi = Math.max(...all, ...pm); if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const W = 560, rowH = 28, H = arms.length * rowH + 22, x0 = 160, X = v => x0 + (W - x0 - 10) * (v - lo) / (hi - lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="points per group">`;
  arms.forEach(([k, v], i) => { const [arm, origin] = k.split("|"); const y = 12 + i * rowH; const c = origin === "from data" ? "var(--o-data)" : "var(--o-read)";
    s += `<text x="0" y="${y + 4}" font-size="11" fill="var(--ink)">${esc(arm.slice(0, 24))}</text><text x="0" y="${y + 16}" font-size="9" fill="var(--muted)">${esc(origin)} · n ${v.length}</text><line x1="${x0}" x2="${W - 10}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;
    v.forEach(q => { if (q != null) s += `<circle cx="${X(q).toFixed(1)}" cy="${y}" r="3" fill="${c}" fill-opacity=".7"/>`; });
    const mu = v.reduce((a, b) => a + b, 0) / v.length; s += `<line x1="${X(mu)}" x2="${X(mu)}" y1="${y - 8}" y2="${y + 8}" stroke="var(--ink)" stroke-width="2"><title>mean of points ${mu.toPrecision(4)}</title></line>`; });
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(t => s += `<text x="${X(t)}" y="${H - 6}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${(+t.toPrecision(3)).toLocaleString("en-US")}</text>`);
  return s + `</svg>`;
}

// ---------- router
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("result/")){
    document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", "false"));
    hideTip(); if (gSim){ gSim.stop(); gSim = null; }
    $("#main").innerHTML = `<div class="view">${resultView(h.slice(7))}</div>`;
    window.scrollTo(0, 0);
    document.title = "LivingLit · " + h.slice(7);
    return;
  }
  const v = VIEWS.find(x => x[0] === h) || VIEWS[0];
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === v[0] ? "page" : "false"));
  const cur = document.querySelector('#nav a[data-v="' + v[0] + '"]');
  if (cur && innerWidth <= 860) cur.scrollIntoView({block: "nearest", inline: "center"});
  hideTip();
  if (gSim){ gSim.stop(); gSim = null; }
  $("#main").innerHTML = `<div class="view">${v[2]()}</div>`;
  window.scrollTo(0, 0);
  document.title = v[0] === "start" ? "LivingLit" : "LivingLit · " + v[1];
}
$("#nav").innerHTML = VIEWS.map(([k, t], i) => `${i === 1 ? `<li class="grp eyebrow">Questions</li>` : i === VIEWS.length - 1 ? `<li class="grp eyebrow">Sources</li>` : ""}<li><a href="#${k}" data-v="${k}">${esc(t)}</a></li>`).join("");
$("#tagline").textContent = `release ${D.tag} · ${D.P.length} papers`;
$("#navfoot").textContent = `Vocabulary v${D.vocab_version} · formulas v${D.formula_version}. Built from the release tables only.`;
addEventListener("hashchange", route);
route();
</script>

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LivingLit · Lepidoptera — Pilot Atlas, Metrology &amp; Synthesis</title>
  <meta name="description" content="Auditable figure digitization, calibrated 2D-FFT microscopy metrology, relaxed cross-paper synthesis, and 7-dimension within-paper claim auditing for Lepidoptera." />
  <!--STYLES-->
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">LL</div>
      <div>
        <div class="brand-title">LivingLit · Lepidoptera</div>
      </div>
      <span class="brand-tag" id="release-tag">pilot-v1</span>
    </div>

    <nav class="nav-tabs" role="tablist" aria-label="Primary views">
      <button type="button" class="nav-tab active" data-view="atlas" role="tab" title="Browse all atomic figure panels with scale-bar & FFT overlays">Atlas <span class="cnt" id="cnt-atlas"></span></button>
      <button type="button" class="nav-tab" data-view="vault" role="tab" title="Digitized Plots: verify extracted curves, scatter, boxplots & dotplots side-by-side against figure crops">Plots <span class="cnt" id="cnt-vault"></span></button>
      <button type="button" class="nav-tab" data-view="scale" role="tab" title="Compare calibrated micrographs at identical physical magnification (µm/px)">True Scale</button>
      <button type="button" class="nav-tab" data-view="compare" role="tab" title="Cross-paper quantitative comparisons with live confounder toggles">Compare <span class="cnt" id="cnt-compare"></span></button>
      <button type="button" class="nav-tab" data-view="audit" role="tab" title="7-dimension within-paper claim and numerical audit">Audit <span class="cnt" id="cnt-audit"></span></button>
      <button type="button" class="nav-tab" data-view="graph" role="tab" title="Gene Regulatory Network (GRN), Genomic Tables (DE/ChIP), and Corpus Knowledge Graph">GRN &amp; Graph <span class="cnt" id="cnt-grn"></span></button>
      <button type="button" class="nav-tab" data-view="schema" role="tab" title="Explore hierarchical Controlled Vocabulary & interactive SymPy Formula Workbench">Vocab &amp; Formulas <span class="cnt" id="cnt-schema"></span></button>
      <button type="button" class="nav-tab" data-view="papers" role="tab" title="Open-Access manifests, QA scorecards & indexed author scripts">Papers</button>
    </nav>

    <div class="topbar-right">
      <div class="kpi-inline" id="kpi-inline"></div>
      <button type="button" class="btn btn-sm" id="btn-theme" title="Toggle light / dark theme">Theme</button>
    </div>
  </header>

  <main class="main-wrap" id="app-root" role="main">
    <div class="card">Loading LivingLit · Lepidoptera release bundle…</div>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="audit-drawer" aria-label="Result Audit Drawer">
    <div class="drawer-head">
      <div>
        <div class="mono" style="font-size:11px;color:var(--ink-2)" id="drawer-sub">Empirical Evidence Audit</div>
        <div style="font-weight:700;font-size:14.5px" id="drawer-title">Result</div>
      </div>
      <button type="button" class="btn btn-sm" id="drawer-close">Close</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <!--DATA_SCRIPT-->
  <!--APP_SCRIPTS-->
</body>
</html>

source:
  title: Spatial and temporal regulation of Wnt signaling pathway members in the development of butterfly wing patterns
  doi: 10.1126/sciadv.adg3877
  year: '2023'
  first_author: Tirtha Das Banerjee
  last_author: Antónia Monteiro
  lab: Monteiro lab, National University of Singapore
  journal: Science Advances
  files:
    - PMC10371022.xml
  not_used:
    - file: sciadv.adg3877-f1.jpg
      why: Decomposed into 7 atomic expression_imaging panels (1A–1G) in panels.yaml
    - file: sciadv.adg3877-f2.jpg
      why: Decomposed into 6 atomic expression_imaging panels (2A–2F) in panels.yaml
    - file: sciadv.adg3877-f3.jpg
      why: Decomposed into 15 atomic expression_imaging panels (3A–3O) in panels.yaml
    - file: sciadv.adg3877-f4.jpg
      why: Decomposed into 12 atomic expression_imaging panels (4A–4L) in panels.yaml
    - file: sciadv.adg3877-f5.jpg
      why: Decomposed into 14 atomic schematic, expression_imaging, crispant_phenotype_plate, and genomic_track_or_locus panels (5A–5N) in panels.yaml
    - file: sciadv.adg3877-f6.jpg
      why: Decomposed into 18 atomic expression_imaging panels (6A–6R) in panels.yaml
    - file: sciadv.adg3877-f7.jpg
      why: Decomposed into 14 atomic expression_imaging panels (7A–7N) in panels.yaml
    - file: sciadv.adg3877-f8.jpg
      why: Decomposed into 11 atomic crispant_phenotype_plate and genomic_track_or_locus panels (8A–8K) in panels.yaml
    - file: sciadv.adg3877-f9.jpg
      why: Decomposed into 2 atomic phylogeny_or_schematic regulatory model panels (9A–9B) in panels.yaml
    - file: sciadv.adg3877-f10.jpg
      why: Decomposed into 3 atomic phylogeny_or_schematic pathway summary panels (10A–10C) in panels.yaml
  missing:
    - Supplementary Materials PDF (sciadv.adg3877_sm.pdf) containing Tables S1–S4 (including Table S2 CRISPR injection, hatching, and adult emergence denominators) and Figs. S1–S15 (including arm crispants fig. S7 and Wnt7 crispants fig. S15)

context_anchors:
  - field: taxon
    value: Bicyclus anynana
    anchor:
      quote: in eyespot and band development in Bicyclus anynana by localizing Armadillo (Arm)
      where: Abstract
  - field: sex
    value: Male and female
    anchor:
      quote: Male and female B. anynana butterflies are not sexually dimorphic with respect to the wing patterns studied in the present work.
      where: Materials and Methods
  - field: life_stage
    value: pupal
    anchor:
      quote: During the pupal stage, Arm protein was observed in the eyespot foci and along the wing margin from 15 to 24 hours after pupation (AP) (Fig. 1, C and D).
      where: Results
  - field: life_stage
    value: adult
    anchor:
      quote: We confirmed indels at the targeted sites using Illumina sequencing from the affected adult wings (Fig. 5N).
      where: Results
  - field: anatomical_region
    value: forewing and hindwing
    anchor:
      quote: During pupal forewing and hindwing development, Arm is observed in the foci from 15 to 24 hours after pupation (AP).
      where: Fig. 1 caption
  - field: anatomical_region
    value: wings
    anchor:
      quote: We confirmed indels at the targeted sites using Illumina sequencing from the affected adult wings (Fig. 5N).
      where: Results
  - field: anatomical_region
    value: wing
    anchor:
      quote: Expression of Dll in an 18-hour pupal wing showing expression in the future black scale cells.
      where: Fig. 3 caption
  - field: pattern_element
    value: eyespot foci and wing margin
    anchor:
      quote: During the pupal stage, Arm protein was observed in the eyespot foci and along the wing margin from 15 to 24 hours after pupation (AP) (Fig. 1, C and D).
      where: Results
  - field: pattern_element
    value: wing margin
    anchor:
      quote: Defects along the wing margin were also observed in four of the arm CRISPR individuals (fig. S7, C to J).
      where: Results
  - field: pattern_element
    value: eyespot
    anchor:
      quote: No defects in the eyespot pattern were obtained in any individual (Fig. 5, K to M), but the light-colored marginal chevrons of the wing were disrupted
      where: Results
  - field: pattern_element
    value: eyespot field
    anchor:
      quote: frizzled4 crispants showed that frizzled4 also plays a role in PCP affecting scale orientation in the eyespot field.
      where: Fig. 8 caption
  - field: pattern_element
    value: eyespot centers
    anchor:
      quote: In 18 individuals, mosaic crispant wings differentiated two eyespot centers along the proximal-distal axis (Fig. 8, C to F and H, and fig. S15, E to K).
      where: Results
  - field: pattern_element
    value: CSS and BSS
    anchor:
      quote: WntA shows expression along the bands of the CSS and BSS (white arrows) in forewings and in one CSS band (white arrow) in hindwings.
      where: Fig. 5 caption
  - field: pattern_element
    value: CSS, BSS, and marginal chevrons
    anchor:
      quote: loss of scale cell identity along the CSS in both forewings and hindwings, in the BSS band in forewings, and in marginal chevrons
      where: Fig. 5 caption
  - field: pattern_element
    value: wing sectors
    anchor:
      quote: However, knockouts of Wnt7 using CRISPR-Cas9 resulted in ectopic veins and ectopic eyespots differentiating in the wing sectors in 12 individuals (fig. S15, A to D).
      where: Results
  - field: scale_type
    value: scale cells
    anchor:
      quote: Two crispants also showed defects in the orientation of the orange and black scale cells in eyespots (Fig. 8, H to J).
      where: Results
  - field: scale_type
    value: scales
    anchor:
      quote: Functional disruption of WntA using CRISPR-cas9 resulted in the loss of brown color with ectopic orange scales appearing along the CSS and in the BSS
      where: Results
  - field: target_gene
    value: arm
    anchor:
      quote: Disruptions of arm via CRISPR-cas9 resulted in either a split eyespot or no eyespots, suggesting arm’s essential role in eyespot center cell differentiation (fig. S7, C to H).
      where: Discussion
  - field: target_gene
    value: Wnt1
    anchor:
      quote: In 18 to 24 hours pupal wings, however, we confirmed the expression of Wnt1 transcripts in the eyespot foci, as well as expression along the wing margin
      where: Results
  - field: target_gene
    value: Wnt6 and Wnt10
    anchor:
      quote: whereas Wnt6 and Wnt10 were only expressed along the wing margin (Fig. 2, E and F, and fig. S9, B, E, and M).
      where: Results
  - field: target_gene
    value: Dll
    anchor:
      quote: Expression of Dll in an 18-hour pupal wing showing expression in the future black scale cells.
      where: Fig. 3 caption
  - field: target_gene
    value: Wnt7
    anchor:
      quote: However, knockouts of Wnt7 using CRISPR-Cas9 resulted in ectopic veins and ectopic eyespots differentiating in the wing sectors in 12 individuals (fig. S15, A to D).
      where: Results
  - field: target_gene
    value: WntA
    anchor:
      quote: Functional disruption of WntA using CRISPR-cas9 resulted in the loss of brown color with ectopic orange scales appearing along the CSS and in the BSS
      where: Results
  - field: target_gene
    value: WntA and Optix
    anchor:
      quote: Expression of WntA and Optix in 24 to 30 hours pupal (D to F) forewing and (G to I) hindwing.
      where: Fig. 5 caption
  - field: target_gene
    value: frizzled2, frizzled4
    anchor:
      quote: Expression of frizzled2, frizzled4, frizzled9, and Wnt1 in 18 to 24 hours pupal wings of B. anynana.
      where: Fig. 7 caption
  - field: target_gene
    value: frizzled4
    anchor:
      quote: To test the role of frizzled4, we knocked it out using CRISPR-Cas9 at the embryonic stage.
      where: Results
  - field: genetic_element_type
    value: coding sequence
    anchor:
      quote: One to two RNA guides were designed using CRISPRdirect or CHOPCHOP to target the coding sequence of these genes (see the Supplementary Materials for sequences).
      where: Materials and Methods
  - field: allele_or_zygosity
    value: mosaic crispants
    anchor:
      quote: Knockout of arm using CRISPR-cas9 resulted in mosaic crispants that showed either a complete loss of the eyespot (one individual) (fig. S7, C and D) or split eyespots (two individuals)
      where: Results
  - field: perturbation_modality
    value: CRISPR-Cas9
    anchor:
      quote: To test the role of frizzled4, we knocked it out using CRISPR-Cas9 at the embryonic stage.
      where: Results
  - field: imaging_modality
    value: immunostainings
    anchor:
      quote: To extend these findings, we used immunostainings to document Arm’s spatial-temporal expression across both larval and pupal wings at multiple time points
      where: Results
  - field: imaging_modality
    value: HCR3.0
    anchor:
      quote: we used hybridization chain reaction [Hybridization Chain Reaction v3.0 (HCR3.0)] (48).
      where: Results
  - field: imaging_modality
    value: HCR3.0 and in situ hybridization
    anchor:
      quote: Expression of canonical Wnt ligands using HCR3.0 and in situ hybridization in larval and pupal wings.
      where: Fig. 2 caption
  - field: imaging_modality
    value: Leica DMS1000 microscope
    anchor:
      quote: after eclosion, the adults were frozen at −20°C and imaged under a Leica DMS1000 microscope.
      where: Materials and Methods
  - field: hydration_and_prep
    value: fixed in 4% formaldehyde
    anchor:
      quote: Briefly, wings were dissected in 1× PBS and fixed in 4% formaldehyde in 1× PBST.
      where: Materials and Methods
  - field: hydration_and_prep
    value: frozen at −20°C
    anchor:
      quote: after eclosion, the adults were frozen at −20°C and imaged under a Leica DMS1000 microscope.
      where: Materials and Methods


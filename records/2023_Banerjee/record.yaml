evidence:
  E1_arm_pupal_window:
    unit: U1_ARM_TIMING_AND_KO
    measure: developmental milestone timing
    method: Confocal anti-Arm immunofluorescence on timed pupal forewings and hindwings (Olympus FV3000)
    finding: Armadillo protein persists in eyespot foci and along the wing margin from 15 to 24 hours after pupation (AP)
    groups:
      - arm_pupal_if
    values:
      arm_start_ap:
        printed: '15'
        unit: h
        kind: value
        group: arm_pupal_if
        spread: none
      arm_end_ap:
        printed: '24'
        unit: h
        kind: value
        group: arm_pupal_if
        spread: none
    anchor:
      quote: During the pupal stage, Arm protein was observed in the eyespot foci and along the wing margin from 15 to 24 hours after pupation (AP) (Fig. 1, C and D).
      where: Results

  E2_arm_crispant_loss:
    unit: U1_ARM_TIMING_AND_KO
    measure: crispant wing phenotype count
    method: Embryonic CRISPR-Cas9 G0 mosaic knockout targeting arm coding sequence, verified by Illumina paired-end amplicon sequencing
    finding: 1 arm CRISPR G0 mosaic individual exhibited complete loss of an eyespot
    groups:
      - arm_crispant_eyespot
    values:
      n_eyespot_loss:
        printed: '1'
        unit: individuals
        kind: count
        group: arm_crispant_eyespot
        spread: none
    anchor:
      quote: Knockout of arm using CRISPR-cas9 resulted in mosaic crispants that showed either a complete loss of the eyespot (one individual) (fig. S7, C and D) or split eyespots (two individuals)
      where: Results

  E3_arm_crispant_split:
    unit: U1_ARM_TIMING_AND_KO
    measure: eyespot duplication count
    method: Embryonic CRISPR-Cas9 G0 mosaic knockout targeting arm coding sequence, verified without ectopic venation
    finding: 2 arm CRISPR G0 mosaic individuals exhibited split eyespots with two foci side-by-side in a single wing sector
    groups:
      - arm_crispant_eyespot
    values:
      n_split_eyespot:
        printed: '2'
        unit: individuals
        kind: count
        group: arm_crispant_eyespot
        spread: none
    anchor:
      quote: Knockout of arm using CRISPR-cas9 resulted in mosaic crispants that showed either a complete loss of the eyespot (one individual) (fig. S7, C and D) or split eyespots (two individuals)
      where: Results

  E4_arm_crispant_margin:
    unit: U1_ARM_TIMING_AND_KO
    measure: crispant wing phenotype count
    method: Embryonic CRISPR-Cas9 G0 mosaic knockout targeting arm coding sequence
    finding: 4 arm CRISPR G0 mosaic individuals exhibited wing margin defects
    groups:
      - arm_crispant_margin
    values:
      n_margin_defects:
        printed: '4'
        unit: individuals
        kind: count
        group: arm_crispant_margin
        spread: none
    anchor:
      quote: Defects along the wing margin were also observed in four of the arm CRISPR individuals (fig. S7, C to J).
      where: Results

  E5_canonical_wnt_pupal_window:
    unit: U2_CANONICAL_WNT_EXPRESSION
    measure: developmental milestone timing
    method: Multiplexed HCR3.0 fluorescent in situ hybridization and BCIP/NBT chromogenic ISH on pupal wings
    finding: Wnt1 transcripts appear in eyespot foci and wing margin at 18–24 h AP, while Wnt6 and Wnt10 remain confined to the wing margin (18–21 h AP in Fig. 2E–F)
    groups:
      - wnt1_pupal_foci
      - wnt6_wnt10_pupal_margin
    values:
      wnt1_start_ap:
        printed: '18'
        unit: h
        kind: value
        group: wnt1_pupal_foci
        spread: none
      wnt1_end_ap:
        printed: '24'
        unit: h
        kind: value
        group: wnt1_pupal_foci
        spread: none
      wnt6_wnt10_end_ap:
        printed: '21'
        unit: h
        kind: value
        group: wnt6_wnt10_pupal_margin
        spread: none
    anchor:
      quote: In 18 to 24 hours pupal wings, however, we confirmed the expression of Wnt1 transcripts in the eyespot foci, as well as expression along the wing margin
      where: Results

  E6_dll_pupal_timing:
    unit: U2_CANONICAL_WNT_EXPRESSION
    measure: developmental milestone timing
    method: HCR3.0 fluorescent in situ hybridization for Distal-less (Dll) in early pupal hindwing
    finding: Dll transcripts mark the future black scale cells of the eyespot ring at 18 hours AP
    groups:
      - dll_pupal_eyespot
    values:
      dll_pupal_ap:
        printed: '18'
        unit: h
        kind: value
        group: dll_pupal_eyespot
        spread: none
    anchor:
      quote: Expression of Dll in an 18-hour pupal wing showing expression in the future black scale cells.
      where: Fig. 3 caption

  E7_wnt7_ectopic_veins_eyespots:
    unit: U3_WNT7_CRISPANT
    measure: crispant wing phenotype count
    method: Embryonic CRISPR-Cas9 G0 mosaic knockout targeting Wnt7 coding sequence (injected 3 h AEL)
    finding: 12 Wnt7 CRISPR G0 individuals developed ectopic wing veins accompanied by secondary ectopic eyespots in newly formed wing sectors
    groups:
      - wnt7_crispant
    values:
      n_wnt7_ectopic:
        printed: '12'
        unit: individuals
        kind: count
        group: wnt7_crispant
        spread: none
    anchor:
      quote: However, knockouts of Wnt7 using CRISPR-Cas9 resulted in ectopic veins and ectopic eyespots differentiating in the wing sectors in 12 individuals (fig. S15, A to D).
      where: Results

  E8_wnta_optix_pupal_window:
    unit: U4_WNTA_EXPRESSION_AND_KO
    measure: developmental milestone timing
    method: Dual-channel HCR3.0 fluorescent in situ hybridization of WntA and Optix on pupal forewings and hindwings
    finding: At 24–30 h AP, WntA is expressed in CSS and BSS bands while Optix borders WntA domains and marks orange eyespot ring scale cells
    groups:
      - wnta_optix_pupal_hcr
    values:
      wnta_start_ap:
        printed: '24'
        unit: h
        kind: value
        group: wnta_optix_pupal_hcr
        spread: none
      wnta_end_ap:
        printed: '30'
        unit: h
        kind: value
        group: wnta_optix_pupal_hcr
        spread: none
    anchor:
      quote: Expression of WntA and Optix in 24 to 30 hours pupal (D to F) forewing and (G to I) hindwing.
      where: Fig. 5 caption

  E9_wnta_crispant_defects:
    unit: U4_WNTA_EXPRESSION_AND_KO
    measure: crispant wing phenotype count
    method: Embryonic CRISPR-Cas9 G0 mosaic knockout targeting WntA coding sequence (1–3 h AEL), confirmed by Illumina amplicon sequencing
    finding: 28 WntA G0 crispants exhibited loss of brown scales with ectopic orange scales along CSS/BSS, CSS width/shape changes, and marginal chevron disruption
    groups:
      - wnta_crispant_bands
    values:
      n_wnta_defects:
        printed: '28'
        unit: individuals
        kind: count
        group: wnta_crispant_bands
        spread: none
    anchor:
      quote: A total of 28 individuals with wntA-dependent defects were observed.
      where: Fig. 5 caption

  E10_wnta_crispant_no_eyespot:
    unit: U4_WNTA_EXPRESSION_AND_KO
    measure: crispant wing phenotype count
    method: Phenotypic scoring of adult WntA G0 crispants under Leica DMS1000 microscopy
    finding: 0 WntA crispant individuals exhibited eyespot pattern defects, consistent with absence of WntA expression in eyespots
    groups:
      - wnta_crispant_eyespot
    values:
      n_eyespot_defects:
        printed: '0'

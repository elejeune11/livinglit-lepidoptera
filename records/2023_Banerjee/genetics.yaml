    anchor:
      quote: Disruptions of arm via CRISPR-cas9 resulted in either a split eyespot or no eyespots, suggesting arm’s essential role in eyespot center cell differentiation (fig. S7, C to H).
      where: Discussion
    note: Mosaic arm CRISPR knockouts produced complete eyespot loss (n=1) or split double foci without ectopic venation (n=2), verified by Illumina paired-end sequencing.


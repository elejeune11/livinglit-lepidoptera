units:
  F1_SURVEY:
    where: Figure 1 and Results
    title: Contribution of upper surface nanostructures to scale peak wavelength, reflectance intensity, and FWHM across 39 scales from 34 butterfly species
    context:
      taxon: 34 species
      scale_type: cover scales
      functional_architecture: ridges and crossribs
      perturbation_modality: none
      imaging_modality: microspectrophotometer
      view_orientation: abwing side
      hydration_and_prep: dried specimens
    groups:
      survey_34sp:
        label: 39 butterfly scales from 34 species (abaxial vs adaxial)
        kind: natural
        context: {}
  F2_SELECTION:
    where: Figure 2 and Results
    title: Artificial selection for violet-blue scale hue in Bicyclus anynana (WT to G8) increases ridge height, crossrib height, and crossrib spacing
    context:
      taxon: Bicyclus anynana
      scale_type: ground scales
      functional_architecture: ridges and crossribs
      imaging_modality: FIB-SEM
      view_orientation: transverse and sagittal
      hydration_and_prep: dried specimens
    groups:
      wt_line:
        label: Wild-type brown ground scales (WT)
        kind: wild type
        context:
          perturbation_modality: none
      g8_blue:
        label: Generation-8 artificially selected blue ground scales (G8)
        kind: perturbed
        context:
          perturbation_modality: artificial selection
  F4_34SPECIES:
    where: Figure 4 and Results
    title: Multi-order ridge-air interference correlation between longitudinal ridge height and peak reflectance wavelength across 39 scales from 34 butterfly species
    context:
      taxon: 34 species
      scale_type: cover scales
      functional_architecture: ridges and crossribs
      perturbation_modality: none
      imaging_modality: FIB-SEM
      view_orientation: transverse and sagittal
      hydration_and_prep: dried specimens
    groups:
      cohort_order1:
        label: First-order ridge height cohort (268–1036 nm, n=17)
        kind: natural
        context: {}
      cohort_order2:
        label: Second-order ridge height cohort (1126–2184 nm, n=21)
        kind: natural
        context: {}
  F5_MORPHO_SEM:
    where: Figure 5C–D
    title: Top-down SEM of intact unmilled Morpho didius cover scale ridges prior to/adjacent to FIB milling
    context:
      taxon: Morpho didius
      scale_type: cover scales
      functional_architecture: stacked lamellae
      perturbation_modality: none
      imaging_modality: SEM
      view_orientation: top view
      hydration_and_prep: uncoated
    groups:
      morpho_unmilled_sem:
        label: Intact Morpho didius cover scale (Fig 5C/D SEM)
        kind: natural
        context: {}
  F5_MILLING:
    where: Figure 5C'–D'' and Results
    title: Focused ion beam milling of full ridges vs lateral lamellae in Morpho didius decouples peak wavelength shift from reflectance intensity

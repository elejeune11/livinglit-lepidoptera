        kind: wild type
        context:
          perturbation_modality: none
      morpho_full_milled:
        label: Full-ridge FIB-milled Morpho didius ridge (z = 100–800 nm)
        kind: perturbed
        context:
          perturbation_modality: FIB-SEM millings
      morpho_lamellae_milled:
        label: Lateral-lamellae-only FIB-milled Morpho didius ridge (z = 500–1300 nm)
        kind: perturbed
        context:
          perturbation_modality: FIB-SEM millings
evidence:
  F1_hue_shift:
    unit: F1_SURVEY
    measure: spectral hue shift
    method: Abaxial vs adaxial microspectrophotometry across 39 scales from 34 butterfly species
    software: R (pavo v2.9)
    finding: Upper surface nanostructures shift peak reflectance wavelength by 0 to 85 nm relative to the lower lamina across 39 scales
    groups:
      - survey_34sp
    values:
      hue_range:
        printed: 0 to 85
        unit: nm
        kind: value
        group: survey_34sp
        spread: range
    anchor:
      quote: the absolute shift in reflectance peak ranging from approximately 0 to 85 nm
      where: Results
  F2_crossrib_spacing:
    unit: F2_SELECTION
    measure: crossrib spacing
    method: FIB-SEM ultrastructural measurement across WT and G8 selected B. anynana lines
    software: Fiji
    finding: Artificial selection for violet-blue ground scale color increased mean crossrib spacing from 862 ± 71 nm (WT) to 1160 ± 116 nm (G8)
    compares:
      - g8_blue
      - wt_line
    test_of: pair
    values:
      wt_cr:
        printed: 862 ± 71
        unit: nm
        kind: mean
        group: wt_line
        spread: SD
      g8_cr:
        printed: 1160 ± 116
        unit: nm
        kind: mean
        group: g8_blue
        spread: SD
    stated_direction:
      direction: up
      anchor:
        quote: we detected an increase in the mean distance between crossribs (dWT = 862 ± 71 nm versus dG8 = 1160 ± 116 nm)
        where: Results
    anchor:
      quote: we detected an increase in the mean distance between crossribs (dWT = 862 ± 71 nm versus dG8 = 1160 ± 116 nm)
      where: Results
  F2_window_area:
    unit: F2_SELECTION
    measure: window area
    method: FIB-SEM measurement of upper-lamina window area across WT and G8 selected B. anynana ground scales
    software: Fiji
    finding: Mean window area increased from 0.72 ± 0.2 um2 (WT) to 1.2 ± 0.3 um2 (G8) alongside wider crossrib spacing
    compares:
      - g8_blue
      - wt_line
    test_of: pair
    values:
      wt_win:
        printed: 0.72 ± 0.2
        unit: µm²
        kind: mean
        group: wt_line
        spread: SD
      g8_win:
        printed: 1.2 ± 0.3
        unit: µm²
        kind: mean
        group: g8_blue
        spread: SD
    stated_direction:
      direction: up
      anchor:
        quote: The increase in the distance between crossribs increased the mean window area (Figure S3D) (areaWT = 0.72 ± 0.2 μm2 versus areaG8 = 1.2 ± 0.3 μm2)
        where: Results
    anchor:
      quote: The increase in the distance between crossribs increased the mean window area (Figure S3D) (areaWT = 0.72 ± 0.2 μm2 versus areaG8 = 1.2 ± 0.3 μm2)
      where: Results
  F4_cohort1_pgls:
    unit: F4_34SPECIES
    measure: ridge height
    method: Transverse FIB-SEM ridge height measurement and PGLS regression across shorter-ridge cohort (268–1036 nm)
    software: R
    finding: Shorter ridges (268–1036 nm, n = 17 scales) positively correlate with peak reflectance wavelength (PGLS β = 0.76 ± 0.22, t = 3.51, p = 3.1e-03)
    groups:
      - cohort_order1
    n:
      printed: 17 shorter-ridge scales
      counts: scales
    stats:
      test: PGLS regression
      statistic: t = 3.51
      p: p = 3.1e-03
    anchor:
      quote: 'a significant positive correlation (intercept: 117.13, β = 0.76, SE = 0.22, t = 3.51, p = 3.1e-03)'
      where: Results
    scaling:
      independent_measure: peak reflectance wavelength
      direction: up
      stratified_by: interference order i
      anchor:
        quote: 'a significant positive correlation (intercept: 117.13, β = 0.76, SE = 0.22, t = 3.51, p = 3.1e-03)'
        where: Results
  F4_ridge_height_cohorts:
    unit: F4_34SPECIES
    measure: ridge height
    method: Transverse FIB-SEM ridge height measurement and PGLS regression across 39 scale types in 34 species
    software: R
    finding: 39 scales across 34 species stratify into two constructive-interference ridge-height branches — 268–1036 nm (mean 614 nm, p = 3.1e-3) and 1126–2184 nm (mean 1444 nm, β = 4.57, t = 11.54, p < 1e-4)
    compares:
      - cohort_order2
      - cohort_order1
    test_of: pair
    n:
      printed: 17 lower-branch and 21 upper-branch scales (plus 1 third-order outlier = 39 total)
      per_group:
        cohort_order1: '17'
        cohort_order2: '21'
      counts: scales
    stats:
      test: PGLS regression
      statistic: t = 11.54
      p: p < 1e-04
    anchor:
      quote: 'This positive correlation was very significant for taller ridges between 1126 and 2184 nm (intercept: −554.08, β = 4.57, SE = 0.40, t = 11.54, p < 1e-04)'
      where: Results
    scaling:
      independent_measure: peak reflectance wavelength
      direction: up
      stratified_by: interference order i
      anchor:
        quote: 'This positive correlation was very significant for taller ridges between 1126 and 2184 nm (intercept: −554.08, β = 4.57, SE = 0.40, t = 11.54, p < 1e-04)'
        where: Results
  F4_interference_hue:
    unit: F4_34SPECIES
    measure: peak reflectance wavelength
    method: Analytical ridge-air phase interference equation lambda = 2*(n_r - n_a)*h / m
    finding: A chitin ridge of height h = 400 nm (n_r = 1.56 in air n_a = 1.0) at order m = 1 (i = 2) produces a blue interference peak at 448 nm
    groups:
      - cohort_order1
    values:
      lam_pred:
        printed: '448'
        unit: nm
        kind: value
        group: cohort_order1
        spread: none
    anchor:
      quote: constructive interference of the two waves gives rise to spectral peaks, whose wavelengths/hues (λ) are given by
      where: Results
    scaling:
      independent_measure: ridge height
      direction: up
      stratified_by: interference order m
      anchor:
        quote: constructive interference of the two waves gives rise to spectral peaks, whose wavelengths/hues (λ) are given by
        where: Results
  F5_morpho_ridge_spacing:
    unit: F5_MORPHO_SEM
    measure: ridge spacing
    method: LivingLit 2D FFT and multi-transect profiling on Fig 5C intact Morpho didius SEM
    finding: Image-derived SEM ridge spacing on intact Morpho didius cover scale (Fig 5C) is 0.763 um (FFT) / 0.760 um (transect)
    groups:
      - morpho_unmilled_sem
    anchor:
      quote: SEM top view of scale after milling of two consecutive ridges (core + lamellae).
      where: Fig. 5C caption
  F5_full_ridge_milling:
    unit: F5_MILLING
    measure: peak reflectance wavelength
    method: FIB-SEM milling of full ridge (core + lamellae) followed by microspectrophotometry (Fig 5C')
    finding: Progressive full-ridge FIB milling (z = 100, 500, 800 nm) UV-shifts the Morpho didius reflectance peak from 435 nm down to 411 nm, 369 nm, and 350 nm while reducing brightness
    compares:
      - morpho_full_milled
      - morpho_intact
    test_of: pair
    stated_direction:
      direction: down
      anchor:
        quote: We found that the reflection spectrum was UV-shifted when the ridge height was decreased
        where: Results
    anchor:
      quote: We found that the reflection spectrum was UV-shifted when the ridge height was decreased
      where: Results
  F5_lamellae_milling:
    unit: F5_MILLING
    measure: peak reflectance wavelength
    method: Selective FIB-SEM milling of lateral lamellae only (preserving central ridge core) followed by microspectrophotometry (Fig 5D')
    finding: Selective lateral lamellae milling up to z = 1000 nm leaves the ~430 nm peak wavelength unchanged (digitized 438 -> 435 -> 432 nm) while halving peak reflectance intensity (76% -> 36%)
    compares:
      - morpho_lamellae_milled
      - morpho_intact
    test_of: pair
    stated_direction:
      direction: none
      anchor:
        quote: We found that the position of the reflectance peak (∼430 nm) remained unchanged regardless of the depth of milling
        where: Results
    anchor:
      quote: We found that the position of the reflectance peak (∼430 nm) remained unchanged regardless of the depth of milling
      where: Results

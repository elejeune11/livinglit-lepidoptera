      where: Results
  - field: scale_type
    value: wing scales
    anchor:
      quote: The size of the wing scales appears to be rather variable, but the structure adheres to the classical format.
      where: Results
  - field: scale_type
    value: forewing scale
    anchor:
      quote: Scanning electron micrographs of a forewing scale.
      where: Fig. 2 caption
  - field: functional_architecture
    value: melanin-pigmented

evidence:
  F1_wing_reflectance:
    unit: F1_WING_REFLECTANCE
    measure: maximum reflectance
    method: Bifurcated reflection probe (Avantes FCR 7-UV-200) against WS-2 white diffuse tile, digitized from Fig. 1B (300–800 nm)
    finding: "Both dorsal forewing and hindwing reflectance increase monotonically with wavelength (hallmark of melanin), with the exposed dark-brown forewing strongly darker than the covered light-brown hindwing (digitized at 700 nm: 9.1% vs 29.5%; forewing reaches 13.6% at 797 nm while hindwing exceeds 30% above 706 nm)"
    compares:
      - dorsal_forewing
      - dorsal_hindwing
    test_of: pair
    values:
      forewing_700nm:
        printed: '9.1'
        unit: '%'
        kind: value
        group: dorsal_forewing
        x: 700 nm
        spread: none
      hindwing_700nm:
        printed: '29.5'
        unit: '%'
        kind: value
        group: dorsal_hindwing
        x: 700 nm
        spread: none
    stated_direction:
      direction: down
      anchor:
        quote: The dorsal forewings are dark-brown with black patches, which cover (when resting) the more or less uniformly light brown dorsal hindwings
        where: Results
    anchor:
      quote: In both cases, the reflectance increases monotonically with increasing wavelength, which is characteristic of a melanin-pigmented tissue (Figure 1B).
      where: Results

  F2_ridge_spacing:
    unit: F2_SCALE_SEM
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT and 10-transect profiling on gold-sputtered forewing scale SEM micrographs (Fig. 2B 25 µm bar; Fig. 2C 2.5 µm bar)
    finding: Calibrated 2D-FFT on Bogong moth forewing scale SEMs measures parallel longitudinal ridge spacing of 1.964 µm (transect 2.012 ± 0.034 µm, SNR 105) in high-magnification Fig. 2C and 2.274 µm (transect 2.178 µm, SNR 37,416) across the wider distal tip in Fig. 2B
    groups:
      - scale_tip_sem
      - scale_highmag_sem
    values:
      fig2b_fft:
        printed: '2.27'
        unit: µm
        kind: value
        group: scale_tip_sem
        spread: none
      fig2c_fft:
        printed: '1.96'
        unit: µm
        kind: value
        group: scale_highmag_sem
        spread: none
    anchor:
      quote: The scale ridges, consisting of slightly overlapping lamellae and connected by cross-ribs, which leave minor open windows.
      where: Fig. 2 caption

  F2_ridge_density:
    unit: F2_SCALE_SEM
    measure: ridge density
    method: Reciprocal spatial frequency rho = 1/d derived from calibrated Fig. 2C SEM ridge spacing (1.96 µm)
    finding: Forewing scale longitudinal ridge density in high-magnification Fig. 2C is 5.10e5 m^-1 (0.51 ridges/µm), matching canonical pigmentary lepidopteran scales (~0.5 ridges/µm)
    groups:
      - scale_highmag_sem
    values:
      fig2c_rho:
        printed: '5.10e5'
        unit: m^-1
        kind: value
        group: scale_highmag_sem
        spread: none
    anchor:
      quote: The scale ridges, consisting of slightly overlapping lamellae and connected by cross-ribs, which leave minor open windows.
      where: Fig. 2 caption
    scaling:
      independent_measure: ridge spacing
      direction: down
      anchor:
        quote: The scale ridges, consisting of slightly overlapping lamellae and connected by cross-ribs, which leave minor open windows.
        where: Fig. 2 caption

  F2_crossrib_spacing:
    unit: F2_SCALE_SEM
    measure: crossrib spacing
    method: LivingLit orthogonal 2D-FFT cross-rib profiling on Fig. 2C SEM (calibrated 2.5 µm scale bar)
    finding: Transverse cross-rib and window lattice periodicity between longitudinal ridges in Fig. 2C is 0.572 µm (wavevector 86.7 deg, SNR 19.2)
    groups:
      - scale_highmag_sem
    values:
      fig2c_crossrib:
        printed: '0.572'
        unit: µm
        kind: value
        group: scale_highmag_sem
        spread: none
    anchor:
      quote: The scale ridges, consisting of slightly overlapping lamellae and connected by cross-ribs, which leave minor open windows.
      where: Fig. 2 caption

  F2_scale_length:
    unit: F2_SCALE_SEM
    measure: scale length
    method: Calibrated planar pixel extent of isolated forewing scale blade in Fig. 2A SEM (50 µm scale bar, 1.060 µm/px)
    finding: Isolated forewing scale in Fig. 2A measures 504 µm in tip-to-pedicel length (with max distal width 79.5 µm and midpoint width 59.4 µm)
    groups:
      - scale_whole_sem
    values:
      fig2a_len:
        printed: '504'
        unit: µm
        kind: value
        group: scale_whole_sem
        spread: none
    anchor:
      quote: An isolated scale with dented tip area and on the other end the root.
      where: Fig. 2 caption

  F2_scale_width:
    unit: F2_SCALE_SEM
    measure: scale width
    method: Calibrated transverse blade width of isolated forewing scale in Fig. 2A SEM (50 µm scale bar, 1.060 µm/px)
    finding: Isolated forewing scale in Fig. 2A spans 79.5 µm maximum width near the dented distal tip and 59.4 µm at mid-blade
    groups:
      - scale_whole_sem
    values:
      fig2a_max_w:
        printed: '79.5'
        unit: µm
        kind: value
        group: scale_whole_sem
        spread: none
    anchor:
      quote: An isolated scale with dented tip area and on the other end the root.
      where: Fig. 2 caption

  F3_scale_transmittance:
    unit: F3_TRANSMITTANCE
    measure: transmittance
    method: Transmission microspectrophotometry (Leitz Ortholux, 20x NA 0.46, 5–10 µm square diaphragm) of single forewing scale in immersion oil (n = 1.515), digitized from Fig. 3 (350–800 nm)
    finding: Scale transmittance drops sharply from root to tip along the melanin gradient—at 500 nm from 86.8% (root #1) to 25.3% (middle #2) and 10.7% (tip #3), confirming the paper's statement that tip transmittance is hardly more than ~10% across the visible range (8.0–18.1% over 350–700 nm)
    groups:
      - scale_root_1
      - scale_middle_2
      - scale_tip_3
    values:
      root_500nm:
        printed: '86.8'
        unit: '%'
        kind: value
        group: scale_root_1
        x: 500 nm
        spread: none
      middle_500nm:
        printed: '25.3'
        unit: '%'
        kind: value
        group: scale_middle_2
        x: 500 nm
        spread: none
      tip_visible:
        printed: '~10'
        unit: '%'
        kind: value
        group: scale_tip_3
        spread: none
    anchor:
      quote: but near the tip the transmittance was hardly more than ∼10% across the whole visible wavelength range (Figure 3, #3).
      where: Results

  F5_lower_lamina_thickness:
    unit: F5_SCALE_OPTICS
    measure: lower lamina thickness
    method: Classical Airy optical thin-film modeling of chitin in air fitted to normal-incidence adwing microspectrophotometer reflectance spectra (Fig. 5A, 5B)
    finding: Adwing reflectance spectra at blue proximal area #1 and yellow-purple central area #2 closely match modeled chitin thin films in air with lower-lamina thicknesses of 230 nm and 290 nm, respectively (aside from a diffuse upper-lamina backscatter offset)
    groups:
      - adwing_area1_230nm
      - adwing_area2_290nm
    values:
      area1_d:
        printed: '230'
        unit: nm
        kind: value
        group: adwing_area1_230nm
        spread: none
      area2_d:
        printed: '290'
        unit: nm
        kind: value
        group: adwing_area2_290nm
        spread: none
    anchor:
      quote: Except for a background offset, the spectra closely resemble the reflectance spectra of thin films with thickness 230 and 290 nm, respectively (Figures 5A,B, dotted curves).
      where: Results

  F5_thin_film_peak_wavelength:
    unit: F5_SCALE_OPTICS
    measure: peak reflectance wavelength
    method: Microspectrophotometry and Airy thin-film constructive-interference peak positions digitized from Fig. 5A and 5B
    finding: Increasing modeled lower-lamina thickness from 230 nm (area #1) to 290 nm (area #2) redshifts the visible constructive interference peak from 477 nm (measured 476.8 nm, Airy model 472.9 nm) to 596 nm (measured 590.1 nm, Airy model 595 nm; secondary UV peak at 367 nm)
    groups:
      - adwing_area1_230nm
      - adwing_area2_290nm
    values:
      area1_lam_peak:
        printed: '477'
        unit: nm
        kind: value
        group: adwing_area1_230nm
        spread: none
      area2_lam_peak:
        printed: '596'
        unit: nm
        kind: value
        group: adwing_area2_290nm
        spread: none
    anchor:
      quote: Except for a background offset, the spectra closely resemble the reflectance spectra of thin films with thickness 230 and 290 nm, respectively (Figures 5A,B, dotted curves).
      where: Results
    scaling:
      independent_measure: lower lamina thickness
      direction: up
      anchor:
        quote: the lower lamina of the scales, acting as a thin film reflector, has a variable thickness (Figure 4B).
        where: Results

  F5_abwing_melanin_filtering:
    unit: F5_SCALE_OPTICS
    measure: maximum reflectance
    method: Microspectrophotometry comparing adwing thin-film area #1 (Fig. 5A) vs melanized abwing distal tip area #5 (Fig. 5C)
    finding: Dense upper-lamina melanin at the exposed abwing tip (area #5) extinguishes the blue lower-lamina thin-film interference peak—reducing reflectance at 475 nm from 26.9% (adwing #1 peak) to 4.1% (abwing #5) and peak reflectance across 350–800 nm from 26.9% to 12.0%
    compares:
      - abwing_area5_tip
      - adwing_area1_230nm
    test_of: pair
    values:
      adwing1_max:
        printed: '26.9'
        unit: '%'
        kind: value
        group: adwing_area1_230nm
        spread: none
      abwing5_max:
        printed: '12.0'
        unit: '%'
        kind: value
        group: abwing_area5_tip
        spread: none
    stated_direction:
      direction: down
      anchor:
        quote: the reflectance spectra of the more distal areas (Figure 4C, #4, 5) are dominated by melanin filtering (Figure 5C).
        where: Results
    anchor:
      quote: the reflectance spectra of the more distal areas (Figure 4C, #4, 5) are dominated by melanin filtering (Figure 5C).
      where: Results

  F6_granite_vs_bark:
    unit: F6_SUBSTRATES
    measure: maximum reflectance
    method: Bifurcated reflection probe (Avantes FCR 7-UV-200) on South Ramshead cave granite and Eucalyptus cinerea bark, digitized from Fig. 6 (300–800 nm)
    finding: Cave granite exhibits a distinct algal green reflectance hump peaking at 560 nm (13.5%) followed by a chlorophyll absorption dip at 675 nm (8.0%) and red-edge rise to 31.4% (797 nm), whereas Eucalyptus cinerea bark rises smoothly and monotonically from 5.2% (350 nm) through 8.6% (560 nm) and 18.7% (700 nm) to 31.8% (797 nm)
    groups:
      - cave_granite
      - e_cinerea_bark
    values:
      granite_560nm:
        printed: '13.5'
        unit: '%'
        kind: value
        group: cave_granite
        x: 560 nm
        spread: none
      bark_560nm:
        printed: '8.6'
        unit: '%'
        kind: value
        group: e_cinerea_bark
        x: 560 nm
        spread: none
    anchor:
      quote: The reflectance spectrum of the granite has a slight hump in the green part of the spectrum, presumably due to a thin algal coating
      where: Results

  F7_forewing_vs_bark:
    unit: F7_CAMOUFLAGE
    measure: maximum reflectance
    method: Bifurcated reflection probe across 7 spots on dark female Bogong moth dorsal forewings overlaid on likely resting-spot tree barks (Table 1), digitized from Fig. 7 (300–800 nm)
    finding: Seven dorsal forewing spectra of dark female Bogong moths increase monotonically with wavelength—spanning 4.2–7.7% at 350 nm, 8.1–20.6% at 600 nm, and 18.9–44.5% at 800 nm—falling directly within the reflectance range of the 7 likely resting-spot tree species listed in Table 1
    groups:
      - female_forewings
    values:
      forewing_800nm_range:
        printed: 18.9 to 44.5
        unit: '%'
        kind: value
        group: female_forewings
        x: 800 nm
        spread: range
    anchor:
      quote: the reflectance spectra of the forewings of the rather dark female Bogong moths we were using vary in the same range (Figure 7).
      where: Results

claims:
  C1_abstract_camouflage_spectra:
    kind: stated
    quote: The similarity of the spectra underscores the effective camouflaging strategies of this moth species.
    where: Abstract
    scope: Australian Bogong moth (Agrotis infusa) wings and scales compared to bark and cave granite
    rests_on:
      - F1_wing_reflectance
      - F6_granite_vs_bark
      - F7_forewing_vs_bark
    judgement:
      direction: follows
      support: cannot judge
      comparison: follows
      scope: follows
      replication: cannot judge
      strength: follows
      presence: follows
    note: Spectral overlap is demonstrated visually in Figs. 6–7 without receptor-noise JND visual modeling or reported sample sizes (N individuals/bark replicates).

  C2_results_transmittance_gradient:
    kind: stated
    quote: Near the root, the transmittance was high, i.e., at this location the scale is almost transparent (Figure 3, #1), but near the tip the transmittance was hardly more than ∼10%
    where: Results
    scope: Longitudinal melanin transmittance gradient along an isolated oil-immersed forewing scale (Fig. 3)
    rests_on:
      - F3_scale_transmittance
    judgement:
      direction: follows
      support: follows
      comparison: follows
      scope: follows
      replication: cannot judge
      strength: follows
      presence: follows
    note: Single representative scale measured (digitized 500 nm transmittance drops from 86.8% at root to 10.7% at tip); inter-scale variance not reported.

  C3_results_thin_film_thickness:
    kind: stated
    quote: Except for a background offset, the spectra closely resemble the reflectance spectra of thin films with thickness 230 and 290 nm, respectively (Figures 5A,B, dotted curves).
    where: Results
    scope: Isolated forewing scale adwing lower lamina modeled as a chitin thin film in air (Figs. 5A–B)
    rests_on:
      - F5_lower_lamina_thickness
      - F5_thin_film_peak_wavelength
    judgement:
      direction: follows
      support: follows
      comparison: follows
      scope: follows
      replication: cannot judge
      strength: follows
      presence: follows
    note: Airy thin-film peak wavelengths match digitized adwing peaks (477 vs 473 nm; 590 vs 595 nm); authors appropriately note TEM is needed to directly confirm thickness.

  C4_results_tip_melanin_blocks_thin_film:
    kind: stated

    - file: pnas.2403326121fig02.jpg
      why: Decomposed into 27 atomic crispant_phenotype_plate, macro_morphology, and expression_imaging panels in panels.yaml
    - file: pnas.2403326121fig03.jpg
      why: Decomposed into 14 atomic crispant, radiolabeling, WGS depth, Sanger ICE, and structural panels in panels.yaml with custom plot extractors
    - file: pnas.2403326121fig04.jpg

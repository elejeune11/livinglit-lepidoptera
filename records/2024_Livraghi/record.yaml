    unit: F4_CONSERVED_NYMPHALIDAE
    measure: crispant wing phenotype count
    method: CRISPR/Cas9 mosaic mutagenesis of the conserved ivory promoter and first exon in Agraulis incarnata and Danaus plexippus (~80 MY divergence)
    finding: Ivory mKOs convert melanic scales to reflective white/silver scales with ectopic upper-lamina lamination in A. incarnata (preserving ommochrome in lighter orange regions) and convert melanic scales to white across both wing surfaces in D. plexippus (with local ventral forewing distal white-to-orange and orange-to-white switches)
    groups:

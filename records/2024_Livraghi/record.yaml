source:
  title: A long noncoding RNA at the cortex locus controls adaptive coloration in butterflies
  doi: 10.1073/pnas.2403326121
  year: '2024'
  first_author: Luca Livraghi
  last_author: Arnaud Martin
  lab: Martin lab, George Washington University
  journal: PNAS

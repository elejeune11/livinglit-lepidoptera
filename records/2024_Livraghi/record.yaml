evidence:
  F1_ivory_onset_timing:
    unit: F1_IVORY_LOCUS
    measure: developmental milestone timing
    method: Reference-based RNA-seq alignments and de novo Trinity transcriptome assemblies from H. melpomene and H. erato pupal wings (PRJNA552081)
    finding: Ivory encodes a ~1.3 kb, up to 8-exon lncRNA (>138 kb span in H. melpomene; >205 kb in H. erato) that initiates at 36 h APF (~20% pupal development) as cortex declines and persists through at least 60 h APF
    groups:
      - heliconius_onset_36h
      - heliconius_persist_60h
    values:
      t_onset:
        printed: '36'
        unit: h
        kind: value
        group: heliconius_onset_36h
        spread: none
      t_persist:
        printed: '60'
        unit: h
        kind: value
        group: heliconius_persist_60h
        spread: none
    anchor:
      quote: From 36 h after pupa formation, or ∼20% of pupal development, cortex expression significantly decreases and ivory is detected and persists up until at least 60 h after pupa formation.
      where: Results

  F1_ivory_onset_pct:
    unit: F1_IVORY_LOCUS
    measure: relative pupal development
    method: Pupal wing RNA-seq developmental staging in H. melpomene and H. erato
    finding: Onset of ivory lncRNA transcription and simultaneous decline of cortex expression occur at approximately 20% of pupal development (36 h APF)
    groups:
      - heliconius_onset_36h
    values:
      onset_pct:
        printed: '~20'
        unit: '%'
        kind: value
        group: heliconius_onset_36h
        spread: none
    anchor:
      quote: From 36 h after pupa formation, or ∼20% of pupal development, cortex expression significantly decreases and ivory is detected and persists up until at least 60 h after pupa formation.
      where: Results

  F1_ivory_atac_h3k4me3:
    unit: F1_IVORY_LOCUS
    measure: developmental milestone timing
    method: 36 h pupal hindwing ATAC-seq (H. melpomene and H. erato) and 3-day-old pupal wing H3K4me3 histone ChIP-seq + Hi-C TAD reanalysis (H. erato)
    finding: ATAC-seq at 36 h APF reveals pupal-wing-specific open chromatin immediately 5' of ivory exon 1 in both species, and 3-day-old (72 h) H. erato wings show strong H3K4me3 active-promoter enrichment within a TAD centered on ivory
    groups:
      - h_melpomene_atac
      - h_erato_atac
      - h_erato_h3k4me3
    values:
      atac_stage_hm:
        printed: '36'
        unit: h
        kind: value
        group: h_melpomene_atac
        spread: none
      atac_stage_he:
        printed: '36'
        unit: h
        kind: value
        group: h_erato_atac
        spread: none
      chip_stage_he:
        printed: '3'
        unit: day
        kind: value
        group: h_erato_h3k4me3
        spread: none
    anchor:
      quote: histone modification profiling performed in three-day-old pupal wings reveals that the ivory 5’ region coincides with a strong H3K4me3 signal, a hallmark of transcriptionally active promoters
      where: Results

  F2_ivory_g0_penetrance:
    unit: F2_IVORY_MKO_ISH
    measure: crispant phenotype penetrance
    method: CRISPR/Cas9 embryonic microinjection targeting the conserved ivory promoter and first exon across H. erato, H. charithonia, and V. cardui
    finding: Targeting the ivory promoter and first exon yields high-penetrance (57% of adults) transformations of melanic scales to yellow-white states with large healthy mutant clones and no non-scale pleiotropy
    groups:
      - ivory_g0_mko_pooled
    values:
      ivory_mko_penetrance:
        printed: '57'
        unit: '%'
        kind: percent
        group: ivory_g0_mko_pooled
        spread: none
    anchor:
      quote: The high penetrance of this phenotype (in 57% of adults), as well as the large size of mutant clones, often spanning entire individuals that emerged healthily
      where: Results

  F2_ivory_ish_prefiguring:
    unit: F2_IVORY_MKO_ISH
    measure: relative pupal development
    method: Chromogenic DIG-labeled RNA in situ hybridization targeting the conserved first exon of ivory in dissected pupal wings (20–35% pupal development)
    finding: At 30% pupal development in H. erato (and 20–35% in V. cardui and H. charithonia), ivory RNA expression strictly prefigures adult melanic scales (including the melanized yellow-bar region of unbanded H. erato morphs) and is absent from red, yellow, and white non-melanic scales
    groups:
      - h_erato_ish_30pct
      - v_cardui_ish_pupal
    values:
      h_erato_ish_pct:
        printed: '30'
        unit: '%'
        kind: value
        group: h_erato_ish_30pct
        spread: none
    anchor:
      quote: Expression of ivory in 30% pupal wing tissue of H. erato prefigures adult melanic scales, and mKO results in a complete loss of black scales.
      where: Fig 2 caption

  F3_ivory_germline_radiolabel:
    unit: F3_VC_IVORY_GERMLINE
    measure: crispant wing phenotype count
    method: G1/G2 germline crosses of V. cardui ivory crispants with WGS genotyping and [14C]-Tyrosine / [14C]-Tryptophan metabolic radiolabeling
    finding: Viable G1/G2 V. cardui germline mutants carrying biallelic 82/97 bp deletions across ivory exon 1 lose melanin across all wing and body scales matching Tyrosine radiolabeling, while Tryptophan-labeled ommochrome scales remain completely intact
    groups:
      - vc_ivory_germline_ko
      - vc_tyr_radiolabel
      - vc_trp_radiolabel
    anchor:
      quote: we established that a biallelic deletion spanning 82/97 bp across the lncRNA first exon is sufficient to generate a strong ivory phenotype
      where: Results

  F3_cortex_g0_counts:
    unit: F3_VC_CORTEX_VS_IVORY
    measure: crispant wing phenotype count

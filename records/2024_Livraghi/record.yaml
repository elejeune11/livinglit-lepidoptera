  F3_cortex_vs_ivory_penetrance:
    unit: F3_VC_CORTEX_VS_IVORY
    measure: crispant phenotype penetrance
    method: Direct functional comparison of coding cortex exon 2 CRISPR knockouts (0% wing penetrance) versus noncoding ivory promoter/first-exon CRISPR knockouts (57% adult wing penetrance)
    finding: Disrupting coding cortex exon 2 produces 0% wing pigmentation phenotypes (0/7 G0 and F1 Δ8/Δ10nt nulls), whereas disrupting the adjacent ivory lncRNA promoter/exon 1 produces 57% penetrance of melanic scale loss

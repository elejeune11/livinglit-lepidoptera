          view_orientation: 3D amplitude data
      proto_ridges_41pct:
        label: Nascent regularly spaced proto-ridges on pupa A40 at 41% development (Fig. 5B, 5H)
        kind: natural
        context:
          pupal_stage_pct: 41%
          view_orientation: single slice
      stable_ridges_47_89pct:
        label: Constant-spacing developing scale ridges tracked continuously (47–89% development, Fig. 5G)
        kind: natural
        context:
          pupal_stage_pct: 47% to 89%
          view_orientation: 3D amplitude data

evidence:
  F1_adult_ridge_fft:
    unit: U1_ADULT_SCALE
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT and 10-transect profiling on Fig. 1C–F adult SEM and SRPM micrographs
    finding: Calibrated 2D-FFT recovers adult V. cardui longitudinal ridge spacing of 1.81–1.91 µm in SEM (Fig. 1C–D) and 2.11–2.13 µm in volumetric/single-slice SRPM (Fig. 1E–F)
    groups:
      - adult_sem
      - adult_srpm_vol
      - adult_srpm_phase
    anchor:
      quote: Scanning electron micrograph of individual adult scales, with ridges running down the length of the scale.
      where: Fig. 1 caption

  F1_adult_crossrib_fft:
    unit: U1_ADULT_SCALE
    measure: crossrib spacing
    method: LivingLit calibrated orthogonal 2D-FFT on Fig. 1D high-magnification SEM scale finger (5 µm bar)
    finding: Orthogonal 2D-FFT on the adult SEM finger (Fig. 1D) measures transverse crossrib spacing of 0.48 µm (SNR 30.4)
    groups:
      - adult_sem
    anchor:
      quote: Magnification of scale finger showing that ridges consist of stacked lamellae and are connected by crossribs.
      where: Fig. 1 caption

  F1_lower_lamina_thickness:
    unit: U1_ADULT_SCALE
    measure: lower lamina thickness
    method: Reference adult scale blueprint thickness stated in Introduction
    finding: Adult V. cardui scales feature a thin basal lower lamina on the order of 100 nm in thickness
    groups:
      - adult_sem
    values:
      lower_lamina:
        printed: '100'
        unit: nm
        kind: value
        group: adult_sem
        spread: none
    anchor:
      quote: Supporting trabeculae bridge the upper features and lower scale surface, which is essentially a thin lamina on the order of 100 nm in thickness.
      where: Introduction

  F2_forewing_timing:
    unit: U2_FOREWING_LIVE
    measure: developmental milestone timing
    method: Direct pupation timestamping to within 15 min prior to single-timepoint forewing SRPM imaging
    finding: Live forewing scale tips were imaged in vivo at 8.12 d post-pupation (83% development for specimen F43)
    groups:
      - pupa_83pct_slice
    values:
      forewing_age_d:
        printed: '8.12'
        unit: d
        kind: value
        group: pupa_83pct_slice
        spread: none
    anchor:
      quote: showing the tips of forewing scales in a pupa at 83% development (8.12 d for this specimen).
      where: Fig. 2 caption

  F2_forewing_stage_frac:
    unit: U2_FOREWING_LIVE
    measure: relative pupal development
    method: Normalized fraction of total pupal duration at forewing imaging (specimen F43)
    finding: Live forewing SRPM snapshot corresponds to 83% (0.83 fraction) of pupal development at 8.12 d APF
    groups:
      - pupa_83pct_slice
    values:
      stage_frac_83:
        printed: '0.83'
        unit: '1'
        kind: fraction
        group: pupa_83pct_slice
        spread: none
    anchor:
      quote: showing the tips of forewing scales in a pupa at 83% development (8.12 d for this specimen).
      where: Fig. 2 caption

  F2_forewing_ridge_fft:
    unit: U2_FOREWING_LIVE
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT on Fig. 2G–I live pupal forewing SRPM amplitude, volumetric, and phase-gradient images
    finding: Calibrated 2D-FFT on 83% live pupal forewing scales recovers consistent 2.01–2.04 µm ridge spacing across amplitude (2.04 µm), volumetric (2.04 µm), and phase-gradient (2.01 µm) views
    groups:
      - pupa_83pct_slice
      - pupa_83pct_vol
    anchor:
      quote: Visualization of micro- and nanoscale features on scales via the phase gradient associated with the amplitude data in G.
      where: Fig. 2 caption

  F3_pupal_duration:
    unit: U3_TIMELINE_PATTERNING
    measure: developmental milestone timing
    method: Continuous pupal cohort monitoring from larval skin molt to adult eclosion
    finding: Total V. cardui pupal duration (100% development) averages about 10 d and varies by up to 2 d across individuals
    groups:
      - lamina_99pct
    values:
      pupal_duration_d:
        printed: 10 ± 2
        unit: d
        kind: mean
        group: lamina_99pct
        spread: range
    anchor:
      quote: the duration of the pupal stage (100% development) is typically about 10 d and can vary by up to 2 d
      where: Results

  F3_developmental_milestones:
    unit: U3_TIMELINE_PATTERNING
    measure: relative pupal development
    method: Continuous in vivo volumetric SRPM tracking (15-min cycles) from pupation to eclosion
    finding: Continuous live imaging maps epidermal mitoses (5%), cover precursor enlargement (15%), two-stage ground precursor intercalation (13–18%), protrusion (34%), finger onset (44%), final size (62%), and lower lamina (99%)
    groups:
      - epidermal_5pct
      - precursor_15pct
      - precursor_two_stage
      - protrusion_34pct
      - fingers_44pct
      - final_size_62pct
      - lamina_99pct
    values:
      mitoses_pct:
        printed: '5'
        unit: '%'
        kind: value
        group: epidermal_5pct
        spread: none
      precursor_pct:
        printed: '15'
        unit: '%'
        kind: value
        group: precursor_15pct
        spread: none
      ground_intercalation_end_pct:
        printed: '18'

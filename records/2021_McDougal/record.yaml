  D2_scale_area_41pct:
    unit: U4_COVER_SCALE_GROWTH
    measure: scale area
    method: Planar bounding-box area A = L_s * W_s from pupa A40 41% mean cover scale length and width
    finding: At 41% pupal development, cover scale planar projected area reaches approximately 6,481 µm^2 (141.6 µm × 45.77 µm)
    groups:
      - a40_41pct
    values:
      area_41pct:
        printed: '6481'
        unit: µm^2
        kind: value
        group: a40_41pct
        spread: none
    anchor:
      quote: Surface area and volume are estimated using the measured length, width, and thickness to define the presumptive bounding box of the scale.
      where: Materials and Methods

  F5_key_window_timing:
    unit: U4_COVER_SCALE_GROWTH
    measure: developmental milestone timing
    method: Continuous SRPM time-lapse tracking of pupa A40 across the 35–40% key morphogenetic window
    finding: The rapid morphogenetic transition (35–40% development) spans roughly 100 h to 114 h APF
    groups:
      - a40_35pct
      - a40_41pct
    values:
      window_start_h:
        printed: '100'
        unit: h
        kind: value
        group: a40_35pct
        spread: none
      window_end_h:
        printed: '114'
        unit: h
        kind: value
        group: a40_41pct
        spread: none
    anchor:
      quote: A relatively short window of time, roughly 35 to 40% of development (around 100 h to 114 h), contains many key moments of scale formation
      where: Results

  F5_actin_ridge_spacing:
    unit: U5_ACTIN_RIDGE_DYNAMICS
    measure: ridge spacing
    method: 2D Fourier analysis of reoriented live SRPM 3D amplitude slices (Fig. 5G) and LivingLit 2D-FFT on Fig. 5B phase gradient
    finding: Longitudinal actin bundles widen with the expanding scale to ~1.8 µm separation, nascent 41% proto-ridges show ~1.40 µm FFT spacing, and established ridges stay constant (~1.6–1.9 µm) from 47% to at least 89% development
    groups:
      - actin_widening_39pct
      - proto_ridges_41pct
      - stable_ridges_47_89pct
    values:
      actin_plateau_um:
        printed: '1.8'
        unit: µm
        kind: value
        group: actin_widening_39pct
        spread: none
      ridge_constant_um:
        printed: '1.8'
        unit: µm
        kind: value
        group: stable_ridges_47_89pct
        spread: none
    anchor:
      quote: As the scale widens, the spacing of actin bundles also widens until it reaches ∼1.8-µm separation.
      where: Results

  D1_ridge_density:
    unit: U5_ACTIN_RIDGE_DYNAMICS
    measure: ridge density
    method: Reciprocal spatial frequency rho = 1/d derived from the ~1.8 µm plateau ridge spacing
    finding: The ~1.8 µm constant ridge spacing corresponds to a linear spatial frequency of 0.56 × 10^6 m^-1 (~0.56 ridges/µm)
    groups:
      - stable_ridges_47_89pct
    values:
      rho_1p8:
        printed: 0.56e6
        unit: m^-1
        kind: value
        group: stable_ridges_47_89pct
        spread: none
    anchor:
      quote: As the scale widens, the spacing of actin bundles also widens until it reaches ∼1.8-µm separation.
      where: Results
    scaling:
      independent_measure: ridge spacing
      direction: down
      anchor:
        quote: We then find the dominant spatial frequency via 2D Fourier analysis.
        where: Materials and Methods

  F5_proto_ridge_height:
    unit: U5_ACTIN_RIDGE_DYNAMICS
    measure: ridge buckling amplitude
    method: 1D unwrapped phase surface height profiling across three live scales in pupa A40 (Fig. 5B, 5H)
    finding: Regular proto-ridges emerge by 39% development and grow to approximately 100 nm peak-to-trough height by 41% development
    groups:
      - proto_ridges_41pct
    n:
      printed: measurements from three scales
      per_group:

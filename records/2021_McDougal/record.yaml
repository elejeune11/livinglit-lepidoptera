  U5_ACTIN_RIDGE_DYNAMICS:
    where: Fig. 5A–B, G–H and Results
    title: In vivo actin bundle widening, nascent proto-ridge height growth, and constant ridge periodicity (35–89% development)
    context:
      life_stage: pupa
      anatomical_region: hindwing
      scale_type: cover scales
      imaging_modality: speckle-correlation reflection phase microscopy
      hydration_and_prep: live and unlabeled

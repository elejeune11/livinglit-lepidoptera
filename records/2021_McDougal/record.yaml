        printed: '100'
        unit: nm
        kind: value
        group: proto_ridges_41pct
        spread: none
    anchor:
      quote: Phase data (Middle) from marked region indicate regular spacing of proto-ridges, which are about 100 nm in height
      where: Fig. 5 caption


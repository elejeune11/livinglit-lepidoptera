id: 2021_McDougal
field_set: 4
source:
  title: In vivo visualization of butterfly scale cell morphogenesis in Vanessa cardui
  doi: 10.1073/pnas.2112009118
  year: '2021'
  first_author: Anthony D. McDougal
  last_author: Mathias Kolle
  lab: Kolle & So labs, Massachusetts Institute of Technology
  journal: PNAS
  files:
    - PMC8670486.xml
    - measured_A40ScaleMeasurements.xlsx
  not_used:
    - file: pnas.202112009fig01.jpg
      why: Decomposed into atomic panels (macro morphology, SEM and SRPM scale bars, and 2D-FFT ridge/crossrib metrology) in panels.yaml
    - file: pnas.202112009fig02.jpg
      why: Decomposed into atomic panels (surgical schematic, optical window macro photos, SRPM 2D-FFT, and surface profile extractors) in panels.yaml
    - file: pnas.202112009fig03.jpg
      why: Decomposed into atomic panels (calibrated live SRPM developmental timeline 5-99% and milestone schematic) in panels.yaml
    - file: pnas.202112009fig04.jpg
      why: Decomposed into atomic panels (13-18% two-stage precursor cell SRPM series and schematics 4A'-4D') in panels.yaml
    - file: pnas.202112009fig05.jpg
      why: Decomposed into atomic panels (35% and 41% volumetric/phase/profile views, 2D-FFT proto-ridges, and 7 bespoke quantitative plot extractors) in panels.yaml
  missing:
    - SI Appendix (Figs. S1-S11, Movies S1-S5) and raw 3D interferogram .mat stacks / Group1-3 .mat files (hosted on Zenodo 10.5281/zenodo.5532941; measured_A40ScaleMeasurements.xlsx, 10 phaseProfiles.mat tables, and 33 MATLAB scripts harvested locally)

context_anchors:
  - field: taxon
    value: Vanessa cardui
    anchor:
      quote: Here, we report the continuous, in vivo, label-free imaging of growing scale cells of Vanessa cardui using speckle-correlation reflection phase microscopy.
      where: Abstract
  - field: life_stage
    value: adult
    anchor:
      quote: Scanning electron micrograph of individual adult scales, with ridges running down the length of the scale.
      where: Fig. 1 caption
  - field: life_stage
    value: pupa
    anchor:
      quote: showing the tips of forewing scales in a pupa at 83% development (8.12 d for this specimen).
      where: Fig. 2 caption
  - field: pupal_stage_pct
    value: 5%
    anchor:
      quote: Wing tissue at 5% of pupal development, exhibiting cell division prior to precursor cell differentiation.
      where: Fig. 3 caption
  - field: pupal_stage_pct
    value: 15%
    anchor:
      quote: Enlarged, raised precursor cells (red, encircled by dashed line) are identifiable at 15% development.
      where: Fig. 3 caption
  - field: pupal_stage_pct
    value: 13 to 18%
    anchor:
      quote: Cover scale precursor cells (raised red spheroids) are labeled 1, 2, and 3 and are tracked over 13 to 18% of development in a single pupa.
      where: Fig. 4 caption
  - field: pupal_stage_pct
    value: 34%
    anchor:
      quote: Scales (two are emphasized by the dashed outlines) have begun to grow away from the sockets on the wing (one is emphasized by the dotted outline) at 34% development
      where: Fig. 3 caption
  - field: pupal_stage_pct
    value: 35%
    anchor:
      quote: Scale morphology at 35% of pupal development.
      where: Fig. 5 caption
  - field: pupal_stage_pct
    value: 37%
    anchor:
      quote: The onset of ridge formation appears to start near the end of the scales’ expansion (∼37% of development for this specimen)
      where: Results
  - field: pupal_stage_pct
    value: 39%
    anchor:
      quote: At ∼39% of development, long spars of material running down the length of the scale become visible in the amplitude data (Fig. 5G).
      where: Results
  - field: pupal_stage_pct
    value: 41%
    anchor:
      quote: Scale morphology at 41% of pupal development.
      where: Fig. 5 caption
  - field: pupal_stage_pct
    value: 44%
    anchor:
      quote: Expanding scales and the beginning of finger formation at 44% development.
      where: Fig. 3 caption
  - field: pupal_stage_pct
    value: 47%
    anchor:
      quote: our quantification of the spacing and height of scale ridges reveals that the ridge spacing remains constant from the first occurrence of ridges at about 47% development
      where: Conclusion
  - field: pupal_stage_pct
    value: 47% to 89%
    anchor:
      quote: ridge spacing remains constant from the first occurrence of ridges at about 47% development to at least 89% development.
      where: Conclusion
  - field: pupal_stage_pct
    value: 62%
    anchor:
      quote: Scales at their final size with well-pronounced fingers at 62% development.
      where: Fig. 3 caption
  - field: pupal_stage_pct
    value: 83%
    anchor:
      quote: showing the tips of forewing scales in a pupa at 83% development (8.12 d for this specimen).
      where: Fig. 2 caption
  - field: pupal_stage_pct
    value: 99%
    anchor:
      quote: Scales show a lower lamina (green zone) underneath developed ridges (red zone) at 99% development.
      where: Fig. 3 caption
  - field: anatomical_region
    value: wing
    anchor:
      quote: Optical micrograph of orange and black wing scales.
      where: Fig. 1 caption
  - field: anatomical_region
    value: forewing
    anchor:
      quote: showing the tips of forewing scales in a pupa at 83% development (8.12 d for this specimen).
      where: Fig. 2 caption
  - field: anatomical_region
    value: hindwing
    anchor:
      quote: To expose the hindwing for continuous imaging, we adapted the surgical strategy described by Otaki and coworkers (35, 44).
      where: Materials and Methods
  - field: scale_type
    value: adult scales
    anchor:
      quote: Scanning electron micrograph of individual adult scales, with ridges running down the length of the scale.
      where: Fig. 1 caption
  - field: scale_type
    value: wing scales
    anchor:
      quote: The functional structures of butterfly wing scales form during pupal development
      where: Introduction
  - field: scale_type
    value: cover scales
    anchor:
      quote: We use Dragonfly (Object Research Systems) to measure length, width, and thickness of cover scales in deconvolved 3D amplitude data
      where: Materials and Methods
  - field: scale_type
    value: precursor cells
    anchor:
      quote: Enlarged, raised precursor cells (red, encircled by dashed line) are identifiable at 15% development.
      where: Fig. 3 caption
  - field: scale_type
    value: ground scale precursor cells
    anchor:
      quote: New ground scale precursor cells (arrowheads) are now of comparable size to the older ones; all precursor cells are arranged in a straight row.
      where: Fig. 4 caption
  - field: scale_type
    value: cover scales and ground scales
    anchor:
      quote: cover scales (arrows) and ground scales (arrowheads) are easily distinguishable.
      where: Fig. 3 caption
  - field: imaging_modality
    value: Scanning electron micrograph
    anchor:
      quote: Scanning electron micrograph of individual adult scales, with ridges running down the length of the scale.
      where: Fig. 1 caption
  - field: imaging_modality
    value: speckle-correlation reflection phase microscopy
    anchor:
      quote: Here, we report the continuous, in vivo, label-free imaging of growing scale cells of Vanessa cardui using speckle-correlation reflection phase microscopy.
      where: Abstract
  - field: view_orientation
    value: upper surface
    anchor:
      quote: In general, the upper surface of a scale consists of ridges running down its length; these ridges are composed of overlapping lamellae and are connected by crossribs
      where: Introduction
  - field: view_orientation
    value: Volumetric
    anchor:
      quote: Volumetric amplitude stack showing overlapping scales (red, highest slice; green, lowest slice through a 6-µm depth).
      where: Fig. 2 caption
  - field: view_orientation
    value: single slice
    anchor:
      quote: A single slice of deconvolved reflected light amplitude data, showing the tips of forewing scales in a pupa at 83% development
      where: Fig. 2 caption
  - field: view_orientation
    value: 3D amplitude data
    anchor:
      quote: We use Dragonfly (Object Research Systems) to measure length, width, and thickness of cover scales in deconvolved 3D amplitude data
      where: Materials and Methods
  - field: hydration_and_prep
    value: live and unlabeled
    anchor:
      quote: This interferometric approach yields both phase and amplitude data from live and unlabeled specimens, with excellent axial sectioning, rejecting out-of-focus information
      where: Results
  - field: hydration_and_prep
    value: Scanning electron micrograph
    anchor:
      quote: Scanning electron micrograph of individual adult scales, with ridges running down the length of the scale.
      where: Fig. 1 caption


        kind: value
        group: lamina_99pct
        spread: none
    anchor:
      quote: By tracking gradual changes in scale growth over time, we can explicitly define the timing of specific developmental events within individual pupae
      where: Results

  F5_scale_width:
    unit: U4_COVER_SCALE_GROWTH
    measure: scale width
    method: Dragonfly 3D morphometry on deconvolved live SRPM volumes of pupa A40 cover scales (measured_A40ScaleMeasurements.xlsx)
    finding: Cover scale width expands 5.3-fold from 8.58 ± 0.91 µm at 3.52 d (29.7%) to 24.74 ± 1.75 µm (35%), 30.75 ± 1.93 µm (37%), 45.77 ± 6.21 µm (41%), 39.97 ± 1.29 µm (47%), and 46.17 µm (53.7%)

units:
  U1_ADULT_SCALE:
    where: Fig. 1C–F and Introduction
    title: Adult Vanessa cardui wing scale ridge, crossrib, and lower-lamina ultrastructure across SEM and SRPM
    context:
      life_stage: adult
      pupal_stage_pct: not applicable
      anatomical_region: wing
      scale_type: adult scales
    groups:
      adult_sem:
        label: Adult V. cardui wing scale (planar SEM, Fig. 1C–D)
        kind: natural
        context:
          imaging_modality: Scanning electron micrograph
          view_orientation: upper surface
          hydration_and_prep: Scanning electron micrograph
      adult_srpm_vol:
        label: Adult V. cardui wing scale (volumetric SRPM, Fig. 1E)
        kind: natural
        context:
          imaging_modality: speckle-correlation reflection phase microscopy
          view_orientation: Volumetric
          hydration_and_prep: not stated
      adult_srpm_phase:
        label: Adult V. cardui wing scale (single-slice phase SRPM, Fig. 1F)
        kind: natural
        context:
          imaging_modality: speckle-correlation reflection phase microscopy
          view_orientation: single slice
          hydration_and_prep: not stated

  U2_FOREWING_LIVE:
    where: Fig. 2G–K and Results
    title: In vivo single-timepoint SRPM of late-pupal (83% / 8.12 d) forewing scale ridges and lamellae
    context:
      life_stage: pupa
      pupal_stage_pct: 83%
      anatomical_region: forewing
      scale_type: wing scales
      imaging_modality: speckle-correlation reflection phase microscopy
      hydration_and_prep: live and unlabeled
    groups:
      pupa_83pct_slice:
        label: Live pupal forewing scales at 83% development (8.12 d, single amplitude/phase slice, Fig. 2G, I–K)
        kind: natural
        context:
          view_orientation: single slice
      pupa_83pct_vol:
        label: Live pupal forewing scales at 83% development (8.12 d, 6-µm volumetric stack, Fig. 2H)
        kind: natural
        context:
          view_orientation: Volumetric

  U3_TIMELINE_PATTERNING:
    where: Figs. 3–4 and Results
    title: Continuous in vivo developmental timeline of Vanessa cardui hindwing scale precursor patterning and morphogenesis
    context:
      life_stage: pupa
      anatomical_region: hindwing
      imaging_modality: speckle-correlation reflection phase microscopy
      view_orientation: Volumetric
      hydration_and_prep: live and unlabeled
    groups:
      epidermal_5pct:
        label: Generalized epidermal sheet mitoses at 5% pupal development (Fig. 3A)
        kind: natural
        context:
          scale_type: wing scales
          pupal_stage_pct: 5%
      precursor_15pct:
        label: Enlarged raised cover scale precursor cells at 15% development (Fig. 3B)
        kind: natural
        context:
          scale_type: precursor cells
          pupal_stage_pct: 15%
      precursor_two_stage:
        label: Two-stage intercalation of ground scale precursor cells between cover precursors (13–18%, Fig. 4)
        kind: natural
        context:
          scale_type: ground scale precursor cells
          pupal_stage_pct: 13 to 18%
      protrusion_34pct:
        label: Protruding cover and ground scales at 34% development (Fig. 3C)
        kind: natural
        context:
          scale_type: cover scales and ground scales
          pupal_stage_pct: 34%
      fingers_44pct:
        label: Expanding scales initiating apical fingers at 44% development (Fig. 3D)
        kind: natural
        context:
          scale_type: cover scales and ground scales
          pupal_stage_pct: 44%
      final_size_62pct:
        label: Final-size scales with pronounced fingers at 62% development (Fig. 3E)
        kind: natural
        context:
          scale_type: cover scales and ground scales
          pupal_stage_pct: 62%
      lamina_99pct:
        label: Mature scales with lower lamina beneath developed ridges at 99% development (Fig. 3F)

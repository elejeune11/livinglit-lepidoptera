evidence:
  F1_ridge_reported:
    unit: F1_SCALES
    measure: ridge spacing
    method: 2D Fourier inter-ridge distance from SEM micrographs across 3 individuals (DataS10)
    finding: Apical ridge spacing spans 4.4-fold across C. eurytheme scale classes—1.0 ± 0.1 µm in male UVI scales (N=25), 2.0 ± 0.1 µm in canonical scales (N=125), and 4.4 ± 0.5 µm in male spatulate scales (N=20)
    groups:
      - canonical_all
      - uvi_male
      - spatulate_male
    n:
      printed: N = 125 typical, N = 25 UVI, N = 20 spatulate scales
      per_group:
        canonical_all: '125'
        uvi_male: '25'
        spatulate_male: '20'
      counts: scales
      levels:
        individuals: 3
        scales: 25
      test_unit: scales
    values:
      typical:
        printed: 2.0 ± 0.1
        unit: µm
        kind: mean
        group: canonical_all
        spread: SD
      uvi:
        printed: 1.0 ± 0.1
        unit: µm
        kind: mean
        group: uvi_male
        spread: SD
      spatulate:
        printed: 4.4 ± 0.5
        unit: µm
        kind: mean
        group: spatulate_male
        spread: SD
    anchor:
      quote: with a distance between ridges averaging only 1 μm (1.0 ± 0.1 μm, N = 25 scales) (Fig 1D, 1G).
      where: Results

  F1_ridge_sem_read:
    unit: F1_SCALES
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT and 12-transect profiling on Fig 1E–H SEM panels
    finding: Direct calibrated 2D-FFT on Fig 1E–H SEMs independently recovers canonical (1.75–1.94 µm), dense male UVI (0.97 µm), and wide male spatulate (3.85–4.03 µm) apical ridge spacings
    groups:
      - fig1e_black
      - fig1f_orange
      - uvi_male
      - spatulate_male
    anchor:
      quote: E–H. Apical views of the ultrastructure of representative scale types (same scale types as in panels B, C), featuring the longitudinal ridges
      where: Fig 1 caption

  F1_uvi_vs_canonical:
    unit: F1_SCALES
    measure: ridge spacing
    method: Fourier inter-ridge spacing comparison between male UVI dorsal cover scales and canonical pigmentary scales (DataS10)
    finding: Male UVI ridge-lamellar cover scales halve inter-ridge spacing compared to canonical pigmentary scales (1.0 ± 0.1 vs 2.0 ± 0.1 µm)
    compares:
      - uvi_male
      - canonical_all
    test_of: pair
    n:
      printed: N = 25 UVI and N = 125 typical scales across 3 individuals
      per_group:
        uvi_male: '25'
        canonical_all: '125'
      counts: scales
      levels:
        individuals: 3
        scales: 25
      test_unit: scales
    values:
      uvi_d:
        printed: 1.0 ± 0.1
        unit: µm
        kind: mean
        group: uvi_male
        spread: SD
      typ_d:
        printed: 2.0 ± 0.1
        unit: µm
        kind: mean
        group: canonical_all
        spread: SD
    stated_direction:
      direction: down
      anchor:
        quote: with a distance between ridges averaging only 1 μm (1.0 ± 0.1 μm, N = 25 scales) (Fig 1D, 1G).
        where: Results
    anchor:
      quote: with a distance between ridges averaging only 1 μm (1.0 ± 0.1 μm, N = 25 scales) (Fig 1D, 1G).
      where: Results

  D1_uvi_ridge_density:
    unit: F1_SCALES
    measure: ridge density
    method: Reciprocal spatial frequency rho = 1/d from apical inter-ridge spacing
    finding: Male UVI scales double apical ridge density (~1.0 ridges/µm) relative to canonical scales (~0.5 ridges/µm)
    groups:
      - uvi_male
      - canonical_all
    values:
      uvi_rho:
        printed: 1.0e6
        unit: m^-1
        kind: value
        group: uvi_male
        spread: none
      typ_rho:
        printed: 0.50e6
        unit: m^-1
        kind: value
        group: canonical_all
        spread: none
    anchor:
      quote: with a distance between ridges averaging only 1 μm (1.0 ± 0.1 μm, N = 25 scales) (Fig 1D, 1G).
      where: Results
    scaling:
      independent_measure: ridge spacing
      direction: down
      anchor:
        quote: also by the density of the ridges themselves, with a distance between ridges averaging only 1 μm (1.0 ± 0.1 μm, N = 25 scales)
        where: Results

  F2_dsx_crispant_n:
    unit: F2_DSX_MKO
    measure: crispant wing phenotype count
    method: CRISPR-Cas9 G0 mosaic knockout targeting Doublesex DNA-binding or Dimerization domain exons
    finding: 33 Dsx G0 crispant individuals exhibited consistent sex-specific mosaic effects on marginal bands, spatulate scales, and female ectopic UV-iridescence
    groups:
      - dsx_mko
    values:
      n_crispants:
        printed: '33'
        unit: individuals
        kind: count
        group: dsx_mko
        spread: none
    anchor:
      quote: while 33 crispant individuals showed spatially variegated effects as a result of this mosaicism, these experiments yielded consistent effects
      where: Results

  F6_snrnaseq_nuclei:
    unit: F6_SNRNASEQ
    measure: profiled nuclei / cell count
    method: 10x Chromium v3.1 snRNA-seq of a single 40% pupal male hindwing (Seurat v5, mtDNA < 3%)
    finding: Quality filtering retained 2,961 wing nuclei resolved into 9 clusters, including 1,550 scale-cell precursor nuclei across 8 sub-clusters
    groups:
      - all_nuclei
      - scale_precursors
    values:
      total_nuclei:
        printed: '2961'
        unit: nuclei
        kind: count
        group: all_nuclei
        spread: none
      scale_nuclei:
        printed: '1550'
        unit: nuclei
        kind: count
        group: scale_precursors
        spread: none
    anchor:
      quote: resulting in 2,961 filtered cells. Unsupervised clustering yielded nine robust clusters
      where: Results

  F8_scale2_scale3_de:
    unit: F6_SNRNASEQ
    measure: differentially expressed gene count
    method: Seurat v5 FindMarkers (Wilcoxon rank sum test with Bonferroni correction) comparing Bab- clusters Scale2 and Scale3
    finding: 1,024 genes are differentially expressed between male spatulate (Scale2) and UVI (Scale3) scale precursors at 40% pupal development
    groups:
      - scale2_vs_scale3
    values:
      n_de_between_bab_neg:
        printed: '1024'
        unit: genes
        kind: count
        group: scale2_vs_scale3
        spread: none
    anchor:
      quote: In addition, a total of 1,024 genes are differentially expressed between the two Bab− clusters
      where: Results

  F9_bab_chip_peaks:
    unit: F9_BAB_CHIP
    measure: ChIP-seq binding peak count
    method: Bab ChIP-seq on fixed pupal wing nuclei (2 replicates each at 40% and 60% pupal stages)
    finding: Bab ChIP-seq called 11,647 unique binding sites (9,430 at 40% and 2,216 at 60%) mapping to 1,482 stably bound candidate genes across both stages
    groups:
      - chip_40pct
      - chip_both_stages
    values:
      unique_sites:
        printed: '11647'
        unit: sites
        kind: count
        group: chip_both_stages
        spread: none
      stably_bound_genes:
        printed: '1482'
        unit: genes
        kind: count
        group: chip_both_stages
        spread: none
    anchor:
      quote: The intersection of predicted Bab occupancy sites at the two stages results in a list of 1,482 candidate genes
      where: Results

  F10_bab_uvi_targets_count:
    unit: F9_BAB_CHIP
    measure: differentially expressed gene count
    method: Intersection of Scale3 UVI-DE genes with >= 3 called Bab ChIP-seq peaks (DataS6)
    finding: 87 UVI-DE genes carry >= 3 Bab ChIP-seq binding peaks (DataS6), including 17 genes with known Drosophila cytoskeletal or cuticle functions
    groups:
      - uvi_de_bab_targets
    values:
      n_bab_uvi_targets:
        printed: '87'
        unit: genes
        kind: count
        group: uvi_de_bab_targets
        spread: none
      n_cytoskeleton_cuticle:
        printed: '17'
        unit: genes
        kind: count
        group: uvi_de_bab_targets
        spread: none
    anchor:
      quote: Stringent filtering criteria result in a list of 87 UVI-DE genes with 3 or more Bab ChIP binding peaks
      where: Results

  F10_bab_target_expression:
    unit: F9_BAB_CHIP
    measure: log2 fold change (expression)
    method: Seurat v5 differential expression in Scale3 UVI vs remaining scale clusters (DataS6)
    finding: In Bab- UVI scale precursors (Scale3), Bab is strongly downregulated (log2FC = -4.173, 24 ChIP peaks) while Bab-bound targets Eip75B (+2.027, 54 peaks) and Mwh (+2.329, 52 peaks) are sharply upregulated
    groups:
      - target_bab
      - target_eip75b
      - target_mwh
    values:
      bab_log2fc:
        printed: '-4.173'
        unit: '1'
        kind: value
        group: target_bab
        spread: none
        origin: from data
        data:
          file: associated/DataS6_DE_Scale3_3BabPeaksorMore.csv
          cells: C2
      eip75b_log2fc:
        printed: '2.027'
        unit: '1'
        kind: value
        group: target_eip75b
        spread: none
        origin: from data
        data:
          file: associated/DataS6_DE_Scale3_3BabPeaksorMore.csv
          cells: C3
      mwh_log2fc:
        printed: '2.329'
        unit: '1'
        kind: value
        group: target_mwh
        spread: none
        origin: from data
        data:
          file: associated/DataS6_DE_Scale3_3BabPeaksorMore.csv
          cells: C4
    anchor:
      quote: the loci encoding the nuclear hormone receptor Eip75b and cytoskeletal regulator Multiple wing hair (Mwh) each show more than 50 Bab ChIP sites
      where: Results

  F10_bab_target_peaks:
    unit: F9_BAB_CHIP
    measure: ChIP-seq binding peak count
    method: Bab ChIP-seq peak calls assigned to candidate loci in DataS6
    finding: Eip75B (54 Bab ChIP peaks), Multiple wing hairs / Mwh (52 peaks), and Bab itself (24 peaks) show high-density Bab chromatin occupancy

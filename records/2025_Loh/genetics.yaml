      quote: DsxF is required to maintain Bab expression at high levels in the female dorsal scale, thus feminizing the wing phenotype by preventing UVI scale differentiation.
      where: Results
    note: Dsx siRNA electroporation eliminates Bab protein in female dorsal cover scales while preserving Bab in ground scales.


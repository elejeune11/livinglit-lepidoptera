context_anchors:
  - field: taxon
    value: Parides eurimedes
    anchor:
      quote: Hierarchical nanostructure of wing scales in Parides eurimedes (Papilionidae).
      where: Fig 1 caption
  - field: taxon
    value: Parides iphidamas
    anchor:
      quote: FIJI/ImageJ (version 2.1.0/1.53c) measurements of scanning electron microscopy (SEM) images of developing Parides eurimedes and P. iphidamas scales
      where: Fig 4—figure supplement 5—source data 1 caption
  - field: taxon
    value: Papilio polytes
    anchor:
      quote: Despite having a few model species (e.g., Papilio xuthus, Papilio polytes, and Papilio machaon)
      where: Introduction
  - field: taxon
    value: P. arcas
    anchor:
      quote: In adult male P. arcas, green scales have well-developed honeycomb lattice walls that sit above single gyroid crystals
      where: Results
  - field: taxon
    value: P. nireus
    anchor:
      quote: The same is observed in P. nireus, where the upper lamina of adult blue scales consists of an elaborate honeycomb lattice
      where: Results
  - field: sex
    value: male
    anchor:
      quote: Adult male with structurally colored green patches on their dorsal forewings.
      where: Fig 1 caption
  - field: anatomical_region
    value: dorsal forewing
    anchor:
      quote: Morphogenetic time series of the development of cuticular disks in pupal P. eurimedes dorsal forewing scales, acquired with a 100× confocal microscope.
      where: Fig 2 caption
  - field: pattern_element
    value: green patches
    anchor:
      quote: Adult male with structurally colored green patches on their dorsal forewings.
      where: Fig 1 caption
  - field: scale_type
    value: green cover scales
    anchor:
      quote: Early development of dorsal forewing green cover scales in pupal male P. eurimedes acquired with 60× confocal microscope.
      where: Fig 2—figure supplement 1 caption
  - field: scale_type
    value: cover scales
    anchor:
      quote: Early development of dorsal forewing green cover scales in pupal male P. eurimedes acquired with 60× confocal microscope.
      where: Fig 2—figure supplement 1 caption
  - field: functional_architecture
    value: honeycomb lattices
    anchor:
      quote: We comparatively studied the wing scale growth in P. polytes and P. eurimedes, which have irregular crossribs and honeycomb lattices, respectively.
      where: Results
  - field: functional_architecture
    value: irregular crossribs
    anchor:
      quote: We comparatively studied the wing scale growth in P. polytes and P. eurimedes, which have irregular crossribs and honeycomb lattices, respectively.
      where: Results
  - field: life_stage
    value: Adult
    anchor:
      quote: Adult male with structurally colored green patches on their dorsal forewings.
      where: Fig 1 caption
  - field: life_stage
    value: pupal
    anchor:
      quote: Morphogenetic time series of the development of cuticular disks in pupal P. eurimedes dorsal forewing scales, acquired with a 100× confocal microscope.
      where: Fig 2 caption
  - field: pupal_stage_pct
    value: 52%
    anchor:
      quote: At 52% pupal development, plasma membrane shows distinct pleating corresponding to the developing ridges, with irregular crossribs in between
      where: Results
  - field: pupal_stage_pct
    value: 57%
    anchor:
      quote: Furthermore, in P. eurimedes, the height of the honeycombs in scales from pupae injected at 57% development was higher on average than those treated at 52% development
      where: Results
  - field: pupal_stage_pct
    value: 62%
    anchor:
      quote: At around 62% pupal development, ridges appear to have grown to their near-final configuration
      where: Results
  - field: pupal_stage_pct
    value: 67%
    anchor:
      quote: As the scales became more sclerotized and flattened out later in development (at 67%), disintegrating F-actin appears to reorganize
      where: Results
  - field: pupal_stage_pct
    value: 76%
    anchor:
      quote: By 76% development, the cuticular disks appeared hollow and are surrounded by distinct bulb-like structures formed by the disintegrated F-actin bundles
      where: Results
  - field: target_gene
    value: Arp2/3 complex
    anchor:
      quote: we carried out pharmacological disruption experiments in pupae of both Parides and Papilio species using CK-666, a known inhibitor of the Arp2/3 complex
      where: Results
  - field: target_gene
    value: F-actin
    anchor:
      quote: We also co-stain chitin and F-actin on the developing pupal scales to investigate the role of cytoskeleton in scale nanostructure formation.
      where: Results
  - field: perturbation_modality
    value: pharmacological disruption
    anchor:
      quote: we carried out pharmacological disruption experiments in pupae of both Parides and Papilio species using CK-666, a known inhibitor of the Arp2/3 complex
      where: Results
  - field: perturbation_modality
    value: negative control
    anchor:
      quote: Violin plots depict the distribution of honeycomb lattice heights measured from multiple scales of a single emerged male individual either treated with CK-666 or DMSO (negative control) as pupae
      where: Fig 4—figure supplement 5 caption
  - field: chemical_agent
    value: CK-666
    anchor:
      quote: we carried out pharmacological disruption experiments in pupae of both Parides and Papilio species using CK-666, a known inhibitor of the Arp2/3 complex
      where: Results
  - field: chemical_agent
    value: DMSO
    anchor:
      quote: Violin plots depict the distribution of honeycomb lattice heights measured from multiple scales of a single emerged male individual either treated with CK-666 or DMSO (negative control) as pupae
      where: Fig 4—figure supplement 5 caption
  - field: imaging_modality
    value: Scanning electron microscopy (SEM)
    anchor:
      quote: Scanning electron microscopy (SEM) top view and (C) Focused ion beam (FIB)-SEM cross-sectional image of an adult green scale
      where: Fig 1 caption
  - field: imaging_modality
    value: confocal microscope
    anchor:
      quote: Morphogenetic time series of the development of cuticular disks in pupal P. eurimedes dorsal forewing scales, acquired with a 100× confocal microscope.
      where: Fig 2 caption
  - field: imaging_modality
    value: lattice structured illumination microscopy (SIM)
    anchor:
      quote: Morphogenetic time series of the development of columnar honeycomb lattice in pupal P. eurimedes dorsal forewing scale cells acquired with super-resolution lattice structured illumination microscopy (SIM).
      where: Fig 3 caption
  - field: imaging_modality
    value: 3D structured illumination microscopy (3D-SIM)
    anchor:
      quote: Maximum projected 3D structured illumination microscopy (3D-SIM) micrograph of green cover scales in pupal male P. arcas
      where: Fig 5 caption
  - field: view_orientation
    value: top view
    anchor:
      quote: Scanning electron microscopy (SEM) top view and (C) Focused ion beam (FIB)-SEM cross-sectional image of an adult green scale
      where: Fig 1 caption
  - field: view_orientation
    value: cross-sections
    anchor:
      quote: along with representative scanning electron microscopy (SEM) images of scale cross-sections used in measurements for P. eurimedes (A–C) and P. iphidamas (D–F).
      where: Fig 4—figure supplement 5 caption
  - field: hydration_and_prep
    value: sputter-coated with platinum or gold
    anchor:
      quote: All samples were sputter-coated with platinum or gold to increase conductivity and reduce charging.
      where: Materials and methods
  - field: hydration_and_prep
    value: fixed in 4% PEM-PFA
    anchor:
      quote: Wings from each pupa were dissected in cold phosphate buffer saline (PBS) and immediately fixed in 4% PEM-PFA at room temperature for 15 min.
      where: Materials and methods


evidence:
  F1B_sem_ridge_spacing:
    unit: F1_ADULT_ULTRASTRUCTURE
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT and 10-transect profiling on Fig 1B planar SEM (1 µm scale bar)
    finding: Adult male P. eurimedes dorsal forewing green cover scale longitudinal ridge spacing measures 1.197 µm by 2D-FFT (10-transect mean 1.167 µm, SNR 263)
    groups:
      - eurimedes_adult_green
    values:
      adult_ridge_d:
        printed: '1.197'
        unit: µm
        kind: value
        group: eurimedes_adult_green
        spread: none
    anchor:
      quote: Scanning electron microscopy (SEM) top view and (C) Focused ion beam (FIB)-SEM cross-sectional image of an adult green scale showing ridges and honeycomb lattice
      where: Fig 1 caption

  F1B_sem_crossrib_spacing:
    unit: F1_ADULT_ULTRASTRUCTURE
    measure: crossrib spacing
    method: LivingLit calibrated orthogonal 2D-FFT on Fig 1B planar SEM (1 µm scale bar)
    finding: Inter-ridge honeycomb pore spacing along the ridge axis of adult P. eurimedes green cover scales measures 0.355 µm (orthogonal 2D-FFT, SNR 38.8)
    groups:
      - eurimedes_adult_green
    values:
      adult_crossrib_d:
        printed: '0.355'
        unit: µm
        kind: value
        group: eurimedes_adult_green
        spread: none
    anchor:
      quote: Scanning electron microscopy (SEM) top view and (C) Focused ion beam (FIB)-SEM cross-sectional image of an adult green scale showing ridges and honeycomb lattice
      where: Fig 1 caption

  D1_eurimedes_ridge_density:
    unit: F1_ADULT_ULTRASTRUCTURE
    measure: ridge density
    method: Reciprocal spatial frequency rho = 1/d derived from Fig 1B adult green cover scale ridge spacing
    finding: Adult male P. eurimedes green cover scales exhibit a linear ridge density of 0.835 ridges/µm (8.35e5 m^-1)
    groups:
      - eurimedes_adult_green
    values:
      adult_rho:
        printed: '0.835e6'
        unit: m^-1
        kind: value
        group: eurimedes_adult_green
        spread: none
    anchor:
      quote: Scanning electron microscopy (SEM) top view and (C) Focused ion beam (FIB)-SEM cross-sectional image of an adult green scale showing ridges and honeycomb lattice
      where: Fig 1 caption

  M_pupal_duration:
    unit: F2_F4_PUPAL_TIMELINE
    measure: developmental milestone timing
    method: Direct pupation-to-emergence tracking in reared reference batches of P. eurimedes and P. polytes
    finding: Average total pupal duration from pupation to adult emergence is 21 d for Parides eurimedes and 10 d for Papilio polytes
    groups:
      - eurimedes_pupal_duration
      - polytes_pupal_duration
    values:
      eurimedes_total_d:
        printed: '21'
        unit: d
        kind: mean
        group: eurimedes_pupal_duration
        spread: not stated
      polytes_total_d:
        printed: '10'
        unit: d
        kind: mean
        group: polytes_pupal_duration
        spread: not stated
    anchor:
      quote: The average duration from pupation to emergence is 10 d for P. polytes and 21 d for P. eurimedes.
      where: Materials and methods

  M_ck666_injection_day:
    unit: F2_F4_PUPAL_TIMELINE
    measure: developmental milestone timing
    method: Pupal injection day post-pupation recorded in Figure 4—figure supplement 5—source data 1 (Panel A)
    finding: P. eurimedes CK-666 and DMSO pupal injections were administered at 11 d, 12 d, and 14 d after pupation
    groups:
      - eurimedes_52pct_actin
      - eurimedes_57pct_sim
      - eurimedes_67pct_sim
    values:
      day_52pct:
        printed: '11'
        unit: d
        kind: value
        group: eurimedes_52pct_actin
        spread: none
        origin: from data
        data:
          file: elife-89082-fig4-figsupp5-data1.xlsx
          sheet: Panel A (P. eurimedes)
          cells: A6
      day_57pct:
        printed: '12'
        unit: d
        kind: value
        group: eurimedes_57pct_sim
        spread: none
        origin: from data
        data:
          file: elife-89082-fig4-figsupp5-data1.xlsx
          sheet: Panel A (P. eurimedes)
          cells: A92
      day_67pct:
        printed: '14'
        unit: d
        kind: value
        group: eurimedes_67pct_sim
        spread: none
        origin: from data
        data:
          file: elife-89082-fig4-figsupp5-data1.xlsx
          sheet: Panel A (P. eurimedes)
          cells: A198
    anchor:
      quote: Developmental stage of the pupae at the time of injection are as marked.
      where: Fig 4—figure supplement 5 caption

  M_ck666_injection_stage_pct:
    unit: F2_F4_PUPAL_TIMELINE
    measure: relative pupal development
    method: Normalization of post-pupation injection days (11 d, 12 d, 14 d) by 21 d total P. eurimedes pupal duration
    finding: P. eurimedes CK-666 and DMSO injections at 11 d, 12 d, and 14 d APF correspond to 52%, 57%, and 67% relative pupal development
    groups:
      - eurimedes_52pct_actin
      - eurimedes_57pct_sim
      - eurimedes_67pct_sim
    values:
      stage_52pct:
        printed: '52'
        unit: '%'
        kind: value
        group: eurimedes_52pct_actin
        spread: none
      stage_57pct:
        printed: '57'
        unit: '%'
        kind: value
        group: eurimedes_57pct_sim
        spread: none
      stage_67pct:
        printed: '67'
        unit: '%'
        kind: value
        group: eurimedes_67pct_sim
        spread: none
    anchor:
      quote: We report the percentage of development in our time series for ease of comparison between species with different developmental rates.
      where: Materials and methods

  F4_actin_bundle_spacing:
    unit: F2_F4_PUPAL_TIMELINE
    measure: actin bundle spacing
    method: LivingLit calibrated 2D-FFT on magenta phalloidin channel of Fig 4A and 4B confocal micrographs (~52% pupal P. eurimedes)
    finding: Intact linear F-actin bundles in ~52% pupal P. eurimedes scales exhibit a periodic spacing of 1.67 µm in high-magnification Fig 4B (SNR 621, 10-transect mean 1.67 µm)
    groups:
      - eurimedes_52pct_actin
    values:
      actin_52pct_d:
        printed: '1.673'
        unit: µm
        kind: value
        group: eurimedes_52pct_actin
        spread: none
    anchor:
      quote: Initially (~52% development), Arp2/3 complex appear as sparse punctate dots while the F-actin bundles are still intact.
      where: Fig 4 caption

  F3_sim_ridge_spacing:
    unit: F2_F4_PUPAL_TIMELINE
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT on isolated yellow WGA chitin channel of Fig 3A (57%), 3A' (67%), and 3A'' (76%) lattice SIM micrographs
    finding: Hydrated pupal P. eurimedes chitinous ridge/disk-row period tracks from 1.78 µm at 57% (Fig 3A) to 1.38 µm at 67% (Fig 3A') and 1.11 µm at 76% development (Fig 3A'')
    groups:
      - eurimedes_57pct_sim
      - eurimedes_67pct_sim
      - eurimedes_76pct_sim
    values:

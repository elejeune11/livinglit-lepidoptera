  sara_saxs_bragg_q:
    item: T1_saxs_ridge_spacing
    group: h_sara_ecuador
    formula: q = 2*pi/d
    anchor:
      quote: one-dimensional scattering plots of scattered intensity, I, as a function of momentum transfer q, where q = (4πsinθ)/λ
      where: Material and methods
    library:
      formula: saxs_bragg_spacing
      vars:
        d: d
        q: q
    inputs:
      d:
        value: T1_saxs_ridge_spacing.values.sara_saxs
        kind: per sample
    aggregation: of means
    note: Rebuilds first-order SAXS momentum transfer peak q = 2*pi / 742 nm = 0.008468 nm^-1 (8.468e6 m^-1) for Ecuadorian H. sara via saxs_bragg_spacing.
  cyrbia_saxs_bragg_q:
    item: T1_saxs_ridge_spacing

      quote: ridge reflectors were much more densely packed in H. sara (ridge spacing at 723 nm) and H. erato cyrbia (887 nm)
      where: Results and discussion

  F4_F5_sem_ridge_fft:
    unit: U2_AFM_SEM_SCALE
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT and 10-transect ridge spacing analysis on Figs. 1, 4, and 5 high-mag SEM panels (1 um and 0.5 um scale bars)
    context:
      imaging_modality: Scanning electron microscopy
      view_orientation: surface
      hydration_and_prep: coated with a few nanometres of gold
    finding: Calibrated 2D-FFT on Figs. 4–5 SEMs independently recovers planar spacings matching SAXS in H. eleuchia (830 nm), H. m. cythera (835 nm), H. cydno (818 nm), and H. m. rosina (1135 nm), and reveals oblique-tilt cos(theta) foreshortening in H. sara (589 nm) and H. e. demophoon (673 nm)
    groups:
      - h_erato_cyrbia
      - h_erato_demophoon
      - h_sara_ecuador
      - h_eleuchia
      - h_cydno
      - h_melpomene_cythera
      - h_melpomene_rosina
    anchor:

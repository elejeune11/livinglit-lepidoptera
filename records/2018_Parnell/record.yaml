context_anchors:
  - field: taxon
    value: Heliconius erato cyrbia
    anchor:
      quote: Here we characterize the structures responsible for producing iridescence in five subspecies, Heliconius erato cyrbia (Godart, 1819)
      where: Introduction
  - field: taxon
    value: Heliconius erato demophoon
    anchor:
      quote: We also investigated the non-iridescent subspecies Heliconius erato demophoon Ménétriés, 1855 and Heliconius melpomene rosina (Boisduval, 1870) from Panama
      where: Introduction
  - field: taxon
    value: Heliconius sara
    anchor:
      quote: Heliconius sara sprucei Bates, 1864, Heliconius eleuchia primularis Butler, 1869, Heliconius cydno alithea (Hewitson, 1869)
      where: Introduction
  - field: taxon
    value: Heliconius eleuchia
    anchor:
      quote: Heliconius sara sprucei Bates, 1864, Heliconius eleuchia primularis Butler, 1869, Heliconius cydno alithea (Hewitson, 1869)
      where: Introduction
  - field: taxon
    value: Heliconius cydno
    anchor:
      quote: Heliconius sara sprucei Bates, 1864, Heliconius eleuchia primularis Butler, 1869, Heliconius cydno alithea (Hewitson, 1869)
      where: Introduction
  - field: taxon
    value: Heliconius melpomene cythera
    anchor:
      quote: Heliconius cydno alithea (Hewitson, 1869) and Heliconius melpomene cythera (Hewitson, 1869), likely corresponding to four independent evolutionary origins
      where: Introduction
  - field: taxon
    value: Heliconius melpomene rosina
    anchor:
      quote: We also investigated the non-iridescent subspecies Heliconius erato demophoon Ménétriés, 1855 and Heliconius melpomene rosina (Boisduval, 1870) from Panama
      where: Introduction
  - field: taxon
    value: H. erato cyrbia and H. melpomene cythera
    anchor:
      quote: mimetic relationships between H. cydno alithea and H. eleuchia primularis and between H. erato cyrbia and H. melpomene cythera.
      where: Introduction
  - field: taxon
    value: H. cydno and H. eleuchia
    anchor:
      quote: Note the mimicry between distantly related species pairs H. cydno and H. eleuchia, and between H. melpomene and H. erato.
      where: Fig 2 caption
  - field: life_stage
    value: butterflies
    anchor:
      quote: Specimens of the iridescent butterflies, H. erato cyrbia, H. sara, H. eleuchia, H. cydno alithea and H. melpomene cythera
      where: Material and methods
  - field: anatomical_region
    value: wing
    anchor:
      quote: Between 8 and 17 measurements were collected over 10–20 mm from one wing of each species/subspecies.
      where: Material and methods
  - field: anatomical_region
    value: forewings
    anchor:
      quote: Measurements are from within the bird/butterfly visible range (300–700 nm) from forewings given as mean values from four individuals
      where: Table 1 footnote
  - field: pattern_element
    value: blue/black wing regions
    anchor:
      quote: Here we focus on the blue/black wing regions only.
      where: Fig 2 caption
  - field: scale_type
    value: wing scale
    anchor:
      quote: The general structures seen on a Heliconius wing scale.
      where: Fig 1 caption
  - field: scale_type
    value: cover scales
    anchor:
      quote: In addition, Raman spectra of the blue Heliconius cover scales show a high amount of melanin present
      where: Results and discussion
  - field: functional_architecture
    value: multilayer reflectors
    anchor:
      quote: However, iridescent scales have ridges composed of layered lamellae, which act as multilayer reflectors.
      where: Abstract
  - field: functional_architecture
    value: non-iridescent
    anchor:
      quote: We also investigated the non-iridescent subspecies Heliconius erato demophoon Ménétriés, 1855 and Heliconius melpomene rosina (Boisduval, 1870)
      where: Introduction
  - field: imaging_modality
    value: small angle X-ray scattering
    anchor:
      quote: Transmission small angle X-ray scattering (SAXS) of the butterfly wings was measured at the ID02 beamline
      where: Material and methods
  - field: imaging_modality
    value: atomic force microscopy
    anchor:
      quote: A Digital Instruments Dimension 3100 scanning probe microscope (SPM) was used in atomic force microscopy (AFM) tapping mode
      where: Material and methods
  - field: imaging_modality
    value: Scanning electron microscopy
    anchor:
      quote: Scanning electron microscopy (SEM) samples were prepared by cutting small regions of the wings and adhering them to SEM stubs
      where: Material and methods
  - field: imaging_modality
    value: focused ion beam
    anchor:
      quote: mounting in a FEI Nova 600 Nanolab dual-beam focused ion beam (FIB) and SEM.
      where: Material and methods
  - field: imaging_modality
    value: Reflectance spectra
    anchor:
      quote: Reflectance spectra were captured using a spectrometer (Ocean Optics USB2000+, USA) connected through a bifurcated fibre-optic probe
      where: Material and methods
  - field: view_orientation
    value: Transmission
    anchor:
      quote: Transmission small angle X-ray scattering (SAXS) of the butterfly wings was measured at the ID02 beamline
      where: Material and methods
  - field: view_orientation
    value: surface
    anchor:
      quote: The data were subsequently flattened and analysed, to produce two-dimensional surface topography height images
      where: Material and methods
  - field: view_orientation
    value: cross sections
    anchor:
      quote: We made cross sections through the vertical ridge profile of H. erato demophoon and H. sara
      where: Material and methods
  - field: view_orientation
    value: normal incidence
    anchor:
      quote: Measurements were taken at normal incidence and at angles parallel to the orientation of the wing scales
      where: Material and methods
  - field: hydration_and_prep
    value: wings in their natural state
    anchor:
      quote: Figure 9a shows ridge profiles for each of the seven taxa extracted from SPM data from wings in their natural state.
      where: Results and discussion
  - field: hydration_and_prep
    value: coated with a few nanometres of gold
    anchor:
      quote: These were coated with a few nanometres of gold (AGAR) using vacuum evaporation
      where: Material and methods
  - field: hydration_and_prep
    value: sputter coated with a few nanometres of gold–palladium
    anchor:
      quote: The samples were sputter coated with a few nanometres of gold–palladium prior to mounting in a FEI Nova 600 Nanolab
      where: Material and methods
  - field: hydration_and_prep
    value: wings or pieces of wings to glass slides
    anchor:
      quote: Samples were prepared by sticking either whole wings or pieces of wings to glass slides using a cyanoacrylate-based adhesive.
      where: Material and methods


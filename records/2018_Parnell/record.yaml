evidence:
  T1_saxs_ridge_spacing:
    unit: U1_SAXS_RIDGE
    measure: ridge spacing
    method: ESRF ID02 transmission SAXS (0.1 nm X-ray, 20x20 um beam, 30.98 m SDD) across 8–17 positions per wing
    finding: Iridescent taxa exhibit markedly tighter SAXS ridge spacing (742–929 nm; tightest in H. sara 742 ± 28 nm and co-mimics H. e. cyrbia 812 ± 28 nm / H. m. cythera 823 ± 22 nm) than non-iridescent black sister taxa (1025–1063 nm)
    groups:
      - h_erato_cyrbia
      - h_erato_demophoon
      - h_sara_ecuador
      - h_eleuchia
      - h_cydno
      - h_melpomene_cythera
      - h_melpomene_rosina
    n:
      printed: 8–17 measurements across one wing of each species/subspecies
      counts: beam positions
      per_group:
        h_erato_cyrbia: '13'
        h_erato_demophoon: '9'
        h_sara_ecuador: '10'
        h_eleuchia: '11'
        h_cydno: '11'
        h_melpomene_cythera: '8'
        h_melpomene_rosina: '18'
      levels:
        individuals: 1
        positions: 8
      test_unit: positions
    values:
      cyrbia_saxs:
        printed: 812 ± 28
        unit: nm
        kind: mean
        group: h_erato_cyrbia
        spread: SD
      demophoon_saxs:
        printed: 1063 ± 39
        unit: nm
        kind: mean
        group: h_erato_demophoon
        spread: SD
      sara_saxs:
        printed: 742 ± 28
        unit: nm
        kind: mean
        group: h_sara_ecuador
        spread: SD
      eleuchia_saxs:
        printed: 889 ± 73
        unit: nm
        kind: mean
        group: h_eleuchia
        spread: SD
      cydno_saxs:
        printed: 929 ± 58
        unit: nm
        kind: mean
        group: h_cydno
        spread: SD
      cythera_saxs:
        printed: 823 ± 22
        unit: nm
        kind: mean
        group: h_melpomene_cythera
        spread: SD
      rosina_saxs:
        printed: 1025 ± 82
        unit: nm
        kind: mean
        group: h_melpomene_rosina
        spread: SD
    anchor:
      quote: Ridge spacing is calculated from SAXS data from 8–17 measurements across one wing of each species/subspecies.
      where: Fig 10 caption

  T1_iridescent_vs_noniridescent_erato:
    unit: U1_SAXS_RIDGE
    measure: ridge spacing
    method: SAXS ridge spacing comparison between iridescent H. erato cyrbia and non-iridescent sister race H. erato demophoon (Table 1)
    finding: Iridescent H. erato cyrbia has 23.6% narrower SAXS ridge spacing than non-iridescent H. erato demophoon (812 ± 28 vs 1063 ± 39 nm)
    compares:
      - h_erato_cyrbia
      - h_erato_demophoon
    test_of: pair
    n:
      printed: 13 positions (H. e. cyrbia) vs 9 positions (H. e. demophoon) on one wing each
      counts: beam positions
      per_group:
        h_erato_cyrbia: '13'
        h_erato_demophoon: '9'
      levels:
        individuals: 1
        positions: 9
      test_unit: positions
    values:
      cyrbia_d:
        printed: 812 ± 28
        unit: nm
        kind: mean
        group: h_erato_cyrbia
        spread: SD
      demophoon_d:
        printed: 1063 ± 39
        unit: nm
        kind: mean
        group: h_erato_demophoon
        spread: SD
    stated_direction:
      direction: down
      anchor:
        quote: Taxa with lower ridge spacing (higher ridge density) have higher peak reflectance.
        where: Fig 10 caption
    anchor:
      quote: Taxa with lower ridge spacing (higher ridge density) have higher peak reflectance.
      where: Fig 10 caption

  T1_iridescent_vs_noniridescent_melpomene:
    unit: U1_SAXS_RIDGE
    measure: ridge spacing
    method: SAXS ridge spacing comparison between iridescent H. melpomene cythera and non-iridescent sister race H. melpomene rosina (Table 1)
    finding: Iridescent H. melpomene cythera has 19.7% narrower SAXS ridge spacing than non-iridescent H. melpomene rosina (823 ± 22 vs 1025 ± 82 nm)
    compares:
      - h_melpomene_cythera
      - h_melpomene_rosina
    test_of: pair
    n:
      printed: 8 positions (H. m. cythera) vs 18 positions (H. m. rosina) on one wing each
      counts: beam positions
      per_group:
        h_melpomene_cythera: '8'
        h_melpomene_rosina: '18'
      levels:
        individuals: 1
        positions: 8
      test_unit: positions
    values:
      cythera_d:
        printed: 823 ± 22
        unit: nm
        kind: mean
        group: h_melpomene_cythera
        spread: SD
      rosina_d:
        printed: 1025 ± 82
        unit: nm
        kind: mean
        group: h_melpomene_rosina
        spread: SD
    stated_direction:
      direction: down
      anchor:
        quote: Taxa with lower ridge spacing (higher ridge density) have higher peak reflectance.
        where: Fig 10 caption
    anchor:
      quote: Co-mimetic pairs H. e. cyrbia/ H. m. cythera and H. eleuchia/H. cydno have similar ridge density.
      where: Fig 10 caption

  D2_ridge_density:
    unit: U1_SAXS_RIDGE
    measure: ridge density
    method: Reciprocal spatial frequency rho = 1/d derived from Table 1 SAXS ridge spacing
    finding: Linear ridge density is 43% higher in iridescent H. sara (1.35e6 m^-1) than in non-iridescent H. erato demophoon (0.941e6 m^-1)
    groups:
      - h_sara_ecuador
      - h_erato_demophoon
    values:
      sara_rho:
        printed: 1.348e6
        unit: m^-1
        kind: value
        group: h_sara_ecuador
        spread: none
      demophoon_rho:
        printed: 0.941e6
        unit: m^-1
        kind: value
        group: h_erato_demophoon
        spread: none
    anchor:
      quote: Taxa with lower ridge spacing (higher ridge density) have higher peak reflectance.
      where: Fig 10 caption
    scaling:
      independent_measure: ridge spacing
      direction: down
      anchor:
        quote: Taxa with lower ridge spacing (higher ridge density) have higher peak reflectance.
        where: Fig 10 caption

  T1_afm_ridge_spacing:
    unit: U2_AFM_SEM_SCALE
    measure: ridge spacing
    method: Integrated 2D Fourier transform of 10x10 um tapping-mode AFM surface scans (Dimension 3100, Table 1)
    context:
      imaging_modality: atomic force microscopy
      view_orientation: surface
      hydration_and_prep: wings in their natural state
    finding: Single-scale 100 um^2 AFM Fourier spacing confirms tightly packed ridges in H. sara (723 nm) and H. erato cyrbia (887 nm) versus >1140 nm in the remaining five taxa
    groups:
      - h_erato_cyrbia
      - h_erato_demophoon
      - h_sara_ecuador
      - h_eleuchia
      - h_cydno
      - h_melpomene_cythera
      - h_melpomene_rosina

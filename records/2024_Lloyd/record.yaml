    stats:
      test: likelihood ratio test
      statistic: χ2 = 40
      p: p < 0.001
      df: '1'
    stated_direction:
      direction: down
      anchor:
        quote: The developing iridescent scales had reduced actin spacing compared to the non-iridescent, black scales
        where: Results
    anchor:
      quote: The developing iridescent scales had reduced actin spacing compared to the non-iridescent, black scales (mean ± SE bundle spacing, iridescent 1.07 μm ± 0.02, non-iridescent 1.22 μm ± 0.03
      where: Results
  F2_actin_width:

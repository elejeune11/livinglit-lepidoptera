evidence:
  F2_ridge_spacing:
    unit: F2_ADULT
    measure: ridge spacing
    method: SEM image measurement with linear mixed effects model (lme4)
    software: R 3.5.2 (lme4)
    finding: Iridescent blue scales have significantly smaller ridge spacing (0.804 ± 0.007 um) than non-iridescent black scales (0.962 ± 0.004 um)
    compares:
      - blue_all
      - black_all
    test_of: pair
    values:
      blue:
        printed: 0.804 ± 0.007
        unit: µm
        kind: mean
        group: blue_all
        spread: SEM
        spread_source: sentence
      black:
        printed: 0.962 ± 0.004
        unit: µm
        kind: mean
        group: black_all
        spread: SEM
        spread_source: sentence
    stats:
      test: likelihood ratio test
      statistic: χ2 = 446
      p: p < 0.001
      df: '2'
    stated_direction:
      direction: down
      anchor:
        quote: The iridescent blue scales had significantly reduced ridge spacing compared to the non-iridescent black scales
        where: Results
    anchor:
      quote: The iridescent blue scales had significantly reduced ridge spacing compared to the non-iridescent black scales (mean ± SE ridge spacing, blue 0.804 μm ± 0.007, black 0.962 μm ± 0.004
      where: Results
    n:
      printed: 400 scales from 20 individuals (10 males, 10 females)
      counts: individuals
      levels:
        individuals: 20
        scales: 400
      test_unit: individuals
  F2_ridge_spacing_scale_type:
    unit: F2_ADULT
    measure: ridge spacing
    method: SEM image measurement with lme4 + Tukey post-hoc comparison
    software: R 3.5.2 (lme4)
    finding: Scale type (cover vs ground) significantly affects ridge spacing (χ2 = 27, p < 0.001); iridescent cover scales have smaller ridge spacing than iridescent ground scales (p < 0.001), whereas non-iridescent cover and ground scales do not differ (p = 0.633)
    compares:
      - blue_cover
      - blue_ground
    test_of: pair
    stats:
      test: likelihood ratio test
      statistic: χ2 = 27
      df: '2'
      p: p < 0.001
    stated_direction:
      direction: down
      anchor:
        quote: Iridescent cover scales had significantly reduced ridge spacing compared to iridescent ground scales (Tukey comparison, p < 0.001)
        where: Results
    anchor:
      quote: There was also an effect of scale type (cover or ground) on ridge spacing (likelihood ratio, χ2 = 27, d.f. = 2, p < 0.001).
      where: Results
  F2_ridge_width:
    unit: F2_ADULT
    measure: ridge width
    method: SEM image measurement with linear mixed effects model (lme4)
    software: R 3.5.2 (lme4)
    finding: Ridge width is slightly greater in iridescent scales (0.315 ± 0.002 um) than non-iridescent scales (0.302 ± 0.001 um)
    compares:
      - blue_all
      - black_all
    test_of: pair
    values:
      blue:
        printed: 0.315 ± 0.002
        unit: µm
        kind: mean
        group: blue_all
        spread: SEM
        spread_source: sentence
      black:
        printed: 0.302 ± 0.001
        unit: µm
        kind: mean
        group: black_all
        spread: SEM
        spread_source: sentence
    stats:
      test: likelihood ratio test
      statistic: χ2 = 43
      df: '1'
      p: p < 0.001
    stated_direction:
      direction: up
      anchor:
        quote: Ridge width was slightly greater in iridescent scales compared to non-iridescent scales
        where: Results
    anchor:
      quote: Ridge width was slightly greater in iridescent scales compared to non-iridescent scales (mean ± SE ridge width, iridescent 0.315 μm ± 0.002, non-iridescent 0.302 μm ± 0.001
      where: Results
    n:
      printed: 400 scales from 20 individuals
      counts: individuals
      levels:
        individuals: 20
        scales: 400
      test_unit: individuals
  F2_ridge_width_scale_type:
    unit: F2_ADULT
    measure: ridge width
    method: SEM image measurement with linear mixed effects model (lme4)
    software: R 3.5.2 (lme4)
    finding: No difference in ridge width between cover and ground scales (χ2 = 0.24, df = 1, p = 0.622)
    compares:
      - blue_cover
      - blue_ground
    test_of: pair
    stats:
      test: likelihood ratio test
      statistic: χ2 = 0.24
      df: '1'
      p: p = 0.622
    stated_direction:
      direction: none
      anchor:
        quote: There was no difference in ridge width between cover and ground scales (likelihood ratio, χ2 = 0.24, d.f. = 1, p = 0.622, Fig. 2F).
        where: Results
    anchor:
      quote: There was no difference in ridge width between cover and ground scales (likelihood ratio, χ2 = 0.24, d.f. = 1, p = 0.622, Fig. 2F).
      where: Results
  F2_scale_width:
    unit: F2_ADULT
    measure: scale width
    method: SEM measurement across cover and ground scales
    software: R 3.5.2 (lme4)
    finding: Iridescent blue scales are narrower than non-iridescent black scales in both cover (29.5 vs 31.3 um) and ground (42.9 vs 47.8 um) scales
    groups:
      - blue_cover
      - blue_ground
      - black_cover
      - black_ground
    values:
      bc:
        printed: 29.5 ± 0.22
        unit: µm
        kind: mean
        group: blue_cover
        spread: SEM
        spread_source: sentence
      bg:
        printed: 42.9 ± 0.3
        unit: µm
        kind: mean
        group: blue_ground
        spread: SEM
        spread_source: sentence
      kc:
        printed: 31.3 ± 0.22
        unit: µm
        kind: mean
        group: black_cover
        spread: SEM
        spread_source: sentence
      kg:
        printed: 47.8 ± 0.33
        unit: µm
        kind: mean
        group: black_ground
        spread: SEM
        spread_source: sentence
    stats:
      test: likelihood ratio test
      statistic: χ2 = 24
      df: '1'
      p: p < 0.001
    anchor:
      quote: 'mean ± SE scale width, blue: cover 29.5 μm ± 0.22, ground 42.9 μm ± 0.3, black: cover 31.3 μm ± 0.22, ground 47.8 μm ± 0.33'
      where: Results
  F2_scale_area:
    unit: F2_ADULT
    measure: scale area
    method: SEM outline measurement across cover and ground scales
    software: R 3.5.2 (lme4)
    finding: Iridescent blue scales have smaller area than non-iridescent black scales in both cover (2700 vs 3044 um2) and ground (3708 vs 4123 um2) scales
    groups:
      - blue_cover
      - blue_ground
      - black_cover
      - black_ground
    values:
      bc:
        printed: 2700 ± 21
        unit: µm²
        kind: mean
        group: blue_cover
        spread: SEM
        spread_source: sentence
      bg:
        printed: 3708 ± 35
        unit: µm²
        kind: mean
        group: blue_ground
        spread: SEM
        spread_source: sentence
      kc:
        printed: 3044 ± 25
        unit: µm²
        kind: mean
        group: black_cover
        spread: SEM
        spread_source: sentence
      kg:
        printed: 4123 ± 30
        unit: µm²
        kind: mean
        group: black_ground
        spread: SEM
        spread_source: sentence
    stats:
      test: likelihood ratio test
      statistic: χ2 = 208
      df: '1'
      p: p < 0.001
    anchor:
      quote: 'Both cover and ground iridescent scales were smaller in size than non-iridescent scales (mean ± SE scale area, blue: cover 2700 μm2 ± 21, ground 3708 μm2 ± 35'
      where: Results
  F2_actin_spacing:
    unit: F2_ACTIN
    measure: actin bundle spacing
    method: phalloidin fluorescence confocal microscopy at 50% pupal development
    software: R 3.5.2 (lme4)
    finding: Developing iridescent scales have reduced actin bundle spacing (1.07 ± 0.02 um) compared to non-iridescent black scales (1.22 ± 0.03 um)

    measure: actin bundle width
    method: phalloidin fluorescence confocal microscopy at 50% pupal development
    software: R 3.5.2 (lme4)
    finding: Iridescent scales have slightly thinner actin bundles (0.438 ± 0.004 um) than non-iridescent scales (0.456 ± 0.003 um)

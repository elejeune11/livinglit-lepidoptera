  F1E_sem_ridge:
    unit: F1E_SEM
    measure: ridge spacing
    method: LivingLit 2D FFT and multi-transect profiling on Fig 1E SEM
    finding: Image-derived SEM ridge spacing on Fig 1E is 0.823 um (transect) / 0.833 um (2D FFT), within 2.5% of the author-reported 0.804 um mean
    groups:
      - blue_cover_sem
    anchor:
      quote: Dorsal view of an iridescent wing scale surface, with many periodically ordered longitudinal ridges running parallel to scale length.
      where: Fig. 1E caption
  F8_reflectance_brightness:
    unit: F8_SPEC
    measure: peak reflectance
    method: Reflectance spectroscopy (350–700 nm) on right forewing of Cyto D vs vehicle control adults
    software: R 3.5.2 (pavo)
    finding: Cytochalasin D injection at 50% pupal development significantly reduces dorsal wing brightness (t = 4.34, df = 33, p < 0.001; digitized mean peak drops from 11.0% at 524 nm to 7.3% at 569 nm)
    compares:
      - cyto_d_spec
      - dmso_ctrl_spec
    test_of: pair
    stats:
      test: two-sample t-test
      statistic: t = 4.34
      df: '33'

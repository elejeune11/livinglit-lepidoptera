        printed: '0.00274'
        unit: dimensionless
        kind: value
        group: ce_upper_L1
        spread: none
      ce_lower_gc:
        printed: '0.0152'
        unit: dimensionless
        kind: value
        group: ce_lower_L2
        spread: none
    anchor:
      quote: Thus, smaller interstitial regions require substantially larger area growth to produce a membrane buckle that forms a protoridge.
      where: Results


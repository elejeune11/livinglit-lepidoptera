evidence:
  F1_onset_timing:
    unit: F1_IN_VIVO_PHASE
    measure: relative pupal development
    method: Continuous live surgical-window speckle-correlation reflection phase microscopy of exposed V. cardui hindwing (lateral resolution ~500 nm, height sensitivity ~10 nm)
    finding: Nascent protoridges emerge on the top (abwing) surface of V. cardui hindwing cover scales across 35%–45% pupal development (~3.5–4.5 days), transitioning from smooth (35.8%) to emerging (40.0%) to regular protoridges (41.0%)
    groups:
      - stage_35_8
      - stage_40_0
      - stage_41_0
    n:
      printed: a single individual (single V. cardui pupa)
      counts: pupae
      levels:
        pupae: 1
    values:
      t_smooth:
        printed: '35.8'
        unit: '%'
        kind: value
        group: stage_35_8
        spread: none
      t_emerging:
        printed: '40.0'
        unit: '%'
        kind: value
        group: stage_40_0
        spread: none
      t_regular:
        printed: '41.0'
        unit: '%'
        kind: value
        group: stage_41_0
        spread: none
    anchor:
      quote: show the transition from a relatively smooth surface to regular protoridges at 35.8% (B), 40.0% (C), and 41.0% (D) of pupal development.
      where: Fig 1 caption

  F1_protoridge_height_onset:
    unit: F1_IN_VIVO_PHASE
    measure: ridge buckling amplitude
    method: 2D scikit-image and 1D MATLAB phase unwrapping of in vivo reflection phase microscopy height maps (height sensitivity ~10 nm)
    finding: During 35%–45% of pupal development, the initially flat scale plasma membrane wrinkles into parallel protoridge undulations reaching ~100 nm in height over ~10 h
    groups:
      - onset_window
    n:
      printed: a single individual
      counts: pupae
      levels:
        pupae: 1
    values:
      undulation_height:
        printed: '~100'
        unit: nm
        kind: value
        group: onset_window
        spread: none
    stated_direction:
      direction: up
      anchor:
        quote: Profiles taken from centerlines in (B)–(D) show the increasing height of the nascent protoridges with increasing pupal development time.
        where: Fig 1 caption
    anchor:
      quote: the flat cell membrane wrinkles to develop into parallel undulations of around 100 nm in height over a time span of about 10 h
      where: Results

  F1_adult_sem_ridges:
    unit: F1_ADULT_SEM
    measure: ridge spacing
    method: LivingLit calibrated 2D-FFT and 10-transect spacing analysis on Fig 1Aiii (20 µm bar) and Fig 1Aiv (2 µm bar) Zeiss Gemini Ultra 55 SEM micrographs
    finding: Calibrated 2D-FFT on adult-form V. cardui scale SEMs recovers longitudinal apical ridge spacing of 1.90 µm across the whole scale blade (Fig 1Aiii, SNR 19,284) and ~2.0 µm in the high-magnification inset (Fig 1Aiv)
    groups:
      - adult_scale_sem
    anchor:
      quote: The scales feature prominent ridges that run along the length of the scale on the upper surface (iv).
      where: Fig 1 caption

  F1_adult_sem_crossribs:
    unit: F1_ADULT_SEM
    measure: crossrib spacing
    method: LivingLit calibrated orthogonal 2D-FFT on Fig 1Aiv high-magnification SEM micrograph (2 µm bar)
    finding: Calibrated orthogonal 2D-FFT on Fig 1Aiv independently resolves transverse crossrib spacing of ~0.55 µm (SNR ~42) between parallel longitudinal ridges
    groups:
      - adult_scale_sem
    anchor:
      quote: The scales feature prominent ridges that run along the length of the scale on the upper surface (iv).
      where: Fig 1 caption

  F3_buckling_amplitude_timeseries:
    unit: F3_BUCKLING_TIMESERIES
    measure: ridge buckling amplitude
    method: Automated protoridge segmentation and width-normalized height profiling (rescaled to L = 1.6 µm) across 3–5 scales of one V. cardui pupa (Fig 3A–F; exact mean ± SD peaks from Zenodo meanProfileDataExperiment.mat)
    finding: Across 3,722 filtered in vivo protoridge profiles (after excluding 191 phase-jump and 161 low-edge profiles), width-normalized mean profile peak height increases monotonically from 23.2 ± 20.1 nm (39.6%, n=607) to 32.4 ± 21.3 nm (40.0%, n=639), 40.3 ± 29.5 nm (40.3%, n=744), 41.4 ± 30.1 nm (40.7%, n=821), and 62.4 ± 32.1 nm (41.0%, n=911)
    groups:
      - t_39_6
      - t_40_0
      - t_40_3
      - t_40_7
      - t_41_0
    n:
      printed: n = 607, 639, 744, 821, and 911 profiles (3,722 total across 3–5 scales of 1 pupa)
      per_group:
        t_39_6: '607'
        t_40_0: '639'
        t_40_3: '744'
        t_40_7: '821'
        t_41_0: '911'
      counts: height profiles
      levels:
        pupae: 1
        scales: 5
        profiles: 3722
    values:
      amp_39_6:
        printed: 23.2 ± 20.1
        unit: nm
        kind: mean
        group: t_39_6
        spread: SD
      amp_40_0:
        printed: 32.4 ± 21.3
        unit: nm
        kind: mean
        group: t_40_0
        spread: SD
      amp_40_3:
        printed: 40.3 ± 29.5
        unit: nm
        kind: mean
        group: t_40_3
        spread: SD
      amp_40_7:
        printed: 41.4 ± 30.1
        unit: nm
        kind: mean
        group: t_40_7
        spread: SD
      amp_41_0:
        printed: 62.4 ± 32.1
        unit: nm
        kind: mean
        group: t_41_0
        spread: SD
    anchor:
      quote: To facilitate comparison across 3,722 height profiles, we examine the scaled maximum amplitude, w 0 , of each profile measurement and find a gradual increase in protoridge height in vivo
      where: Results
    note: Mean ± SD peak amplitudes of the rescaled mean height profiles plotted in Fig 3A–E (exact values from Zenodo associated/plate_mechanics_code.zip meanProfileDataExperiment.mat multiplied by L = 1.6 µm); Fig 3F plots per-profile maximum w_0 distributions (slightly higher means due to per-profile peak alignment).

  F3_amplitude_progression:
    unit: F3_BUCKLING_TIMESERIES
    measure: ridge buckling amplitude
    method: Pairwise comparison of width-normalized in vivo mean protoridge buckling peak height between 41.0% and 39.6% pupal development (Fig 3A vs 3E, meanProfileDataExperiment.mat)
    finding: Protoridge buckling mean profile peak amplitude increases 2.69-fold from 39.6% (23.2 ± 20.1 nm, n = 607) to 41.0% (62.4 ± 32.1 nm, n = 911) pupal development
    compares:
      - t_41_0
      - t_39_6
    test_of: pair
    n:
      printed: n = 911 (41.0%) vs n = 607 (39.6%) profiles
      per_group:
        t_41_0: '911'
        t_39_6: '607'
      counts: height profiles
      levels:
        pupae: 1
        profiles: 1518
    values:
      amp_late:
        printed: 62.4 ± 32.1
        unit: nm
        kind: mean
        group: t_41_0
        spread: SD
      amp_early:
        printed: 23.2 ± 20.1
        unit: nm
        kind: mean
        group: t_39_6
        spread: SD
    stated_direction:
      direction: up
      anchor:
        quote: To facilitate comparison across 3,722 height profiles, we examine the scaled maximum amplitude, w 0 , of each profile measurement and find a gradual increase in protoridge height in vivo
        where: Results
    anchor:
      quote: To facilitate comparison across 3,722 height profiles, we examine the scaled maximum amplitude, w 0 , of each profile measurement and find a gradual increase in protoridge height in vivo
      where: Results

  F3_protoridge_width:
    unit: F3_BUCKLING_TIMESERIES
    measure: ridge spacing
    method: Unscaled trough-to-trough protoridge width L measured across 3,722 live profiles (Fig 3G) and reference normalization spacing L = 1.6 µm used for FvK modeling (Fig 3H)
    finding: Mean protoridge width L remains approximately constant around the reference spacing of 1.6 µm (medians ~1.36–1.55 µm across 39.6%–41.0% development) without systematic temporal drift
    groups:
      - t_39_6
      - t_40_0
      - t_40_3
      - t_40_7
      - t_41_0
    n:
      printed: n = 607, 639, 744, 821, and 911 profiles (3,722 total)
      per_group:
        t_39_6: '607'
        t_40_0: '639'
        t_40_3: '744'
        t_40_7: '821'
        t_41_0: '911'
      counts: height profiles
      levels:
        pupae: 1
        scales: 5
        profiles: 3722
    values:
      ref_width:
        printed: '1.6'
        unit: µm
        kind: value
        group: t_41_0
        spread: none
    stated_direction:
      direction: none
      anchor:
        quote: During the observed developmental time span, the mean protoridge widths appear to remain fairly constant and do not vary systematically as the butterfly develops
        where: Results
    anchor:
      quote: To compare these in vivo profiles to each other, we normalize their width to a reference length L = 1.6 μm
      where: Results

  D1_vc_protoridge_density:
    unit: F3_BUCKLING_TIMESERIES
    measure: ridge density
    method: Reciprocal spatial frequency rho = 1/d derived from reference V. cardui protoridge spacing L = 1.6 µm
    finding: Reference V. cardui protoridge spacing L = 1.6 µm corresponds to a linear ridge density of 0.625 ridges/µm (6.25 × 10^5 m^-1)
    groups:
      - t_41_0
    values:
      vc_rho:
        printed: '6.25e5'
        unit: m^-1
        kind: value
        group: t_41_0
        spread: none
    anchor:
      quote: To compare these in vivo profiles to each other, we normalize their width to a reference length L = 1.6 μm
      where: Results
    scaling:
      independent_measure: ridge spacing
      direction: down
      anchor:
        quote: To compare these in vivo profiles to each other, we normalize their width to a reference length L = 1.6 μm
        where: Results

  F3_fvk_critical_strain:
    unit: F3_BUCKLING_TIMESERIES
    measure: critical buckling strain
    method: Weakly nonlinear Föppl–von Kármán clamped plate theory (Equation 4, g_c = pi^2 (h/L)^2 / (3 (1 - nu^2))) with h = 20 nm, L = 1.6 µm, nu = 0.5, p = 10 Pa
    finding: Clamped FvK plate theory yields critical compressive buckling strain g_c = 0.000685 (0.0685%) for V. cardui (L = 1.6 µm, h = 20 nm, nu = 0.5), scaling inversely as L^-2 and bounding non-decreasing cuticle Young's modulus at Y_min = 3.5 × 10^6 Pa
    groups:
      - t_41_0
    values:
      vc_gc:
        printed: '0.000685'
        unit: dimensionless
        kind: value
        group: t_41_0
        spread: none
    anchor:
      quote: biologically realistic values of Young’s modulus Y for soft cuticle (10 4 − 10 8 Pa), 43 pressure p = 10 Pa, width L = 1.6 μm
      where: Results
    scaling:
      independent_measure: actin bundle spacing
      direction: down
      anchor:
        quote: reveals that the buckling transition occurs at a critical growth strain, g c ∝ L − 2 ( Equation 4 ).
        where: Results
    note: Assuming non-decreasing scale stiffness across 39.6%–41.0% development, the Fig 3H isocontour phase space establishes a lower bound Y_min = 3.5 × 10^6 Pa on soft cuticle Young's modulus.

  F4_actin_bundle_spacing:
    unit: F4_INTERSPECIES_SPACING
    measure: actin bundle spacing
    method: Inner-edge interstitial actin bundle spacing measured from Fig 4A TEM (Colias eurytheme, Ghiradella 1974), Fig 4B confocal (Agraulis vanillae, Dinwiddie et al. 2014, mean of 4 measurements), and V. cardui phase microscopy (Fig 3, 4C; exact values from Zenodo butterfly_scale_mechanics.nb)
    finding: Ridge-forming interstitial actin bundle gaps (V. cardui L = 1.6 µm; C. eurytheme upper L1 = 0.80 µm; A. vanillae wide L1 = 0.91 µm) are more than double the narrow ridge-suppressed gaps (C. eurytheme lower lamina L2 = 0.34 µm; A. vanillae narrow L2 = 0.36 µm)
    groups:
      - vc_upper
      - ce_upper_L1
      - ce_lower_L2
      - av_wide_L1
      - av_narrow_L2
    values:
      vc_L:
        printed: '1.6'
        unit: µm
        kind: value
        group: vc_upper
        spread: none
      ce_L1:
        printed: '0.80'
        unit: µm
        kind: value
        group: ce_upper_L1
        spread: none
      ce_L2:
        printed: '0.34'
        unit: µm
        kind: value
        group: ce_lower_L2
        spread: none
      av_L1:
        printed: '0.91'
        unit: µm
        kind: value
        group: av_wide_L1
        spread: none
      av_L2:
        printed: '0.36'
        unit: µm
        kind: value
        group: av_narrow_L2
        spread: none
    anchor:
      quote: Regardless of the strategy used, a larger spacing ( L 1 ) leads to ridges, while a smaller spacing ( L 2 ) does not yield appreciable ridges.
      where: Results
    note: Exact dashed-line coordinates plotted in Fig 4C and coded in Zenodo associated/plate_mechanics_code.zip (butterfly_scale_mechanics.nb); note that calibrated 2D-FFT on Fig 4B directly recovers the alternating blue protoridge repeat period of 2.21 µm (SNR 106).

  F4_colias_critical_strain:
    unit: F4_INTERSPECIES_SPACING
    measure: critical buckling strain
    method: Föppl–von Kármán Equation 4 evaluated at Colias eurytheme upper (L1 = 0.80 µm) versus lower (L2 = 0.34 µm) actin bundle interstitial spacings (h = 20 nm, nu = 0.5)
    finding: Reducing interstitial actin bundle spacing from upper-surface L1 = 0.80 µm (g_c = 0.00274) to lower-lamina L2 = 0.34 µm (g_c = 0.0152) raises critical buckling strain 5.5-fold, suppressing protoridge buckling on the flat lower lamina
    groups:
      - ce_upper_L1
      - ce_lower_L2
    values:

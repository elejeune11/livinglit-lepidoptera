<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">

  <defs>
    <style>
      .sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; letter-spacing: -0.02em; }
      .sub { font-size: 12.5px; fill: #475569; }
      .sec-h { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
      .box-h { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .box-t { font-size: 11px; fill: #334155; }
      .code { font-size: 10.5px; fill: #0f5c6e; font-weight: 600; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.03em; }
      .tiny { font-size: 9.8px; fill: #475569; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0f5c6e"/>
    </marker>
    <marker id="arr-grn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#166534"/>
    </marker>
    <marker id="arr-amb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#9a5800"/>
    </marker>
    <marker id="arr-ind" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#5b3a8c"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#b91c1c"/>
    </marker>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#fbfbfa" rx="10"/>

  <!-- Header -->
  <text x="32" y="40" class="sans title">Figure 2 · Atomic Segmentation, Per-Figure Digitization &amp; Unified Visual-Overlay Contract</text>
  <text x="32" y="61" class="sans sub">Every quantitative plot and calibrated micrograph carries stored geometric proof (overlay_meta) verified both offline by the agent and live in the browser</text>

  <!-- Stage 1: Atomic Segmentation -->
  <g transform="translate(32, 86)" filter="url(#sh)">
    <rect width="262" height="492" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.6"/>
    <rect width="262" height="34" rx="9" fill="#e8f5ee"/>
    <rect y="20" width="262" height="14" fill="#e8f5ee"/>
    <text x="14" y="22" class="sans sec-h" fill="#166534">Step 1 · Atomic 1-Letter Split</text>

    <!-- Mockup of Full-Figure BBox Contact Sheet -->
    <rect x="16" y="48" width="230" height="174" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="26" y="65" class="mono tiny" fill="#0f172a">Full-Figure BBox Contact Sheet</text>
    <!-- 4 clean atomic boxes -->
    <rect x="26" y="74" width="100" height="64" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="26" y="74" width="22" height="15" fill="#0284c7"/>
    <text x="37" y="85" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#fff">A</text>
    <path d="M 38 124 Q 64 90 116 116" stroke="#0f5c6e" stroke-width="1.6" fill="none"/>

    <rect x="134" y="74" width="102" height="64" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="134" y="74" width="22" height="15" fill="#16a34a"/>
    <text x="145" y="85" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#fff">B</text>
    <circle cx="162" cy="112" r="2.5" fill="#16a34a"/><circle cx="176" cy="106" r="2.5" fill="#16a34a"/>
    <circle cx="192" cy="99" r="2.5" fill="#16a34a"/><circle cx="212" cy="92" r="2.5" fill="#16a34a"/>

    <rect x="26" y="146" width="100" height="64" rx="3" fill="#1e293b" stroke="#ea580c" stroke-width="1.8"/>
    <rect x="26" y="146" width="22" height="15" fill="#ea580c"/>
    <text x="37" y="157" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#fff">C</text>
    <line x1="40" y1="168" x2="112" y2="168" stroke="#94a3b8" stroke-width="2"/>
    <line x1="40" y1="180" x2="112" y2="180" stroke="#94a3b8" stroke-width="2"/>
    <line x1="40" y1="192" x2="112" y2="192" stroke="#94a3b8" stroke-width="2"/>

    <rect x="134" y="146" width="102" height="64" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <rect x="134" y="146" width="22" height="15" fill="#7c3aed"/>
    <text x="145" y="157" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#fff">D</text>
    <rect x="158" y="170" width="12" height="22" fill="#c4b5fd" stroke="#7c3aed"/>
    <rect x="194" y="164" width="12" height="28" fill="#c4b5fd" stroke="#7c3aed"/>

    <text x="16" y="245" class="sans box-h">Hard Segmentation Rules</text>
    <text x="16" y="264" class="sans box-t">• Strictly 1 labeled panel = 1 entry</text>
    <text x="16" y="280" class="sans box-t">  (A, B, C', C'', 11a_achrom…)</text>
    <text x="16" y="298" class="sans box-t">• Gate rejects coarse "top/bottom"</text>
    <text x="16" y="314" class="sans box-t">  or "A–C" composite crops</text>
    <text x="16" y="332" class="sans box-t">• Neighbor axis ticks &amp; sibling</text>
    <text x="16" y="348" class="sans box-t">  panel labels excluded cleanly</text>
    <text x="16" y="366" class="sans box-t">• Each panel tagged (10 archetypes):</text>
    <text x="24" y="382" class="mono tiny">quantitative_plot · spectral</text>
    <text x="24" y="396" class="mono tiny">planar_microscopy · cross_section</text>
    <text x="24" y="410" class="mono tiny">crispant_plate · expression_img</text>
    <text x="24" y="424" class="mono tiny">expr_matrix · genomic_track · macro</text>

    <rect x="16" y="442" width="230" height="36" rx="5" fill="#fce8e8" stroke="#fca5a5"/>
    <text x="26" y="458" class="mono tiny" fill="#9f2222">BBox Visual Self-Check Gate:</text>
    <text x="26" y="471" class="sans tiny" fill="#7f1d1d">Zero clipped axes or merged subpanels</text>
  </g>

  <!-- Branch 2A: Quantitative Plots -->
  <g transform="translate(332, 86)" filter="url(#sh)">
    <rect width="836" height="236" rx="9" fill="#ffffff" stroke="#0f5c6e" stroke-width="1.6"/>
    <rect width="836" height="34" rx="9" fill="#e6f3f6"/>
    <rect y="20" width="836" height="14" fill="#e6f3f6"/>
    <text x="14" y="22" class="sans sec-h" fill="#0f5c6e">Step 2A · Quantitative Plots, Spectra, Errorbars, Volcano &amp; Genomics Dotplots</text>

    <!-- Data Priority + Extractor -->
    <rect x="16" y="46" width="248" height="174" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="26" y="65" class="sans box-h">1. Data Priority Hierarchy</text>
    <text x="26" y="83" class="sans box-t" font-weight="600" fill="#166534">Tier 1: Author CSV / genomic_tables</text>
    <text x="26" y="99" class="sans box-t" font-weight="600" fill="#0f5c6e">Tier 2: Printed Tables &amp; Text</text>
    <text x="26" y="115" class="sans box-t" font-weight="600" fill="#5b3a8c">Tier 3: Per-Figure Python Script</text>
    <line x1="26" y1="126" x2="254" y2="126" stroke="#e2e8f0"/>
    <text x="26" y="143" class="mono code">extractors/fN.py + extract_lib.py</text>
    <text x="26" y="160" class="sans tiny">• Auto-tick calibration (misfit px)</text>
    <text x="26" y="174" class="sans tiny">• White-ray DP &amp; shaded-bg peeling</text>
    <text x="26" y="188" class="sans tiny">• ±SD/CI ribbon walker &amp; IRLS fits</text>
    <text x="26" y="202" class="sans tiny">• Errorbar, boxplot, volcano &amp; dotplot</text>

    <!-- Plot Overlay Mockup -->
    <rect x="282" y="46" width="276" height="174" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.4"/>
    <text x="292" y="63" class="mono tiny" fill="#0f5c6e">Live &amp; Offline Plot Pixel-Overlay Proof</text>
    <!-- Mini calibrated plot box -->
    <rect x="308" y="72" width="234" height="124" fill="#f8fafc" stroke="#06b6d4" stroke-width="1.4"/>
    <!-- Shaded ribbon (source) -->
    <path d="M 314 150 Q 380 76 430 130 T 536 168 L 536 184 Q 430 156 380 106 Q 345 142 314 166 Z" fill="#93c5fd" opacity="0.45"/>
    <!-- Extracted ribbon bounds (thin bright green) -->
    <path d="M 314 150 Q 380 76 430 130 T 536 168" stroke="#16a34a" stroke-width="1.1" stroke-dasharray="3,2" fill="none"/>
    <path d="M 314 166 Q 380 106 430 156 T 536 184" stroke="#16a34a" stroke-width="1.1" stroke-dasharray="3,2" fill="none"/>
    <!-- Extracted core mean curve (halo + green) -->
    <path d="M 314 158 Q 380 91 430 143 T 536 176" stroke="#0f172a" stroke-width="3.4" fill="none"/>
    <path d="M 314 158 Q 380 91 430 143 T 536 176" stroke="#00e640" stroke-width="1.8" fill="none"/>
    <!-- Second crossing curve (magenta) -->
    <path d="M 314 134 Q 375 162 440 120 T 536 160" stroke="#0f172a" stroke-width="3.2" fill="none"/>
    <path d="M 314 134 Q 375 162 440 120 T 536 160" stroke="#ff2aa6" stroke-width="1.6" fill="none"/>
    <!-- Errorbar scatter point example -->
    <line x1="484" y1="86" x2="484" y2="112" stroke="#f59e0b" stroke-width="1.6"/>
    <line x1="472" y1="99" x2="496" y2="99" stroke="#f59e0b" stroke-width="1.6"/>
    <circle cx="484" cy="99" r="3.6" fill="#f59e0b" stroke="#0f172a" stroke-width="1.1"/>
    <text x="425" y="211" text-anchor="middle" class="sans tiny">Cyan box · ±SD bounds · DP curves · x/y errorbars</text>

    <!-- Plot Automated Guards -->
    <rect x="576" y="46" width="244" height="174" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
    <text x="586" y="65" class="sans box-h" fill="#9f2222">Automated Plot Gate Guards</text>
    <text x="586" y="85" class="sans box-t">• Span completeness: curve must</text>
    <text x="586" y="100" class="sans box-t">  cover ≥85% of calibrated x-axis</text>
    <text x="586" y="118" class="sans box-t">• Legend parity: every declared</text>
    <text x="586" y="133" class="sans box-t">  series present &amp; non-degenerate</text>
    <text x="586" y="151" class="sans box-t">• Cross-origin RMSE: auto-scored</text>
    <text x="586" y="166" class="sans box-t">  against Tier-1 raw CSV/XLSX</text>
    <text x="586" y="184" class="sans box-t">• Visual overlay inspection loop:</text>
    <text x="586" y="199" class="sans box-t">  retry script until curves lock on</text>
  </g>

  <!-- Branch 2B: Calibrated Microscopy & FFT -->
  <g transform="translate(332, 342)" filter="url(#sh)">
    <rect width="836" height="236" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.6"/>
    <rect width="836" height="34" rx="9" fill="#e8f5ee"/>
    <rect y="20" width="836" height="14" fill="#e8f5ee"/>
    <text x="14" y="22" class="sans sec-h" fill="#166534">Step 2B · Calibrated SEM/Fluorescent Microscopy, 2D-FFT &amp; Grating Proof</text>

    <!-- Metrology Steps -->
    <rect x="16" y="46" width="248" height="174" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="26" y="65" class="sans box-h">Microscopy Metrology Pipeline</text>
    <text x="26" y="85" class="sans box-t">1. Measure scale bar in pixels →</text>
    <text x="36" y="100" class="mono tiny">um_per_px, fov_um, bar_box</text>
    <text x="26" y="120" class="sans box-t">2. Channel-isolated clean ROI</text>
    <text x="36" y="135" class="sans box-t">(green/magenta/STED/SEM)</text>
    <text x="26" y="155" class="sans box-t">3. 2D-FFT peak + phase alignment</text>
    <text x="36" y="170" class="mono tiny">period_px, wavevector_deg, φ</text>
    <text x="26" y="190" class="sans box-t">4. 10 orthogonal transects +</text>
    <text x="36" y="205" class="sans box-t">optional cross-rib 2D-FFT</text>

    <!-- Microscopy Grating Mockup -->
    <rect x="282" y="46" width="276" height="174" rx="6" fill="#111827" stroke="#22c55e" stroke-width="1.4"/>
    <text x="292" y="63" class="mono" style="font-size:10px;fill:#e2e8f0;font-weight:600">Phase-Aligned Ridge Grating Overlay</text>
    <!-- Simulated SEM parallel bright ridges -->
    <g opacity="0.65">
      <line x1="296" y1="82" x2="544" y2="82" stroke="#cbd5e1" stroke-width="5"/>
      <line x1="296" y1="104" x2="544" y2="104" stroke="#cbd5e1" stroke-width="5"/>
      <line x1="296" y1="126" x2="544" y2="126" stroke="#cbd5e1" stroke-width="5"/>
      <line x1="296" y1="148" x2="544" y2="148" stroke="#cbd5e1" stroke-width="5"/>
      <line x1="296" y1="170" x2="544" y2="170" stroke="#cbd5e1" stroke-width="5"/>
    </g>
    <!-- Cyan FFT ROI box -->
    <rect x="314" y="72" width="160" height="110" fill="none" stroke="#22d3ee" stroke-width="1.8"/>
    <!-- Phase-aligned green grating lines hitting EVERY ridge crest -->
    <line x1="316" y1="82" x2="472" y2="82" stroke="#00ff55" stroke-width="1.8"/>
    <line x1="316" y1="104" x2="472" y2="104" stroke="#00ff55" stroke-width="1.8"/>
    <line x1="316" y1="126" x2="472" y2="126" stroke="#00ff55" stroke-width="1.8"/>
    <line x1="316" y1="148" x2="472" y2="148" stroke="#00ff55" stroke-width="1.8"/>
    <line x1="316" y1="170" x2="472" y2="170" stroke="#00ff55" stroke-width="1.8"/>
    <!-- One vertical transect line with peak dots -->
    <line x1="394" y1="76" x2="394" y2="176" stroke="#facc15" stroke-width="1.1" stroke-dasharray="2,2"/>
    <circle cx="394" cy="82" r="2.6" fill="#facc15"/><circle cx="394" cy="104" r="2.6" fill="#facc15"/>
    <circle cx="394" cy="126" r="2.6" fill="#facc15"/><circle cx="394" cy="148" r="2.6" fill="#facc15"/>
    <circle cx="394" cy="170" r="2.6" fill="#facc15"/>
    <!-- Yellow scale bar bracket -->
    <line x1="488" y1="194" x2="544" y2="194" stroke="#facc15" stroke-width="3"/>
    <text x="516" y="188" text-anchor="middle" class="mono" style="font-size:9.5px;fill:#facc15;font-weight:700">2.0 µm</text>
    <text x="410" y="211" text-anchor="middle" class="sans" style="font-size:9.8px;fill:#cbd5e1">Cyan ROI · Green 1× crests · Yellow scale bar</text>

    <!-- Harmonic Guard Box -->
    <rect x="576" y="46" width="244" height="174" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
    <text x="586" y="65" class="sans box-h" fill="#9f2222">Automated FFT Harmonic Guard</text>
    <text x="586" y="85" class="sans box-t">• Checks 2× &amp; 0.5× spectral power</text>
    <text x="586" y="100" class="sans box-t">  along wavevector_deg</text>
    <text x="586" y="118" class="sans box-t">• Flags |FFT − Transect| / FFT &gt; 12%</text>
    <!-- Visual callout of caught 2x harmonic error -->
    <rect x="586" y="130" width="224" height="78" rx="5" fill="#ffffff" stroke="#fca5a5"/>
    <text x="596" y="146" class="mono tiny" fill="#b91c1c">Catches 2× Subharmonic Errors:</text>
    <text x="596" y="162" class="sans tiny">e.g., Lloyd F8/I locked onto every</text>
    <text x="596" y="176" class="sans tiny">other ridge (1.73 µm vs ~0.86 µm)</text>
    <text x="596" y="191" class="sans tiny" fill="#166534" font-weight="600">→ Instant visual catch on grating!</text>
  </g>

  <!-- Unified Bottom Contract -->
  <g transform="translate(32, 598)" filter="url(#sh)">
    <rect width="1136" height="96" rx="9" fill="#f2ecfa" stroke="#5b3a8c" stroke-width="1.5"/>
    <text x="18" y="26" class="sans sec-h" fill="#5b3a8c">Step 3 · Unified overlay_meta Contract (Stored in digitized/panels_extracted.json)</text>
    <text x="18" y="48" class="mono box-t" fill="#1e1b4b">Plots:      { "kind": "curves|scatter|boxplots|dotplot", "plot_box": [x0,y0,x1,y1], "x_range": [a,b], "y_range": [c,d], "groups": [...] }</text>
    <text x="18" y="66" class="mono box-t" fill="#1e1b4b">Microscopy: { "kind": "microscopy_fft", "scale_bar_px": [x0,y0,x1,y1,um], "roi_px": [x0,y0,x1,y1], "grating": {period_px, deg, phase_px}, "transects": [...] }</text>
    <text x="18" y="84" class="sans tiny">One identical geometric contract renders offline QA contact sheets (for autonomous agent inspection) AND the live interactive "Overlay check" toggle in the web visualizer.</text>
  </g>

  <!-- Arrows -->
  <path d="M 294 205 L 328 205" stroke="#0f5c6e" stroke-width="2" fill="none" marker-end="url(#arr-teal)"/>
  <path d="M 294 455 L 328 455" stroke="#166534" stroke-width="2" fill="none" marker-end="url(#arr-grn)"/>
  <path d="M 596 578 L 596 594" stroke="#5b3a8c" stroke-width="2" fill="none" marker-end="url(#arr-ind)"/>
  <path d="M 163 578 L 163 594" stroke="#5b3a8c" stroke-width="2" fill="none" marker-end="url(#arr-ind)"/>
</svg>
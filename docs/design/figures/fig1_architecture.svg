<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710">

  <defs>
    <style>
      .sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; letter-spacing: -0.02em; }
      .sub { font-size: 12.5px; fill: #475569; }
      .sec-h { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
      .box-h { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .box-t { font-size: 11px; fill: #334155; }
      .code { font-size: 10.5px; fill: #0f5c6e; font-weight: 600; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.03em; }
      .tiny { font-size: 9.8px; fill: #475569; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0f5c6e"/>
    </marker>
    <marker id="arr-grn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#166534"/>
    </marker>
    <marker id="arr-amb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#9a5800"/>
    </marker>
    <marker id="arr-ind" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#5b3a8c"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#b91c1c"/>
    </marker>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="710" fill="#fbfbfa" rx="10"/>

  <!-- Header -->
  <text x="32" y="40" class="sans title">Figure 1 · livinglit-lepidoptera System Architecture &amp; Three Deliberate Shifts</text>
  <text x="32" y="61" class="sans sub">Dual-pillar standalone repository combining LivingLit's audited text/table/claim engine with atomic figure panel digitization &amp; visual overlay verification</text>

  <!-- Legend Pills -->
  <g transform="translate(32, 74)">
    <rect x="0" y="0" width="186" height="22" rx="11" fill="#e6f3f6" stroke="#0f5c6e" stroke-width="1"/>
    <text x="93" y="14.5" text-anchor="middle" class="sans badge" fill="#0f5c6e">FAITHFUL LIVINGLIT CORE</text>
    <rect x="198" y="0" width="234" height="22" rx="11" fill="#e8f5ee" stroke="#166534" stroke-width="1"/>
    <text x="315" y="14.5" text-anchor="middle" class="sans badge" fill="#166534">SHIFT 1 · FIGURES AS PRIMARY DATA</text>
    <rect x="444" y="0" width="260" height="22" rx="11" fill="#fef4e2" stroke="#9a5800" stroke-width="1"/>
    <text x="574" y="14.5" text-anchor="middle" class="sans badge" fill="#9a5800">SHIFT 2 · RELAXED USER COMPARISON</text>
    <rect x="716" y="0" width="276" height="22" rx="11" fill="#f2ecfa" stroke="#5b3a8c" stroke-width="1"/>
    <text x="854" y="14.5" text-anchor="middle" class="sans badge" fill="#5b3a8c">SHIFT 3 · VISUAL OVERLAYS &amp; SKILLS</text>
  </g>

  <!-- Column 1: OA Paper Bundle -->
  <g transform="translate(32, 118)" filter="url(#sh)">
    <rect width="205" height="472" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect width="205" height="34" rx="9" fill="#f1f5f9"/>
    <rect y="20" width="205" height="14" fill="#f1f5f9"/>
    <text x="14" y="22" class="sans sec-h" fill="#0f172a">1. Local Paper Bundle</text>
    <text x="14" y="52" class="mono tiny" fill="#b91c1c">.gitignore: never commit</text>

    <rect x="14" y="66" width="177" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="86" class="sans box-h">Open-Access Full Text</text>
    <text x="24" y="103" class="sans box-t">PDF, JATS XML, SI docs,</text>
    <text x="24" y="118" class="sans box-t">main &amp; supp. tables</text>

    <rect x="14" y="152" width="177" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="172" class="sans box-h">Author Raw Datasets</text>
    <text x="24" y="189" class="sans box-t">Dryad, OSF, Figshare,</text>
    <text x="24" y="204" class="sans box-t">eLife XLSX, SAXS .dat,</text>
    <text x="24" y="219" class="sans box-t">analysis code (.R / .py)</text>

    <rect x="14" y="244" width="177" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="264" class="sans box-h">Full-Res Figure Files</text>
    <text x="24" y="281" class="sans box-t">PNG/JPG/TIFF/vector PDF</text>
    <text x="24" y="296" class="sans box-t">for all main &amp; supp figs</text>

    <rect x="14" y="330" width="177" height="126" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="24" y="350" class="sans box-h" fill="#9a5800">manifest.yaml (Committed)</text>
    <text x="24" y="368" class="mono tiny">doi, oa_status, license</text>
    <text x="24" y="384" class="sans box-t">• OA-only policy initially</text>
    <text x="24" y="400" class="sans box-t">• Per-paper figure license</text>
    <text x="24" y="415" class="sans box-t">  gating (CC-BY public vs.</text>
    <text x="24" y="430" class="sans box-t">  local-only thumbnails)</text>
    <text x="24" y="445" class="sans box-t">• 100% file inventory</text>
  </g>

  <!-- Column 2: Dual Pillars -->
  <!-- Pillar A: LivingLit Record Engine -->
  <g transform="translate(274, 118)" filter="url(#sh)">
    <rect width="410" height="222" rx="9" fill="#ffffff" stroke="#0f5c6e" stroke-width="1.6"/>
    <rect width="410" height="34" rx="9" fill="#e6f3f6"/>
    <rect y="20" width="410" height="14" fill="#e6f3f6"/>
    <text x="14" y="22" class="sans sec-h" fill="#0f5c6e">2A. LivingLit Text, Table &amp; Claim Engine (Faithful Core)</text>

    <rect x="14" y="46" width="184" height="74" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="24" y="64" class="mono code">record.yaml + data.yaml</text>
    <text x="24" y="81" class="sans box-t">Units, groups, items, printed</text>
    <text x="24" y="96" class="sans box-t">values, raw cells, verbatim</text>
    <text x="24" y="111" class="sans box-t">anchors &amp; context_anchors</text>

    <rect x="212" y="46" width="184" height="74" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="222" y="64" class="mono code">terms.yaml (field_set: 3)</text>
    <text x="222" y="81" class="sans box-t">Lepidoptera (butterflies +</text>
    <text x="222" y="96" class="sans box-t">moths) vocab, NCBITaxon,</text>
    <text x="222" y="111" class="sans box-t">FlyBase, ChEBI, open slots</text>

    <rect x="14" y="132" width="184" height="76" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="24" y="150" class="mono code">derived.yaml + formulas/</text>
    <text x="24" y="167" class="sans box-t">SymPy formula verification</text>
    <text x="24" y="182" class="sans box-t">(Bragg, thin-film, FvK,</text>
    <text x="24" y="197" class="sans box-t">ratios, scaling laws)</text>

    <rect x="212" y="132" width="184" height="76" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="222" y="150" class="mono code">claims: (Within-Paper)</text>
    <text x="222" y="167" class="sans box-t">Abstract/Results/Discussion</text>
    <text x="222" y="182" class="sans box-t">assertions judged on 7 dims</text>
    <text x="222" y="197" class="sans box-t">+ direction contradiction flag</text>
  </g>

  <!-- Pillar B: Atomic Panels & Digitization (SHIFT 1) -->
  <g transform="translate(274, 356)" filter="url(#sh)">
    <rect width="410" height="234" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.6"/>
    <rect width="410" height="34" rx="9" fill="#e8f5ee"/>
    <rect y="20" width="410" height="14" fill="#e8f5ee"/>
    <text x="14" y="22" class="sans sec-h" fill="#166534">2B. Atomic Figure Panels &amp; Metrology Layer (Shift #1)</text>

    <rect x="14" y="46" width="184" height="78" rx="6" fill="#f8fafc" stroke="#86efac"/>
    <text x="24" y="64" class="mono code" fill="#166534">panels.yaml (1-Letter)</text>
    <text x="24" y="81" class="sans box-t">Strict atomic bboxes (no</text>
    <text x="24" y="96" class="sans box-t">top/bottom halves), panel</text>
    <text x="24" y="111" class="sans box-t">archetypes, scale bars, ROIs</text>

    <rect x="212" y="46" width="184" height="78" rx="6" fill="#f8fafc" stroke="#86efac"/>
    <text x="222" y="64" class="mono code" fill="#166534">extractors/*.py + lib</text>
    <text x="222" y="81" class="sans box-t">Bespoke per-figure scripts</text>
    <text x="222" y="96" class="sans box-t">using extract_lib.py (DP,</text>
    <text x="222" y="111" class="sans box-t">ribbons, IRLS, dotplot, FFT)</text>

    <rect x="14" y="136" width="382" height="84" rx="6" fill="#f2ecfa" stroke="#5b3a8c"/>
    <text x="24" y="154" class="mono code" fill="#5b3a8c">Unified overlay_meta + digitized/ Verified Cache (Shift #3)</text>
    <text x="24" y="172" class="sans box-t">• Plots: plot_box, curves + ±SD/CI bands, errorbars, box/dotplots</text>
    <text x="24" y="188" class="sans box-t">• Microscopy: scale bar, FFT ROI, phase-aligned grating, transects</text>
    <text x="24" y="204" class="sans box-t">• Priority: Author raw data &gt; Printed tables &gt; Per-figure .py script</text>
  </g>

  <!-- Column 3: Deterministic Gates -->
  <g transform="translate(722, 118)" filter="url(#sh)">
    <rect width="166" height="472" rx="9" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
    <rect width="166" height="34" rx="9" fill="#fce8e8"/>
    <rect y="20" width="166" height="14" fill="#fce8e8"/>
    <text x="12" y="22" class="sans sec-h" fill="#9f2222">3. 5 Hard Gates</text>

    <g transform="translate(12, 48)">
      <rect width="142" height="58" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
      <text x="10" y="20" class="mono code" fill="#9f2222">gate record</text>
      <text x="10" y="36" class="sans tiny">Quotes verified in text,</text>
      <text x="10" y="49" class="sans tiny">100% file accounting</text>
    </g>
    <g transform="translate(12, 116)">
      <rect width="142" height="58" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
      <text x="10" y="20" class="mono code" fill="#9f2222">gate figures</text>
      <text x="10" y="36" class="sans tiny">Re-runs data &amp; scripts;</text>
      <text x="10" y="49" class="sans tiny">exact cache match</text>
    </g>
    <g transform="translate(12, 184)">
      <rect width="142" height="58" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
      <text x="10" y="20" class="mono code" fill="#9f2222">gate terms</text>
      <text x="10" y="36" class="sans tiny">Controlled vocab +</text>
      <text x="10" y="49" class="sans tiny">ontology xref validity</text>
    </g>
    <g transform="translate(12, 252)">
      <rect width="142" height="58" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
      <text x="10" y="20" class="mono code" fill="#9f2222">gate derived</text>
      <text x="10" y="36" class="sans tiny">SymPy formula checks</text>
      <text x="10" y="49" class="sans tiny">&amp; unit consistency</text>
    </g>
    <g transform="translate(12, 320)">
      <rect width="142" height="138" rx="6" fill="#f2ecfa" stroke="#5b3a8c"/>
      <text x="10" y="20" class="mono code" fill="#5b3a8c">gate panels (New)</text>
      <text x="10" y="38" class="sans tiny">• Atomic 1-letter guard</text>
      <text x="10" y="53" class="sans tiny">• FFT 2× harmonic guard</text>
      <text x="10" y="68" class="sans tiny">• Plot span completeness</text>
      <text x="10" y="83" class="sans tiny">• Raw-data RMSE check</text>
      <text x="10" y="98" class="sans tiny">• Overlay QA sheets +</text>
      <text x="10" y="113" class="sans tiny">  qa/report.json flags</text>
    </g>
  </g>

  <!-- Column 4: Outputs (Shift 2 + Visualizer) -->
  <g transform="translate(926, 118)" filter="url(#sh)">
    <rect width="242" height="218" rx="9" fill="#ffffff" stroke="#9a5800" stroke-width="1.6"/>
    <rect width="242" height="34" rx="9" fill="#fef4e2"/>
    <rect y="20" width="242" height="14" fill="#fef4e2"/>
    <text x="12" y="22" class="sans sec-h" fill="#9a5800">4. Cross-Paper Engine (Shift #2)</text>
    <text x="14" y="54" class="sans box-h">Relaxed, User-Discretion</text>
    <text x="14" y="72" class="sans box-t">• Uses strictly evidence items &amp;</text>
    <text x="14" y="87" class="sans box-t">  values (never prose claims)</text>
    <text x="14" y="105" class="sans box-t">• Minimal must_match (same</text>
    <text x="14" y="120" class="sans box-t">  measure + compatible units)</text>
    <text x="14" y="138" class="sans box-t">• Every biological/method diff</text>
    <text x="14" y="153" class="sans box-t">  shown as explicit context diff</text>
    <text x="14" y="171" class="sans box-t">• Researcher toggles filters</text>
    <text x="14" y="186" class="sans box-t">  live; outputs tidy CSV/JSON</text>
    <text x="14" y="205" class="mono tiny" fill="#9a5800">values.csv · comparisons.csv · hub</text>
  </g>

  <g transform="translate(926, 356)" filter="url(#sh)">
    <rect width="242" height="234" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    <rect width="242" height="34" rx="9" fill="#e2e8f0"/>
    <rect y="20" width="242" height="14" fill="#e2e8f0"/>
    <text x="12" y="22" class="sans sec-h" fill="#0f172a">5. Modular Visualizer (web/)</text>
    <text x="14" y="54" class="sans box-h">Zero-Dependency JS / Canvas</text>
    <text x="14" y="72" class="sans box-t">• Panel Atlas &amp; True-Scale (µm/px)</text>
    <text x="14" y="88" class="sans box-t">• Live Plot + FFT Grating Overlays</text>
    <text x="14" y="104" class="sans box-t">• Inline .py Extractor Viewer</text>
    <text x="14" y="120" class="sans box-t">• Truth-Based Compare &amp; Graph</text>
    <text x="14" y="136" class="sans box-t">• Within-Paper Audit &amp; Drawer</text>
    <rect x="14" y="152" width="214" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="171" class="mono code" fill="#0f172a">Dual Build Targets:</text>
    <text x="24" y="189" class="sans box-t">1. Multi-file GitHub Pages (docs/)</text>
    <text x="24" y="205" class="sans box-t">2. Portable single-file overview.html</text>
  </g>

  <!-- Bottom Autonomous Skill Pipeline Bar -->
  <g transform="translate(32, 610)" filter="url(#sh)">
    <rect width="1136" height="72" rx="9" fill="#f2ecfa" stroke="#5b3a8c" stroke-width="1.5"/>
    <text x="18" y="26" class="sans sec-h" fill="#5b3a8c">Autonomous 5-Stage Agent Skill Pipeline (skills/) · Zero-Human-Babysitting After Pilot Sign-Off</text>
    <text x="18" y="48" class="mono" style="font-size:10.5px;fill:#3b0764">1. ingest-paper → 2. segment-panels (BBox QA) → 3. digitize-panels (parallel .py + overlay/FFT QA) → 4. read-record (5 gates) → 5. publish-site (Playwright CI)</text>
    <text x="18" y="63" class="sans tiny">Gold-standard validation pilot: 2024_Lloyd + 2026_Finet end-to-end before scaling autonomously to the remaining 6 open-access papers and future Lepidoptera papers.</text>
  </g>

  <!-- Connecting Arrows -->
  <path d="M 237 225 L 270 225" stroke="#0f5c6e" stroke-width="2" fill="none" marker-end="url(#arr-teal)"/>
  <path d="M 237 465 L 270 465" stroke="#166534" stroke-width="2" fill="none" marker-end="url(#arr-grn)"/>
  <path d="M 684 225 L 718 225" stroke="#0f5c6e" stroke-width="2" fill="none" marker-end="url(#arr-teal)"/>
  <path d="M 684 465 L 718 465" stroke="#166534" stroke-width="2" fill="none" marker-end="url(#arr-grn)"/>
  <!-- Link between Pillar A and Pillar B (readings/links) -->
  <path d="M 479 340 L 479 354" stroke="#475569" stroke-width="1.6" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)"/>
  <path d="M 888 225 L 922 225" stroke="#9a5800" stroke-width="2" fill="none" marker-end="url(#arr-amb)"/>
  <path d="M 888 465 L 922 465" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 1047 336 L 1047 352" stroke="#9a5800" stroke-width="2" fill="none" marker-end="url(#arr-amb)"/>
</svg>